<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Hack UX atlas</title>
<meta name="robots" content="noindex">
<style>
:root{--paper:#fbfaf6;--side:#f3f0e7;--ink:#24231f;--muted:#615e55;--line:#e3dfd3;--accent:#a33f31;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:16px 10px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
aside h2{font-size:12px;font-weight:400;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 10px 4px}
aside a{display:flex;gap:8px;padding:5px 10px;border-radius:7px;color:var(--ink);text-decoration:none}
aside a:hover{background:#e9e5d9}
aside a[aria-current=true]{background:#fff;box-shadow:0 0 0 1px var(--line)}
aside a span{margin-left:auto;color:var(--muted);font-size:13px}
main{padding:28px 32px 80px;max-width:1500px}
h1{font-size:28px;font-weight:400;margin:0 0 6px}
h3{font-size:19px;font-weight:400;margin:36px 0 10px}
.lead,.quiet{color:var(--muted)}
.lead{max-width:760px}
dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 16px;max-width:980px}
dt{color:var(--muted)}dd{margin:0}
.state{border-top:1px solid var(--line);padding-top:14px;margin-top:22px}
.state p{margin:0 0 10px}code{color:var(--muted);font-size:13px}
.pics{display:flex;gap:20px;align-items:flex-start}
.pics a{display:block;border:1px solid var(--line);background:#fff;line-height:0}
.pics img{display:block;width:100%;height:auto}
.p390{flex:0 0 230px}.p1280{flex:1 1 auto;max-width:880px}
table{border-collapse:collapse;width:100%;max-width:1100px}
td,th{text-align:left;font-weight:400;border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
th{color:var(--muted)}
.menu{display:none}
@media (max-width:760px){
 .app{display:block}aside{position:static;height:auto;display:none}aside.open{display:block}
 .menu{display:block;margin:12px 16px 0;padding:10px 14px;font:inherit;background:#fff;border:1px solid var(--line);border-radius:7px}
 main{padding:16px}.pics{flex-direction:column}.p390{flex:none;width:230px}dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<button class="menu" id="menu" aria-expanded="false">Screens</button>
<div class="app"><aside id="side"></aside><main id="main">Loading…</main></div>
<script>
// The atlas viewer: catalogue.json (every screen and state, with pictures), spec.json
// (each screen's design notes), features.json and changelog.json. Built by build.py.
(function(){
  var A = {};
  function esc(s){return String(s == null ? '' : s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function j(p){return fetch(p).then(function(r){return r.json()})}
  function screens(){var out=[];A.cat.groups.forEach(function(g){g.screens.forEach(function(s){out.push(s)})});return out}
  function spec(id){return (A.spec.screens||[]).concat(A.spec.public_pages||[]).find(function(s){return s.id===id})}
  function link(href,label,cur,extra){return '<a href="'+href+'" aria-current="'+cur+'">'+esc(label)+(extra||'')+'</a>'}
  function side(cur){
    var h=link('#','Overview',cur==='')+link('#features','Features',cur==='features')+link('#log','Changes',cur==='log');
    A.cat.groups.forEach(function(g){
      if(!g.screens.length) return;
      h+='<h2>'+esc(g.label)+'</h2>';
      g.screens.forEach(function(s){h+=link('#s='+esc(s.id),s.title,cur===s.id,'<span>'+s.states.length+'</span>')});
    });
    document.getElementById('side').innerHTML=h;
  }
  function overview(){
    var all=screens(),n=all.reduce(function(a,s){return a+s.states.length},0);
    var h='<h1>Simple Hack UX atlas</h1><p class="lead">Every Simple Hack screen and state as the app draws it, at 390 and 1280 px wide. The pictures are the baselines of the app’s catalogue (web/hack), so they change when a screen does. The design notes are spec.json’s, updated '+esc(A.spec.updated)+'.</p>';
    h+='<p>'+all.length+' screens, '+n+' states, '+A.features.length+' features.</p>';
    A.cat.groups.forEach(function(g){
      if(!g.screens.length) return;
      h+='<h3>'+esc(g.label)+'</h3><ul>'+g.screens.map(function(s){return '<li><a href="#s='+esc(s.id)+'">'+esc(s.title)+'</a> <span class="quiet">'+s.states.length+' states</span></li>'}).join('')+'</ul>';
    });
    return h;
  }
  function screenPage(id){
    var s=screens().find(function(x){return x.id===id});
    if(!s) return '<h1>Not found</h1><p><a href="#">Back to the overview</a></p>';
    var d=spec(id)||{},h='<h1>'+esc(s.title)+'</h1><p><code>'+esc(id)+'</code></p>';
    var rows=[['Moment',d.user_moment],['Purpose',d.purpose],['Main action',d.primary_action],['Layout',d.layout],['On a phone',d.phone]].filter(function(r){return r[1]});
    if(rows.length) h+='<dl>'+rows.map(function(r){return '<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>'}).join('')+'</dl>';
    var fs=(d.features||[]).map(function(f){var x=A.features.find(function(y){return y.id===f});return x?x.name:f});
    if(fs.length) h+='<p><span class="quiet">Features:</span> '+fs.map(esc).join(' · ')+'</p>';
    if((d.decisions||[]).length) h+='<h3>Decisions</h3><ul>'+d.decisions.map(function(x){return '<li>'+esc(x.q)+': '+esc(x.decision)+(x.why?' <span class="quiet">('+esc(x.why)+')</span>':'')+'</li>'}).join('')+'</ul>';
    h+='<h3>States</h3>';
    s.states.forEach(function(st){
      h+='<div class="state" id="'+esc(st.id)+'"><p>'+esc(st.title)+' <code>'+esc(st.id)+'</code></p><div class="pics">'+
        [390,1280].map(function(w){var src='pictures/'+esc(st.pic)+'-'+w+'.webp';return '<a class="p'+w+'" href="'+src+'" target="_blank" rel="noopener"><img loading="lazy" src="'+src+'" alt="'+esc(st.title)+' at '+w+' px"></a>'}).join('')+'</div></div>';
    });
    return h;
  }
  function featuresPage(){
    var where={};
    screens().forEach(function(s){var d=spec(s.id);((d&&d.features)||[]).forEach(function(f){(where[f]=where[f]||[]).push(s)})});
    return '<h1>Features</h1><p class="lead">Every capability and the screen that holds it.</p><table><tr><th>Feature</th><th>Role</th><th>Screen</th><th>API</th></tr>'+
      A.features.map(function(f){return '<tr><td>'+esc(f.name)+'<br><span class="quiet">'+esc(f.what)+'</span></td><td>'+esc(f.role)+'</td><td>'+(where[f.id]||[]).map(function(s){return '<a href="#s='+esc(s.id)+'">'+esc(s.title)+'</a>'}).join(', ')+'</td><td><code>'+esc(f.api)+'</code></td></tr>'}).join('')+'</table>';
  }
  function logPage(){
    return '<h1>Changes</h1><ul>'+A.log.map(function(c){return '<li>'+esc(c.date)+': '+esc(c.what)+'</li>'}).join('')+'</ul>';
  }
  function draw(){
    var hsh=location.hash.slice(1),isScreen=hsh.indexOf('s=')===0,id=isScreen?decodeURIComponent(hsh.slice(2)):hsh;
    side(id);
    document.getElementById('main').innerHTML=isScreen?screenPage(id):id==='features'?featuresPage():id==='log'?logPage():overview();
    document.getElementById('side').classList.remove('open');
    window.scrollTo(0,0);
  }
  document.getElementById('menu').addEventListener('click',function(){var s=document.getElementById('side');s.classList.toggle('open');this.setAttribute('aria-expanded',String(s.classList.contains('open')))});
  Promise.all([j('catalogue.json'),j('spec.json'),j('features.json'),j('changelog.json')]).then(function(a){
    A.cat=a[0];A.spec=a[1];A.features=a[2];A.log=a[3];
    window.addEventListener('hashchange',draw);draw();
  });
})();
</script>
</body>
</html>
