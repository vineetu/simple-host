<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Announcements · none yet · Simple Hack prototype</title>
<link rel="stylesheet" href="kit.css"><script src="nav.js"></script><script src="shell.js" defer></script></head>
<body class="booting" data-role="organiser" data-nav="announcements" data-stage="Sign-up open" data-next="12 people signed up · building starts Fri 30 Oct">
<main class="page">
<div class="ph"><div class="t"><h1>Announcements</h1><p>Updates for everyone in the event, on your public page and in participants' app.</p></div></div><div class="page narrow" style="padding:0"><form class="card" aria-labelledby="ann-h"><h2 id="ann-h" style="margin:0 0 14px">New announcement</h2>
<div class="field"><div class="lab-row"><label for="ann-title">Title</label><span class="counter">0 / 120</span></div><input class="input" id="ann-title" maxlength="120"></div>
<div class="field"><label for="ann-body">Message</label><textarea class="input" id="ann-body" rows="4" maxlength="3000"></textarea></div>
<label class="check"><input type="checkbox" id="ann-email"><div><b>Also email every participant</b><span>148 people. Editing it later never sends another email.</span></div></label>
<div class="card-foot"><span class="hint">Shows on your page and in the app straight away.</span><button class="btn primary" type="submit" id="ann-post">Post</button></div>
</form><p class="section-title">Posted</p>
<div class="empty-state"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8v4h3l6 4V4L6 8zm12-1.5a4 4 0 0 1 0 7"/></svg><h3>Nothing posted yet</h3><p style="margin-bottom:0">Your first announcement shows here, on your page and in participants' app.</p></div></div>
</main>
<script>
(function(){
  function closeAll(except){ document.querySelectorAll('.row-menu').forEach(function(m){ if(m!==except){ m.hidden=true; var b=m.parentNode.querySelector('[data-rowmenu]'); if(b) b.setAttribute('aria-expanded','false'); } }); }
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-rowmenu]');
    if(!b){ if(!e.target.closest('.row-menu')) closeAll(null); return; }
    var m=b.parentNode.querySelector('.row-menu'); closeAll(m); m.hidden=!m.hidden; b.setAttribute('aria-expanded',String(!m.hidden));
    if(!m.hidden){ var f=m.querySelector('button:not([disabled])'); if(f) f.focus(); }
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    document.querySelectorAll('.row-menu:not([hidden])').forEach(function(m){ m.hidden=true; var b=m.parentNode.querySelector('[data-rowmenu]'); if(b){ b.setAttribute('aria-expanded','false'); b.focus(); } });
  });
  var em=document.getElementById('ann-email'), post=document.getElementById('ann-post');
  if(em&&post) em.addEventListener('change',function(){ post.textContent=em.checked?'Post and email 148 people':'Post'; });
  document.querySelectorAll('.swatch input').forEach(function(r){ r.addEventListener('change',function(){ var pv=document.querySelector('.pub-event'); if(pv) pv.style.setProperty('--ev', r.dataset.c); }); });
  // the shell moves <main> after this runs, which resets the strip's scroll, so wait for load
  window.addEventListener('load',function(){ var cur=document.querySelector('.subnav [aria-current=page]'); if(cur&&window.matchMedia('(max-width:760px)').matches){ var n=cur.parentNode; n.scrollLeft=cur.offsetLeft-(n.clientWidth-cur.offsetWidth)/2; } });
  document.querySelectorAll('button.toggle').forEach(function(t){ t.addEventListener('click',function(){ var on=t.classList.toggle('on'); t.setAttribute('aria-checked',String(on)); }); });
})();
</script>
</body></html>
