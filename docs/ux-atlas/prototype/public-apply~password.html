<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Password sign-in · Simple Hack prototype</title><link rel="stylesheet" href="kit.css"></head>
<body><main class="pub"><header class="pub-top"><a class="wordmark" href="public-home.html">Simple Hack</a></header><section class="card" style="max-width:380px;margin:24px auto"><h1>Sign in</h1><form><label>Username or email<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required></label><div id="new" hidden><p>Choose a new password to finish signing in.</p><label>New password<input type="password" autocomplete="new-password" minlength="8"></label></div><button class="btn primary" type="submit">Sign in</button></form><button class="btn quiet" type="button" id="signup">Create an account</button><p class="small">On this install, the operator chooses whether account creation and emailed codes are available.</p><button class="btn quiet" type="button" id="temporary">Preview temporary password</button></section></main><script>document.querySelector('form').onsubmit=function(e){e.preventDefault();location.href='public-apply.html'};document.getElementById('signup').onclick=function(){document.querySelector('h1').textContent='Create account';document.querySelector('form button').textContent='Create account'};document.getElementById('temporary').onclick=function(){document.getElementById('new').hidden=false};</script></body></html>
