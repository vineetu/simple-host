<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team · Start a new team · Simple Hack prototype</title>
<link rel="stylesheet" href="kit.css"><script src="nav.js"></script><script src="shell.js" defer></script></head>
<body class="booting" data-role="participant" data-nav="team" data-stage="Sign-up open" data-next="Teams are forming">
<main class="page">
<div class="ph"><div class="t"><h1>Team</h1><p>You’re not on a team yet.</p></div></div><h2 class="section-title">How do you want to team up?</h2><div class="choices" role="radiogroup" aria-label="How do you want to team up?" data-tour="team-ways" style="grid-template-columns:1fr;max-width:640px;margin:0 0 20px"><label class="choice"><input type="radio" name="way" value="ask" data-go="participant-team.html"><span><b>Ask to join a team</b><span class="d">Pick a team that’s looking for people. Its admins say yes or no.</span></span></label><label class="choice"><input type="radio" name="way" value="code" data-go="participant-team~join-code.html"><span><b>Join with a link or code</b><span class="d">A teammate sent you their team link or code. You join straight away.</span></span></label><label class="choice on"><input type="radio" name="way" value="start" checked data-go="participant-team~start.html"><span><b>Start a new team</b><span class="d">You’ll be its admin. Share its link to bring people in.</span></span></label></div><section class="card" style="max-width:640px"><h2>Start a new team</h2><div class="field"><label for="tname">Team name</label><input class="input" id="tname" maxlength="80" autocomplete="off"><p class="help">You’ll be its admin. You can rename it later.</p></div><div class="card-foot"><button class="btn primary" type="button">Start team</button></div></section>
</main>
<script>
(function(){
  function closeAll(except){ document.querySelectorAll('.row-menu').forEach(function(m){ if(m!==except){ m.hidden=true; var b=m.parentNode.querySelector('[data-rowmenu]'); if(b) b.setAttribute('aria-expanded','false'); } }); }
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-rowmenu]');
    if(!b){ if(!e.target.closest('.row-menu')) closeAll(null); return; }
    var m=b.parentNode.querySelector('.row-menu'); closeAll(m); m.hidden=!m.hidden; b.setAttribute('aria-expanded',String(!m.hidden));
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeAll(null); });
  document.querySelectorAll('button.toggle').forEach(function(t){ t.addEventListener('click',function(){ var on=t.classList.toggle('on'); t.setAttribute('aria-checked',String(on)); }); });
  document.querySelectorAll('.choice input[data-go]').forEach(function(r){ r.addEventListener('change',function(){ location.href=r.getAttribute('data-go'); }); });
  document.querySelectorAll('[data-copy]').forEach(function(b){ b.addEventListener('click',function(){ try{ navigator.clipboard.writeText(b.getAttribute('data-copy')); }catch(e){} b.textContent='Copied'; }); });
  window.addEventListener('load',function(){ var cur=document.querySelector('.subnav [aria-current=page]'); if(cur&&window.matchMedia('(max-width:760px)').matches){ var n=cur.parentNode; n.scrollLeft=cur.offsetLeft-(n.clientWidth-cur.offsetWidth)/2; } });
})();
</script>
</body></html>
