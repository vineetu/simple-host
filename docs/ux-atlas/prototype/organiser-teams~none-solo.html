<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teams · Everyone placed · Simple Hack prototype</title>
<link rel="stylesheet" href="kit.css"><script src="nav.js"></script><script src="shell.js" defer></script></head>
<body class="booting" data-role="organiser" data-nav="teams" data-stage="Building" data-next="Entries close in 2 days · Sun 6:00 pm">
<template id="status"><span class="pill stage"><span class="d"></span>Building</span><span class="muted">Entries close in 2 days · Sun 6:00 pm</span><span class="grow"></span></template>
<main class="page">
<div class="ph"><div class="t"><h1>Teams</h1><p>6 teams · Everyone is on a team</p></div></div><div class="subnav-split"><nav class="subnav" aria-label="Teams sections"><a href="organiser-teams.html">Teams<span class="n">6</span></a><a href="organiser-teams~solo.html" aria-current="page">Not on a team</a><a href="organiser-teams~tracks.html">Tracks<span class="n">3</span></a><a href="organiser-teams~settings.html">Settings</a></nav><section class="sp" aria-labelledby="sp-h"><div class="sp-head"><h2 id="sp-h" tabindex="-1">Not on a team</h2><p>Approved participants without a team. Fill teams places everyone, or use a person’s menu to place one.</p><button class="btn primary" type="button" disabled>Fill teams</button></div><div class="empty-state"><svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l4 4 8-8"/></svg><h3>Everyone is on a team</h3><p>People who join later, or leave a team, show here.</p></div></section></div>
</main>
<script>
(function(){
  function closeAll(except){ document.querySelectorAll('.row-menu').forEach(function(m){ if(m!==except){ m.hidden=true; var b=m.parentNode.querySelector('[data-rowmenu]'); if(b) b.setAttribute('aria-expanded','false'); } }); }
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-rowmenu]');
    if(!b){ if(!e.target.closest('.row-menu')) closeAll(null); return; }
    var m=b.parentNode.querySelector('.row-menu'); closeAll(m); m.hidden=!m.hidden; b.setAttribute('aria-expanded',String(!m.hidden));
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeAll(null); });
  document.querySelectorAll('button.toggle').forEach(function(t){ t.addEventListener('click',function(){ var on=t.classList.toggle('on'); t.setAttribute('aria-checked',String(on)); }); });
  document.querySelectorAll('.choice input[data-go]').forEach(function(r){ r.addEventListener('change',function(){ location.href=r.getAttribute('data-go'); }); });
  document.querySelectorAll('[data-copy]').forEach(function(b){ b.addEventListener('click',function(){ try{ navigator.clipboard.writeText(b.getAttribute('data-copy')); }catch(e){} b.textContent='Copied'; }); });
  window.addEventListener('load',function(){ var cur=document.querySelector('.subnav [aria-current=page]'); if(cur&&window.matchMedia('(max-width:760px)').matches){ var n=cur.parentNode; n.scrollLeft=cur.offsetLeft-(n.clientWidth-cur.offsetWidth)/2; } });
})();
</script>
</body></html>
