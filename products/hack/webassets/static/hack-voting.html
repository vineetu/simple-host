<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>People's choice · Simple Hack</title>
  <link rel="icon" href="/favicon.svg?v=c" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=c">
  <link rel="icon" href="/favicon.ico?v=c" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=c">
  <link rel="stylesheet" href="/hack/kit.css">
  <link rel="stylesheet" href="/hack/public.css">
</head>
<body>
<div class="pub">

<header class="pub-top">
  <a class="wordmark" href="/">simple<b>·</b>hack</a>
  <span class="grow"></span>
  <a class="find-link" href="/directory">Find a hackathon</a>
  <a class="btn quiet" href="/events" id="top-account">Home</a>
</header>

<main>

<p class="crumbs"><a id="back" href="/events">&larr; Back to event</a></p>

<header class="hero">
  <h1 id="title">People's choice</h1>
  <p id="intro"></p>
</header>

<p class="muted small" id="live" role="status" aria-live="polite"></p>

<section id="vote-panel" hidden>
  <div class="note" id="vote-when" hidden></div>
  <div class="note warn" id="vote-ineligible" hidden></div>
  <div class="note bad" id="vote-check-error" hidden></div>
  <p id="vote-signin" class="muted small" hidden><a id="signin-link" href="/signin">Sign in to vote</a>. You can change your vote until voting closes.</p>
  <p id="vote-current" class="muted small"></p>
  <p class="muted small" id="vote-empty" hidden>No teams to vote for yet. Teams appear here once their site is live.</p>
  <div class="grid2" id="options"></div>
  <div id="ranking" hidden>
    <h2 class="section-title">Final votes</h2>
    <div id="ranking-list"></div>
  </div>
</section>

</main>

<footer class="pub-foot">
  <span>Made with Simple Hack</span>
  <a href="/privacy.html">Privacy</a>
  <a href="/terms">Terms</a>
  <a href="/report">Report a page</a>
  <a class="find-link" href="/directory">Find a hackathon</a>
</footer>

</div>
<script>
(function () {
  var m = location.pathname.match(/^\/e\/([^/]+)\/vote$/);
  if (!m) return;
  var slug = decodeURIComponent(m[1]);
  var base = '/v1/hack/events/' + encodeURIComponent(slug);
  var $ = function (id) { return document.getElementById(id); };
  var key = function () { try { return localStorage.getItem('apiKey') || ''; } catch (_) { return ''; } };
  // Same client-side-only signal the directory and the public event page use:
  // there is no server session on this static page, so the default stays the
  // neutral "Home" and only becomes "Sign in" once a missing key is confirmed.
  try {
    var top = $('top-account');
    if (top && !key()) top.textContent = 'Sign in';
  } catch (e) {}
  $('back').href = '/e/' + encodeURIComponent(slug);
  $('signin-link').href = '/signin?next=' + encodeURIComponent(location.pathname);
  function live(msg, bad) { $('live').textContent = msg; $('live').className = 'muted small' + (bad ? ' live-err' : msg ? ' live-ok' : ''); }
  function node(tag, text, cls) { var n = document.createElement(tag); n.textContent = text; if (cls) n.className = cls; return n; }
  async function request(method, path, body, signed) {
    var headers = {}; if (signed) headers['X-API-Key'] = key();
    if (body) headers['Content-Type'] = 'application/json';
    var r = await fetch(path, { method:method, headers:headers, body:body ? JSON.stringify(body) : undefined });
    var data = await r.json().catch(function () { return {}; });
    return { ok:r.ok, status:r.status, data:data };
  }
  // One zone-label source (Grok re-test #5): this is a straight copy of the
  // app kit's own ui.zoneAbbr (host/handler/static/hack/ui.js) -- same
  // map, same CET/London daylight check, same GMT+N fallback -- kept here
  // because this page is not an ES module and can't import ui.js. Keep the
  // two in step by hand; the Go public page's hackZoneAbbr (hack_eventpage.go)
  // uses the same table again, straight off tzdata.
  var AU_ZONES = {
    'Australia/Sydney': ['AEST', 'AEDT'], 'Australia/Melbourne': ['AEST', 'AEDT'], 'Australia/Hobart': ['AEST', 'AEDT'],
    'Australia/Canberra': ['AEST', 'AEDT'], 'Australia/Brisbane': ['AEST'], 'Australia/Adelaide': ['ACST', 'ACDT'],
    'Australia/Darwin': ['ACST'], 'Australia/Perth': ['AWST']
  };
  var ZONE_ABBR = {
    'Asia/Jakarta':'WIB', 'Asia/Pontianak':'WIB',
    'Asia/Makassar':'WITA',
    'Asia/Jayapura':'WIT',
    'Asia/Tokyo':'JST',
    'Asia/Seoul':'KST',
    'Asia/Singapore':'SGT',
    'Asia/Kolkata':'IST', 'Asia/Calcutta':'IST'
  };
  var CET_ZONES = ['Europe/Paris', 'Europe/Berlin', 'Europe/Madrid', 'Europe/Rome', 'Europe/Amsterdam', 'Europe/Brussels', 'Europe/Vienna', 'Europe/Prague', 'Europe/Warsaw', 'Europe/Zurich', 'Europe/Stockholm', 'Europe/Copenhagen', 'Europe/Budapest', 'Europe/Luxembourg'];
  function zoneKnown(tz) {
    try { new Intl.DateTimeFormat('en-US', { timeZone: tz || 'UTC' }).format(0); return true; } catch (_) { return false; }
  }
  function offsetMinutes(zone, d) {
    try {
      var parts = new Intl.DateTimeFormat('en-US', { timeZone:zone, timeZoneName:'shortOffset' }).formatToParts(d);
      var tz = parts.find(function (p) { return p.type === 'timeZoneName'; });
      var raw = (tz && tz.value) || '';
      var m = raw.match(/GMT([+-]\d{1,2})(?::?(\d{2}))?/);
      if (!m) return null;
      var sign = m[1].charAt(0) === '-' ? -1 : 1;
      return sign * (Math.abs(Number(m[1])) * 60 + Number(m[2] || 0));
    } catch (_) { return null; }
  }
  function gmtOffsetLabel(zone, d) {
    var mins = offsetMinutes(zone, d);
    if (mins == null) return '';
    if (mins === 0) return 'GMT';
    var sign = mins < 0 ? '-' : '+';
    var abs = Math.abs(mins);
    var h = Math.floor(abs / 60), m = abs % 60;
    return 'GMT' + sign + h + (m ? ':' + (m < 10 ? '0' + m : m) : '');
  }
  function inDaylight(zone, d) {
    var jan = offsetMinutes(zone, new Date(d.getFullYear(), 0, 1, 12));
    var cur = offsetMinutes(zone, d);
    return jan != null && cur != null && cur !== jan;
  }
  function zoneLabel(iana, d) {
    if (!zoneKnown(iana)) return '';
    var raw = '';
    try {
      var parts = new Intl.DateTimeFormat('en-US', { timeZone:iana, timeZoneName:'short' }).formatToParts(d);
      var tz = parts.find(function (p) { return p.type === 'timeZoneName'; });
      raw = ((tz && tz.value) || '').replace(/^\s+|\s+$/g, '');
      if (raw && !/^(GMT|UTC)?[+-]\d/.test(raw)) return raw;
    } catch (_) {}
    if (ZONE_ABBR[iana]) return ZONE_ABBR[iana];
    if (iana === 'Europe/London' || iana === 'Europe/Dublin') return inDaylight(iana, d) ? (iana === 'Europe/Dublin' ? 'IST' : 'BST') : 'GMT';
    if (CET_ZONES.indexOf(iana) !== -1) return inDaylight(iana, d) ? 'CEST' : 'CET';
    if (AU_ZONES[iana]) {
      var au = AU_ZONES[iana];
      if (!au[1]) return au[0];
      var jan = offsetMinutes(iana, new Date(d.getFullYear(), 0, 1, 12)), jul = offsetMinutes(iana, new Date(d.getFullYear(), 6, 1, 12)), cur = offsetMinutes(iana, d);
      return (jan != null && jul != null && cur != null && cur > Math.min(jan, jul)) ? au[1] : au[0];
    }
    return gmtOffsetLabel(iana, d) || raw;
  }
  function humanTime(s, zone) {
    if (!s) return '';
    var d = new Date(s);
    if (isNaN(d.getTime())) return s;
    try {
      var out = new Intl.DateTimeFormat('en-GB', { timeZone:zone || 'UTC', weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit', hour12:true }).format(d);
      out = out.replace('AM', 'am').replace('PM', 'pm');
      var abbr = zoneLabel(zone || 'UTC', d);
      return abbr ? out + ' ' + abbr : out;
    } catch (_) { return d.toLocaleString(); }
  }
  function possessive(name) { return name ? name + (/s$/i.test(name) ? "'" : "'s") : ''; }
  // Confusing #4 (retest 3): a signed-in visitor who doesn't qualify under
  // the event's voting eligibility used to see an active Vote button and
  // only found out from a raw "this account is not eligible to vote" after
  // pressing it. Same copy for the up-front note and the PUT /vote error,
  // so a mid-visit eligibility change reads the same way either path.
  function ineligibleNote(eligibility) {
    if (eligibility === 'participants') return 'Only approved participants can vote in this event.';
    if (eligibility === 'event_members') return 'Only approved event members can vote in this event.';
    return 'Your account is not eligible to vote in this event.';
  }
  async function loadVote() {
    var r = await request('GET', base + '/vote');
    if (!r.ok) { live(r.data.error || 'Voting page unavailable.', true); return; }
    var d = r.data; $('title').textContent = "People's choice · " + d.title;
    $('vote-panel').hidden = false; $('live').textContent = '';
    var status = d.status, zone = d.time_zone || 'UTC';
    $('intro').textContent = status === 'open' ? 'Choose one team. You can change your vote until voting closes.' : status === 'upcoming' ? 'Voting opens soon.' : status === 'closed' ? 'Voting has closed. Here are the final votes.' : "Voting isn't open for this event.";
    $('vote-when').hidden = !(d.opens_at && d.closes_at);
    $('vote-when').textContent = d.opens_at && d.closes_at ? 'Open ' + humanTime(d.opens_at, zone) + ' to ' + humanTime(d.closes_at, zone) : '';
    $('vote-signin').hidden = status !== 'open' || !!key();
    // Codex review: eligible used to default to true and a failed /my-vote
    // (network blip, a 401 mid-session, a 5xx) was silently ignored,
    // leaving the Vote button active even though the lookup that was
    // supposed to justify showing it never actually came back. null means
    // "don't know yet" -- vote controls stay unavailable until it resolves
    // true, and a failed lookup shows a retryable error instead of quietly
    // assuming the best.
    var chosen = '', eligible = null, checkFailed = false, ownTeam = '';
    if (key() && (status === 'open' || status === 'closed')) {
      // request() has no try/catch of its own around fetch -- a network-
      // level failure (not just a non-2xx response) must not take down the
      // rest of this render (options, the vote-when note, ranking): it's
      // caught here and folded into the same "don't know yet" state a 4xx/5xx
      // already produces above.
      try {
        var own = await request('GET', base + '/my-vote', null, true);
        if (own.ok) { chosen = own.data.team || ''; eligible = own.data.eligible !== false; ownTeam = own.data.own_team || ''; }
        else checkFailed = true;
      } catch (_) { checkFailed = true; }
    }
    $('vote-ineligible').hidden = !(status === 'open' && key() && eligible === false);
    $('vote-ineligible').textContent = eligible === false ? ineligibleNote(d.eligibility) : '';
    $('vote-check-error').hidden = !(status === 'open' && key() && checkFailed);
    $('vote-check-error').textContent = '';
    if (status === 'open' && key() && checkFailed) {
      $('vote-check-error').appendChild(node('span', "Couldn't check whether you can vote. "));
      var retry = node('button', 'Retry', 'btn sm'); retry.type = 'button';
      retry.addEventListener('click', function () { loadVote().catch(function () { live('Cannot reach the server.', true); }); });
      $('vote-check-error').appendChild(retry);
    }
    var options = $('options'); options.textContent = '';
    (d.options || []).forEach(function (o) {
      var box = node('article', '', 'card');
      box.appendChild(node('h2', o.title));
      if (o.tagline) box.appendChild(node('p', o.tagline, 'sub'));
      var row = node('div', '', 'row-flex');
      var link = node('a', 'View ' + possessive(o.team_name) + ' site', 'btn sm'); link.href = o.url; link.target = '_blank'; link.rel = 'noopener'; row.appendChild(link);
      if (status === 'open' && key() && ownTeam === o.team) {
        row.appendChild(node('span', 'This is your team', 'pill'));
      } else if (status === 'open' && key() && eligible === true && chosen === o.team) {
        row.appendChild(node('span', 'Your current vote', 'pill ok'));
      } else if (status === 'open' && key() && eligible === true) {
        var btn = node('button', 'Vote for this team', 'btn primary sm'); btn.type = 'button';
        btn.addEventListener('click', async function () {
          btn.disabled = true;
          try {
            var v = await request('PUT', base + '/vote', { team:o.team }, true);
            if (!v.ok) { live(v.data.code === 'vote_ineligible' ? ineligibleNote(d.eligibility) : v.data.code === 'own_team_vote' ? "You can't vote for your own team." : (v.data.error || 'Could not save vote.'), true); btn.disabled = false; return; }
            chosen = o.team; $('vote-current').textContent = 'Your vote: ' + o.team_name;
            await loadVote();
            live(v.data.changed ? 'Vote changed.' : 'Vote saved.');
          } catch (_) { live('Cannot reach the server.', true); btn.disabled = false; }
        });
        row.appendChild(btn);
      } else if (status === 'open' && !key()) {
        var signin = node('a', 'Sign in to vote', 'btn sm'); signin.href = '/signin?next=' + encodeURIComponent(location.pathname);
        row.appendChild(signin);
      }
      box.appendChild(row); options.appendChild(box);
    });
    // Confusing #2 (Grok re-test, round 4): with no team sites live yet, the
    // header showed and then nothing -- no teams, no explanation. Shown for
    // anyone not already told why they can't vote (checkFailed's retry note,
    // or the ineligible note above): a signed-out visitor and an eligible
    // signed-in one both get it, since the gap is the same either way.
    $('vote-empty').hidden = !(status === 'open' && (d.options || []).length === 0 && eligible !== false && !checkFailed);
    var chosenOption = (d.options || []).find(function (o) { return o.team === chosen; });
    if (status === 'open') $('vote-current').textContent = chosen ? 'Your vote: ' + (chosenOption ? chosenOption.team_name : chosen) : '';
    if (status === 'closed') $('vote-current').textContent = chosen ? 'You voted for ' + (chosenOption ? chosenOption.team_name : chosen) : '';
    if (status === 'closed') {
      $('ranking').hidden = false; var list = $('ranking-list'); list.textContent = '';
      (d.ranking || []).forEach(function (r, i) {
        var row = node('div', '', 'row-flex');
        row.appendChild(node('span', (i+1) + '. ' + r.team_name));
        row.appendChild(node('span', '', 'grow'));
        row.appendChild(node('strong', r.votes + (r.votes === 1 ? ' vote' : ' votes')));
        list.appendChild(row);
      });
    }
  }
  loadVote().catch(function () { live('Cannot reach the server.', true); });
})();
</script>
</body>
</html>
