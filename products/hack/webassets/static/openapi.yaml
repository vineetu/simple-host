              "Location": {
                "schema": {
                  "type": "string"
                }
              },
              "Set-Cookie": {
                "description": "The unlock cookie: __Host-sh_pass_\u003cid\u003e, HttpOnly, Secure, SameSite=Lax, Path=/, about 400 days",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
