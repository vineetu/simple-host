          "400": {
            "description": "Invalid",
            "expired": null,
            "or mismatched ticket or form token": null,
            "replayed": null
          },
          "403": {
            "description": "Wrong host or origin"
          },
          "429": {
            "description": "IP rate limit exceeded"
          }
        },
        "security": [],
        "summary": "Confirm sign-out on this browser",
        "tags": [
          "Visitor sign-in"
        ]
      }
