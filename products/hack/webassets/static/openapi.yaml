        "description": "Includes account_name (string), the signed-in account name or an empty string when none is known. Signed out allowed; a valid X-API-Key meters the account instead of the shared network address. 404 event_not_found for a draft, taken-down or unknown event (identical body, so a draft's existence does not leak). fields (city, country, age_range, gender) are fixed product choices, always present. signup_questions, coc_default and coc_text are present only when signed in AND applications are open right now (not when the organiser's switch is off or the stage has moved past it) -- these used to need the join code, and a closed or switched-off event must not become a way to read them with only an account. me is present only when signed in and already a member (null otherwise), with role, joined_via and, for a participant, approval_status; it is returned either way, open or closed. closed_reason is null, applications_off, not_listed (the event is not in Find a hackathon, which takes no applications) or signup_over.",
