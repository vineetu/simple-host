                  },
                  "confirm": {
                    "description": "Exact event address name (slug)",
                    "type": "string"
                  },
                  "successor_user_id": {
                    "description": "Creator only: another organiser of this event, from the preview",
                    "format": "uuid",
                    "type": "string"
                  }
                },
                "required": [
                  "confirm"
                ],
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "properties": {
                    "case": {
                      "enum": [
                        "participant",
                        "applicant",
                        "judge",
                        "co_organiser",
                        "creator",
                        "last_organiser"
                      ],
                      "type": "string"
                    },
                    "event": {
                      "enum": [
                        "kept",
                        "ended",
                        "deleted"
                      ],
                      "type": "string"
                    },
                    "left": {
                      "type": "boolean"
                    },
                    "successor": {
                      "properties": {
                        "display_name": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "team_deleted": {
                      "type": "boolean"
                    }
                  },
                  "type": "object"
                }
              }
            },
            "description": "Left (or, for the only organiser, ended or deleted the event too)"
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "event_taken_down"
          },
          "404": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "event_not_found"
          },
          "409": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "leave_needs_confirm, event_closed, successor_required, invalid_successor, last_organiser, archive_needs_participants or leave_state_changed"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          }
        },
        "security": [
          {
            "apiKey": []
