    "/v1/hack/team-links/{code}": {
      "get": {
        "description": "Teams redesign, 2026-10-31. Public, signed in or out; same rate limiter as GET .../join/{code}. code accepts either the bare team code or the whole team link. Never writes and never joins (safe to prefetch or unfurl). Never a member's name or email. you is null signed out, else {status}: not_in_event, pending, rejected, judge, organiser, no_team, on_this_team, or on_other_team (+ team_name, the other team's own name). reason is null, locked, full or teams_closed (stage not open/building, or the team's own deadline passed). A taken-down event or an unknown code is 404 team_link_not_found.",
        "operationId": "getHackTeamLink",
        "parameters": [
          {
            "in": "path",
            "name": "code",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "properties": {
                    "event": {
                      "properties": {
                        "applications_open": {
                          "description": "Whether this event actually takes an application right now (same rule as GET /v1/hack/events/{slug}/apply: the organiser's switch, directory listing, stage open/building, and not taken down), not the raw per-event switch.",
                          "type": "boolean"
                        },
                        "slug": {
                          "type": "string"
                        },
                        "stage": {
                          "type": "string"
                        },
                        "title": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "joinable": {
                      "type": "boolean"
                    },
                    "reason": {
                      "enum": [
                        "locked",
                        "full",
                        "teams_closed",
                        null
                      ],
                      "nullable": true,
                      "type": "string"
                    },
                    "team": {
                      "properties": {
                        "member_count": {
                          "type": "integer"
                        },
                        "name": {
                          "type": "string"
                        },
                        "team_size_max": {
                          "type": "integer"
                        },
                        "track": {
                          "nullable": true,
                          "properties": {
                            "name": {
                              "type": "string"
                            }
                          },
                          "type": "object"
                        }
                      },
                      "type": "object"
                    },
                    "you": {
                      "nullable": true,
                      "properties": {
                        "status": {
                          "enum": [
                            "not_in_event",
                            "pending",
                            "rejected",
                            "judge",
                            "organiser",
                            "no_team",
                            "on_this_team",
                            "on_other_team"
                          ],
                          "type": "string"
                        },
                        "team_name": {
                          "description": "Only with on_other_team.",
                          "type": "string"
