    "/v1/sites/{sitename}/storage/sqlite/{name}/tables/{table}/rows": {
      "get": {
        "description": "Checked against the table's read value (its own preset, or the database's). Equality filters where.{column}=value (at most three, real columns only) are bound values. Visitors see their own visitor_id and null for other people's, plus mine per row; visitor_id cannot be filtered or ordered by visitors. Own reads use WHERE visitor_id = ? with the stable site-session identity. Table and order columns are checked against real schema; values are bound. Default order is an unshadowed rowid alias ascending; ordinary rowid tables only. Cursor includes order value and rowid, bound on the next query with matching order/desc. Owner sees all. No visitor SQL accepted. HEAD is a read. Visitor tables are limited to 100 columns and the complete response to SITE_STORAGE_SQL_RESULT_MAX_BYTES; visitor queries time out after one second. Reads do not lock writes or deploys.",
        "operationId": "listStorageTableRows",
        "parameters": [
          {
            "in": "path",
            "name": "sitename",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
