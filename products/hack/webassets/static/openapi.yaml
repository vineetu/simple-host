    "/v1/hack/events/{slug}/public": {
      "get": {
        "description": "Cross-origin GET is allowed without credentials. Private join codes, contact addresses, unpublished scores, voter identities, open-vote counts and approval_required are omitted. Adds applications_open and, only when true, apply_url. Gallery items carry tools (the entry's tags). Each shown results row always carries overall (boolean, true for an overall winner) and carries entry (HackResultCard) when the results were published with cards; rows the visibility setting hides are not emitted, so their cards never appear. fixed_schedule lists the event's real times as read-only schedule rows (HackFixedScheduleRow, without prompts), and schedule rows carry no prompt. Carries theme (the organiser's whole-page Look style, or empty for Classic) alongside the usual colour fields.",
        "operationId": "getHackPublicEvent",
        "parameters": [
          {
            "in": "path",
            "name": "slug",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "properties": {
                    "announcements": {
                      "description": "Pinned first then newest; body_html is safe server-rendered HTML.",
                      "items": {
                        "$ref": "#/components/schemas/HackEventAnnouncement"
                      },
                      "type": "array"
                    },
                    "overall_prizes": {
                      "description": "Prizes for 1st, 2nd, 3rd by index; always an array.",
                      "items": {
                        "type": "string"
                      },
                      "maxItems": 3,
                      "type": "array"
                    },
                    "results": {
                      "items": {
                        "properties": {
                          "overall": {
                            "description": "True for an overall winner; false otherwise.",
                            "type": "boolean"
                          },
                          "overall_prize": {
                            "description": "Place and prize, such as 1st · $300; empty when unset, including when ranks are hidden.",
                            "type": "string"
                          }
                        },
                        "required": [
                          "overall",
                          "overall_prize"
                        ],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "submissions": {
                      "description": "Empty unless submissions_public is on and stage is judging, results or archived. Screenshot URLs are absolute and support cross-origin images.",
                      "items": {
                        "$ref": "#/components/schemas/HackSubmission"
                      },
                      "type": "array"
                    },
                    "submissions_public": {
                      "type": "boolean"
                    }
                  },
                  "type": "object"
                }
              }
            },
            "description": "Public event fields, applications_open (and apply_url when open), gallery if open, published results and vote counts only after voting closes."
          },
          "404": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "Event not found or taken down"
          }
        },
        "summary": "Public, credentialless event data for custom websites (EVENTS=hosted)",
        "tags": [
          "Hosted events"
        ]
      }
    },
