        "description": "Same-origin form POST with Sec-Fetch-Site validation and a one-use form token bound to the current SSO pass and server-stored hop. No account API accepts the SSO cookie.",
        "operationId": "consentSSO",
        "requestBody": {
          "content": {
            "application/x-www-form-urlencoded": {
              "schema": {
                "properties": {
                  "form_token": {
                    "type": "string"
                  },
                  "state": {
                    "type": "string"
                  }
                },
                "required": [
                  "state",
                  "form_token"
                ],
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "302": {
            "description": "Consent remembered; navigate to the site's establish endpoint"
          },
          "400": {
            "description": "Invalid or expired hop"
          },
          "401": {
            "description": "Sign in on the apex first"
          },
          "403": {
            "description": "Invalid form token or origin"
          },
          "429": {
            "description": "IP rate limit exceeded"
          }
        },
        "security": [],
        "summary": "Remember consent and continue to a site",
        "tags": [
          "Visitor sign-in"
        ]
      }
    },
    "/v1/sso/consents/{site}": {
