    "/v1/sso/hop": {
      "get": {
        "description": "Uses only the apex SSO cookie. Shows the shared account sign-in card if absent, asks consent once per person and site including named viewers, or redirects with a 60-second host- and nonce-bound one-time establish code. The return address is read only from server state. No-store, no-referrer, and frame-ancestors none.",
        "operationId": "hopSSO",
        "parameters": [
          {
            "in": "query",
            "name": "state",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "description": "Browser-bound owner provider token",
            "in": "query",
            "name": "token",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "description": "Provider browser nonce hash",
            "in": "query",
            "name": "cn",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Apex sign-in or consent card"
          },
          "302": {
            "description": "Navigate to the site's establish endpoint"
          },
          "400": {
            "description": "Missing",
            "or expired state": null,
            "used": null
          },
          "403": {
            "description": "Wrong origin or non-document request"
          },
          "429": {
            "description": "IP rate limit exceeded"
          }
        },
        "security": [],
        "summary": "Continue site sign-in on the account apex",
        "tags": [
          "Visitor sign-in"
        ]
      }
    },
    "/v1/sso/session": {
      "post": {
        "description": "Same-origin apex POST authenticated by a live stored full account key. Sets a pass cookie if the browser does not already hold a live pass for this key. Browser sign-in calls this after verification; the dashboard also calls it after loading. Replacing a different browser pass revokes its old parent key and site sessions. Issuance is limited per IP and key and retains at most one pass per parent key. Deploy keys and connector credentials cannot bootstrap it.",
        "operationId": "bootstrapSSO",
        "responses": {
          "204": {
            "description": "Apex SSO cookie ready"
          },
          "401": {
            "description": "Missing",
            "expired": null,
            "or unsuitable account key": null,
            "suspended": null
          },
          "403": {
            "description": "Wrong host or origin"
          },
          "429": {
            "description": "Pass issuance rate limit exceeded"
          }
        },
        "security": [
          {
            "apiKey": []
          }
        ],
        "summary": "Add the apex sign-in cookie to an existing dashboard session",
        "tags": [
          "Visitor sign-in"
        ]
      }
    },
    "/v1/sso/signed-out": {
      "get": {
        "description": "Rate-limited top-level navigation after site sign-out. Consumes the one-use ticket silently only when its live requesting site session's parent hash matches this browser's apex cookie. Otherwise shows a shared-card confirmation with a form token and Cancel link. On completion, clears the cookie and serves an apex page that revokes and removes the browser's localStorage dashboard key before navigating to the server-stored return address, even when the pass row has been swept.",
