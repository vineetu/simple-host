            "type": "integer"
          }
        },
        "required": [
          "changes",
          "last_insert_id"
        ],
        "type": "object"
      },
      "StorageRuleError": {
        "properties": {
          "clause": {
            "description": "Clause or validation bound that failed.",
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "policy": {
            "description": "Policy name or empty for a set-level error.",
            "type": "string"
          },
          "position": {
            "description": "UTF-8 byte offset or -1 when no offset applies.",
            "type": "integer"
          },
          "table": {
            "description": "Table name or empty for resource defaults.",
            "type": "string"
          }
        },
        "required": [
          "table",
          "policy",
          "clause",
          "position",
          "message"
        ],
        "type": "object"
      },
      "StorageSQL": {
        "description": "Errors (body {error, code}): the error text says what happened and what to do; the owner's messages also list the real tables or columns. sql_request (body, empty or too long sql, over 100 params), sql_params (a param is not one value), sql_syntax (SQLite's syntax message and the word it stopped at), sql_multiple_statements (send one statement per call), sql_param_count (placeholders and params differ), sql_not_available (PRAGMA, ATTACH, temp or virtual tables, transactions, load_extension), sql_use_query, sql_use_execute and sql_use_schema (the statement belongs on another route), sql_no_such_table, sql_no_such_column, sql_no_such_function, sql_unique_failed (409), sql_not_null_failed, sql_check_failed, sql_foreign_key_failed (naming the column), sql_constraint_failed (column names for the owner only), sql_visitor_rule (403, which read rule refused a legacy visitor statement), sql_timeout, sql_value_too_large, sql_error (any other SQLite message), storage_busy (503). Visitors never see table or column lists, and no message holds a file path.",
        "properties": {
          "params": {
            "description": "Positional JSON scalar values",
            "items": {
              "nullable": true
            },
            "type": "array"
          },
          "sql": {
            "description": "One SQLite statement; use bound question-mark parameters.",
            "type": "string"
          }
        },
        "required": [
          "sql"
        ],
        "type": "object"
      }
    },
    "securitySchemes": {
      "apiKey": {
        "in": "header",
        "name": "X-API-Key",
        "type": "apiKey"
      },
      "connector": {
        "description": "Per-person OAuth 2.1 (authorization code; PKCE S256 required for every self-registered client). On Simple Host, a REST-audience access token sent as `Authorization: Bearer` acts as that person's X-API-Key. On hosted Simple Hack, new consent issues one personal `sites events` grant for all event roles. MCP `hack_select_team` stores a publishing team on that grant; each website call rechecks approved membership and uses a separate scoped team credential. Legacy `sites team:\u003cuuid\u003e` grants remain site-only. Event roles still control each operation. MCP-audience tokens work only on /mcp. Optional MCP Apps My sites and dashboard use these same team and organiser tools; their default-off flags do not change REST permissions or routes. Discovery at /.well-known/oauth-authorization-server publishes the scopes available on this instance; events is offered only in hosted hack mode.",
        "flows": {
          "authorizationCode": {
            "authorizationUrl": "https://simple-host.app/oauth/authorize",
            "refreshUrl": "https://simple-host.app/oauth/token",
            "scopes": {
              "events": "Act as the signed-in person across their Simple Hack events and roles",
              "sites": "Publish and manage your sites and their data"
            },
            "tokenUrl": "https://simple-host.app/oauth/token"
          }
        },
        "type": "oauth2"
      }
    }
  },
