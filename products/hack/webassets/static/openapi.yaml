    "/v1/auth": {
      "post": {
        "description": "For Simple Host account owners and their agents, never for a site's visitors. Answers only on the app's own address: on a site's address, a person's address, a connected domain, or from a page's origin it is 403 account_auth_unavailable, and no code is sent. A page signs its visitors in with POST /v1/sites/{sitename}/visitor/auth through auth.js instead. Emails a 6-digit code (and a magic link) to the address. No user row is created here — the account is created lazily on the first successful verify, so this can't be used to enumerate users.",
        "operationId": "postAuth",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "properties": {
                  "email": {
                    "example": "you@example.com",
                    "format": "email",
                    "type": "string"
                  },
                  "nonce_hash": {
                    "description": "Browser pages only. base64url SHA-256 of a random nonce the page keeps. With it the email also carries a sign-in link, redeemable only together with that nonce (so only in that browser). Without it the email carries the code alone.",
                    "type": "string"
                  }
                },
                "required": [
                  "email"
                ],
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "202": {
            "content": {
              "application/json": {
                "schema": {
                  "properties": {
                    "email": {
                      "type": "string"
                    },
                    "expires_in_seconds": {
                      "example": 900,
                      "type": "integer"
                    },
                    "message": {
                      "example": "We sent a 6-digit code to you@example.com.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                }
              }
            },
            "description": "Code sent"
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "403": {
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/ErrorResponse"
                    },
                    {
                      "properties": {
                        "code": {
                          "enum": [
                            "account_auth_unavailable",
                            "email_signin_off"
                          ],
                          "type": "string"
                        }
                      },
                      "type": "object"
                    }
                  ]
                }
              }
            },
            "description": "account_auth_unavailable: account sign-in answers only on the app's own address; a page's visitors use visitor sign-in (auth.js SH.mount). Or email_signin_off (EMAIL_SIGNIN=off): sign in with the company account button instead."
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          }
        },
        "summary": "Request an account sign-in code (account owners only)",
        "tags": [
          "Auth"
        ]
      }
    },
    "/v1/auth/oauth/providers": {
      "get": {
        "description": "Public discovery for pages and the dashboard: auth.js reads it from a site to offer Google; it is not account sign-in and sets nothing. Google, GitHub and a company's own identity provider (oidc). Returns the enabled provider names so pages never hardcode a provider. Empty when sign-in is not configured. Sign-in creates or links a `users` row; a hosted-page session still does not disclose an API key.",
        "operationId": "getOAuthProviders",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "properties": {
                    "email_enabled": {
                      "description": "Whether email-code sign-in is configured and EMAIL_SIGNIN is not off",
                      "type": "boolean"
                    },
                    "oidc_label": {
                      "description": "The company sign-in button's name (OIDC_LABEL). Present only when oidc is in providers.",
                      "example": "your company account",
                      "type": "string"
                    },
                    "password": {
                      "description": "Present only when password sign-in is enabled on this install.",
                      "properties": {
                        "enabled": {
                          "type": "boolean"
                        },
                        "self_signup": {
                          "type": "boolean"
                        }
                      },
                      "type": "object"
                    },
                    "providers": {
                      "example": [
                        "google"
                      ],
                      "items": {
                        "enum": [
                          "google",
                          "github",
                          "oidc"
                        ],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "sso_enabled": {
                      "description": "Whether site Sign in should use the apex SSO hop",
                      "type": "boolean"
                    }
                  },
                  "required": [
                    "providers",
                    "email_enabled"
                  ],
                  "type": "object"
                }
              }
            },
            "description": "Enabled providers"
          }
        },
        "summary": "List enabled sign-in methods (public discovery)",
        "tags": [
          "Auth"
        ]
      }
    },
    "/v1/auth/oauth/{provider}": {
      "get": {
        "description": "Account sign-in starts only on the app's own address. On any other host (a site's address, a connected domain) the same path answers 302 to GET /v1/visitor/oauth/{provider} on that host with the same return_to, so a hand-written link still reaches visitor sign-in and never an account key; from a page's origin on the apex it is 403 account_auth_unavailable. A page offers Google to its visitors with auth.js SH.signIn(), which starts the SSO hop on the site's host when configured, or GET /v1/visitor/oauth/{provider} on instances without an apex. Apex start. Query `return_to` is required and must be an absolute URL. Owner return addresses include the apex `/v1/sso/hop` with its state and browser nonce hash. The other shapes are the dashboard origin `/` (owner purpose — callback hands off via `/?token=`; success 302s to the provider with PKCE S256) or a site's own address — a site host `https://\u003csite\u003e.\u003chandle\u003e.simple-host.app/...` (or, while that person's certificate is pending, the person address `https://\u003chandle\u003e.simple-host.app/\u003csite\u003e/...`), a claimed name or a DNS-proven bound domain (site purpose). A site-purpose start is not begun here: it 302s to `GET /v1/visitor/oauth/{provider}` on that site's own host, which binds the sign-in to the browser. Unknown or disabled provider is 404. No cookie is set here. The Legacy path-address (`sites.\u003cdomain\u003e/\u003chandle\u003e/\u003csite\u003e/`) return_to URLs are rejected with 400 invalid return_to, as are apex URLs outside the dashboard and SSO hop. The caller cannot set `purpose`; it is derived from `return_to`.",
        "operationId": "startOAuth",
        "parameters": [
          {
            "in": "path",
            "name": "provider",
            "required": true,
            "schema": {
              "enum": [
                "google",
                "github",
                "oidc"
              ],
              "type": "string"
            }
          },
          {
            "description": "Absolute URL of the page to return to after sign-in",
            "in": "query",
            "name": "return_to",
            "required": true,
            "schema": {
              "format": "uri",
              "type": "string"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "Redirect to the identity provider",
            "headers": {
              "Location": {
                "schema": {
                  "format": "uri",
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "content": {
              "application/json": {
                "example": {
                  "error": "invalid return_to"
                },
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "Invalid or missing return_to"
          },
          "403": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "account_auth_unavailable: on the app's address but from a page's origin."
          },
          "404": {
            "content": {
              "application/json": {
                "example": {
                  "error": "not found"
                },
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "Unknown or disabled provider"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          },
          "503": {
            "content": {
              "application/json": {
                "example": {
                  "code": "oidc_unavailable",
                  "error": "company sign-in is temporarily unavailable, try again shortly"
                },
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "oidc_unavailable: company sign-in's identity provider could not be reached yet (lazy discovery); retry shortly."
          }
        },
        "summary": "Start account Google sign-in (account owners; a site sign-in is forwarded)",
        "tags": [
          "Auth"
        ]
      }
    },
    "/v1/auth/oauth/{provider}/callback": {
      "get": {
        "description": "Answers only on the app's own address (403 account_auth_unavailable elsewhere). Provider redirect URI on the apex. Consumes the one-time `state`. Identifies via userinfo, then `resolveUser` (link or create a `users` row on a verified email; refuse missing/unverified email, and refuse an address that already has a PASSWORD_SIGNIN password account, a themed HTML page naming neither account). Site purpose 302s to `https://\u003creturn-host\u003e/v1/visitor/establish?once=…`. Owner purpose 302s to `{PUBLIC_BASE_URL}/?token=…` for the dashboard to redeem via `POST /v1/auth/verify`. Neither redirect contains an API key. Failures are a short no-store HTML page on the apex with no Location and no cookie.",
        "operationId": "oauthCallback",
        "parameters": [
          {
            "in": "path",
            "name": "provider",
            "required": true,
            "schema": {
              "enum": [
                "google",
                "github",
                "oidc"
              ],
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "code",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "state",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "error",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "Site purpose: redirect to /v1/visitor/establish on the stored host. Owner purpose: redirect to /?token= on PUBLIC_BASE_URL.",
            "headers": {
              "Location": {
                "schema": {
                  "format": "uri",
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "description": "Bad, replayed, or expired state, or provider error"
          },
          "403": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              },
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "description": "account_auth_unavailable (JSON): not on the app's own address. For oidc only, also a business-rule refusal (unverified email, domain not on ALLOWED_EMAIL_DOMAINS, Google hd not allowed): a themed no-store HTML page naming the reason in plain words, no internals."
          },
          "404": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "Unknown or disabled provider"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          },
          "502": {
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "description": "Token or userinfo failure"
          }
        },
        "summary": "OAuth callback (apex only)",
        "tags": [
          "Auth"
        ]
      }
    },
    "/v1/auth/password": {
      "post": {
        "description": "Available only when PASSWORD_SIGNIN=on. Passwords are 8–256 characters. Temporary passwords require a different new_password at sign-in.",
        "operationId": "passwordSignIn",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "properties": {
                  "login": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "new_password": {
                    "format": "password",
                    "maxLength": 256,
                    "minLength": 8,
                    "type": "string"
                  },
                  "password": {
                    "format": "password",
                    "maxLength": 256,
                    "minLength": 8,
                    "type": "string"
                  },
                  "sso_state": {
                    "type": "string"
                  }
                },
                "required": [
                  "login",
                  "password"
                ],
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
