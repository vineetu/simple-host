            "in": "query",
            "name": "token",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Confirmation form or final dashboard-key sign-out page"
          },
          "400": {
            "description": "Invalid",
            "expired": null,
            "or already used ticket": null
          },
          "403": {
            "description": "Wrong host or non-document request"
          },
          "429": {
            "description": "IP rate limit exceeded"
          }
        },
        "security": [],
        "summary": "Complete browser sign-out at the apex and return to the site",
        "tags": [
          "Visitor sign-in"
        ]
