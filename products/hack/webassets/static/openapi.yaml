    "/v1/visitor/establish": {
      "get": {
        "description": "One-time hop on the site's own address (its `\u003csite\u003e.\u003chandle\u003e` host or domain). Consumes `once`, host-matches, requires the `__Host-sh_vnonce` cookie set by `GET /v1/visitor/oauth/{provider}` in this browser (its hash must match the one bound to the code; the code is burned on any failure), sets `__Host-sh_vsess` (or `sh_vsess` on local HTTP), clears the nonce cookie, then 302s to the stored `return_to` with no query mutation. Never sets a cookie on the apex or the legacy path address. Failures are HTML, no cookie, no redirect.",
        "operationId": "establishVisitor",
        "parameters": [
          {
            "in": "query",
            "name": "once",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "Cookie set; redirect to the stored return_to",
            "headers": {
              "Location": {
                "schema": {
                  "format": "uri",
                  "type": "string"
                }
              },
              "Set-Cookie": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "description": "Bad, replayed, expired, host-mismatch, missing or wrong nonce cookie, or apex Host"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          }
        },
        "summary": "Establish the visitor session cookie",
        "tags": [
          "Visitor sign-in"
        ]
      }
    },
    "/v1/visitor/logout": {
      "post": {
        "description": "For a hop session, deletes its parent dashboard key, apex pass, and all linked site sessions. Returns redirect_url for a top-level navigation through the apex. A matching family signs out silently; expired, missing, legacy, or mismatched sessions require confirmation. The final apex page revokes and removes the browser's stored dashboard key before returning. Instances without an account apex end the local session with 204. Requires same-origin. Requires `X-SH-CSRF: 1` or `Content-Type: application/json` (not a simple form post).",
        "operationId": "logoutVisitor",
        "parameters": [
          {
            "in": "header",
            "name": "X-SH-CSRF",
            "required": false,
            "schema": {
              "enum": [
                "1"
              ],
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "properties": {
                    "redirect_url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": [
                    "redirect_url"
                  ],
                  "type": "object"
                }
              }
            },
            "description": "Navigate the top-level window to redirect_url to clear the apex cookie"
          },
          "204": {
            "description": "Session deleted and cookie cleared"
          },
          "403": {
            "content": {
              "application/json": {
                "schema": {
                  "properties": {
                    "code": {
                      "example": "csrf_required",
                      "type": "string"
                    },
                    "error": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                }
              }
            },
            "description": "Missing CSRF header (and not a JSON request)"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          }
        },
        "summary": "Sign out this browser across linked sites",
        "tags": [
          "Visitor sign-in"
        ]
      }
    },
    "/v1/visitor/oauth/{provider}": {
      "get": {
        "description": "Visitor sign-in start, served on the site's own address (its `\u003csite\u003e.\u003chandle\u003e` host, person address, claimed name or bound domain). `return_to` must be a page on this same host that belongs to the site served here. Sets a short-lived host-only nonce cookie (`__Host-sh_vnonce`, HttpOnly, Secure, SameSite=Lax, 10 minutes; `sh_vnonce` on local HTTP), stores only its SHA-256 with the OAuth state, and 302s to the provider with PKCE S256. `GET /v1/visitor/establish` later sets the session only in the browser holding that nonce, so a sign-in finished elsewhere cannot be completed in another browser (login CSRF). auth.js `SH.signIn()` navigates here.",
        "operationId": "startVisitorOAuth",
        "parameters": [
          {
            "in": "path",
            "name": "provider",
            "required": true,
            "schema": {
              "enum": [
                "google",
                "github",
                "oidc"
              ],
              "type": "string"
            }
          },
          {
            "description": "Absolute URL of a page on this host to return to after sign-in",
            "in": "query",
            "name": "return_to",
            "required": true,
            "schema": {
              "format": "uri",
              "type": "string"
            }
          }
        ],
        "responses": {
          "302": {
            "description": "Nonce cookie set; redirect to the identity provider",
            "headers": {
              "Location": {
                "schema": {
                  "format": "uri",
                  "type": "string"
                }
              },
              "Set-Cookie": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "content": {
              "application/json": {
                "example": {
                  "error": "invalid return_to"
                },
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "Missing return_to, or one that is not a page of the site on this host"
          },
          "404": {
            "content": {
              "application/json": {
                "example": {
                  "error": "not found"
                },
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "Unknown or disabled provider"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequests"
          }
        },
        "summary": "Start visitor sign-in on the site's own host",
        "tags": [
          "Visitor sign-in"
        ]
      }
    }
  },
