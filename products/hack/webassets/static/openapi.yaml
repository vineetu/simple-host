        ]
      },
      "post": {
        "description": "D1: every application is pending until an organiser decides it, whatever approval_required says (that toggle governs join-link sign-ups only). Rate-limited per account (RATE_LIMIT_EVENT_APPLY_USER) and per network address (RATE_LIMIT_EVENT_APPLY_IP). A cap of 20 pending applications per account returns 409 too_many_pending. A separate per-event ceiling (EVENT_APPLY_PENDING_PER_EVENT, default 500) returns 409 event_applications_full when that one event already has that many applications waiting for a decision. Reapplying as an existing participant -- pending, approved or rejected -- is idempotent (200, nothing changes, including after rejection, and whether or not applications are open right now); a different role is 409 already_member.",
