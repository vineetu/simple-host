    "/v1/u/{handle}/sites/{sitename}/me": {
      "get": {
        "description": "Pages call it same-origin on the site's own address — its address `https://\u003csite\u003e.\u003chandle\u003e.simple-host.app/` (only that site answers there), or its domain if it has one. Origin/Referer-gated. When the site has a connected domain and the call comes through another address, it returns signed_in false, sign_in_available false and code use_custom_domain with `domain` naming it, so the page can send the visitor to sign in there. Where sign-in is not offered (the legacy path address) the code is custom_domain_required. Checks the host, site and session expiry without extending the session. No CSRF header required. Anonymous visitors receive 200.",
        "operationId": "getVisitorMeByHandle",
        "parameters": [
          {
            "$ref": "#/components/parameters/sitename"
          },
          {
            "in": "path",
            "name": "handle",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "properties": {
                        "email": {
                          "description": "Latest verified OAuth identity email; users.username when no identity exists",
                          "type": "string"
                        },
                        "expires_at": {
                          "description": "Earlier of absolute and idle expiry (RFC3339)",
                          "format": "date-time",
                          "type": "string"
                        },
                        "provider": {
                          "description": "Google (more providers later); omitted when no OAuth identity exists",
                          "example": "google",
                          "type": "string"
                        },
                        "signed_in": {
                          "enum": [
                            true
                          ],
                          "type": "boolean"
                        }
                      },
                      "required": [
                        "signed_in",
                        "expires_at"
                      ],
                      "type": "object"
                    },
                    {
                      "properties": {
                        "sign_in": {
                          "enum": [
                            "/v1/auth/oauth/providers"
                          ],
                          "type": "string"
                        },
                        "signed_in": {
                          "enum": [
                            false
                          ],
                          "type": "boolean"
                        }
                      },
                      "required": [
                        "signed_in",
                        "sign_in"
                      ],
                      "type": "object"
                    },
                    {
                      "properties": {
                        "code": {
                          "enum": [
                            "custom_domain_required",
                            "use_custom_domain"
                          ],
                          "type": "string"
                        },
                        "domain": {
                          "description": "The site's bound custom domain; present only with code use_custom_domain",
                          "type": "string"
                        },
                        "sign_in_available": {
                          "enum": [
                            false
                          ],
                          "type": "boolean"
                        },
                        "signed_in": {
                          "enum": [
                            false
                          ],
                          "type": "boolean"
                        }
                      },
                      "required": [
                        "signed_in",
                        "sign_in_available",
                        "code"
                      ],
                      "type": "object"
                    }
                  ]
                }
              }
            },
            "description": "Signed-in identity or anonymous visitor",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "enum": [
                    "private, no-store"
                  ],
                  "type": "string"
                }
              }
            }
          },
          "403": {
            "$ref": "#/components/responses/OriginMismatch"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "Internal server error"
          }
        },
        "summary": "Read the current site visitor session",
        "tags": [
          "Visitor sign-in"
        ]
      },
      "options": {
        "operationId": "optionsVisitorMeByHandle",
        "parameters": [
          {
            "$ref": "#/components/parameters/sitename"
          },
          {
            "in": "path",
            "name": "handle",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "204": {
            "description": "Origin allowed",
            "headers": {
              "Access-Control-Allow-Headers": {
                "schema": {
                  "enum": [
                    "Content-Type"
                  ],
                  "type": "string"
                }
              },
              "Access-Control-Allow-Methods": {
                "schema": {
                  "enum": [
                    "GET, OPTIONS"
                  ],
                  "type": "string"
                }
              }
            }
          },
          "403": {
            "$ref": "#/components/responses/OriginMismatchOrSiteLocked"
          }
        },
        "summary": "Preflight for visitor session reads",
        "tags": [
          "Visitor sign-in"
        ]
      }
    },
