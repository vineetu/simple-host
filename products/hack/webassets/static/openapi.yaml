    "/v1/auth/verify": {
      "post": {
        "description": "Answers only on the app's own address (403 account_auth_unavailable elsewhere), so no hosted page can mint an account key. The apex visitor sign-in card also uses this endpoint, keeping the account key on the apex and returning only a site cookie through the SSO hop. After success, browser sign-in calls POST /v1/sso/session with the returned key to establish the apex SSO cookie. Exchange `{email, code}` (CLI/agent) or a magic-link `{token}` (browser) for an API key. The first successful email-code verify creates the account. Dashboard Google also redeems through this endpoint (`/?token=\u0026cn=`). A link token is redeemed only with the `nonce` whose hash it was issued with, so a sign-in link works only in the browser that asked for it. Visitor-issued codes are not accepted here. The code expires in 15 minutes and allows 3 attempts.",
        "operationId": "postAuthVerify",
        "parameters": [
          {
            "description": "Optional same-visit attribution label (letters, digits, hyphens); recorded only for a new browser/connector account, never a permission or cookie.",
            "in": "query",
            "name": "from",
            "schema": {
              "maxLength": 40,
              "type": "string"
            }
          },
          {
            "description": "Optional same-visit attribution; UTM values are bounded plain text, referrer is an outside hostname only.",
            "in": "query",
            "name": "utm_source",
            "schema": {
              "type": "string"
            }
          },
          {
            "description": "Optional same-visit attribution; UTM values are bounded plain text, referrer is an outside hostname only.",
            "in": "query",
            "name": "utm_medium",
            "schema": {
              "type": "string"
            }
          },
          {
            "description": "Optional same-visit attribution; UTM values are bounded plain text, referrer is an outside hostname only.",
            "in": "query",
            "name": "utm_campaign",
            "schema": {
              "type": "string"
            }
          },
          {
            "description": "Optional same-visit attribution; UTM values are bounded plain text, referrer is an outside hostname only.",
            "in": "query",
            "name": "utm_term",
            "schema": {
              "type": "string"
            }
          },
          {
            "description": "Optional same-visit attribution; UTM values are bounded plain text, referrer is an outside hostname only.",
            "in": "query",
            "name": "utm_content",
            "schema": {
              "type": "string"
            }
          },
          {
            "description": "Optional same-visit attribution; UTM values are bounded plain text, referrer is an outside hostname only.",
            "in": "query",
            "name": "referrer",
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "properties": {
                  "choose_handle": {
                    "description": "When this sign-in would create a new account: create nothing yet and answer 409 with code choose_handle and a suggested_handle, without using up the code. Ask the person which address they want, then verify again with the same code and handle. Ignored for an existing account.",
                    "type": "boolean"
                  },
                  "code": {
                    "example": "123456",
                    "type": "string"
                  },
                  "email": {
                    "format": "email",
                    "type": "string"
                  },
                  "handle": {
                    "description": "The address (\u003chandle\u003e.simple-host.app) a NEW account takes; ignored for an existing account. Refused as 400 invalid_handle, 409 handle_reserved or 409 handle_taken without using up the code, so another can be tried. It can be changed later (PATCH /v1/me), not more than once in 30 days after publishing. Without handle or choose_handle a new account is given one.",
                    "pattern": "^[a-z0-9-]{1,39}$",
                    "type": "string"
                  },
                  "name": {
                    "description": "Optional label for the key this sign-in issues, shown in the Keys list (GET /v1/me/keys). Defaults to \"dashboard sign-in\" for a link or Google, \"agent sign-in\" for a typed code.",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "nonce": {
                    "description": "required with token — the nonce whose hash was sent when the link was requested",
                    "type": "string"
                  },
                  "sso_state": {
                    "description": "Optional server-issued hop state for visitor signup attribution",
                    "type": "string"
                  },
                  "token": {
                    "description": "magic-link token (alternative to email+code)",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            },
            "description": "Authenticated"
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "content": {
              "application/json": {
                "example": {
                  "code": "invalid_code",
                  "error": "That code is not right. 2 tries left.",
                  "reason": "code_wrong",
                  "tries_left": 2
                },
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "Invalid code. `code` stays invalid_code. `reason` is code_wrong, code_used_up, code_expired, or link_other_browser; `tries_left` is set on code_wrong."
          },
          "403": {
            "content": {
              "application/json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/ErrorResponse"
                    },
                    {
                      "properties": {
                        "code": {
                          "enum": [
                            "account_auth_unavailable",
                            "email_signin_off"
                          ],
                          "type": "string"
                        }
                      },
                      "type": "object"
                    }
                  ]
                }
              }
            },
            "description": "account_auth_unavailable: account sign-in answers only on the app's own address; a page's visitors use visitor sign-in (auth.js SH.mount). Or email_signin_off (EMAIL_SIGNIN=off), for the email+code shape only — a magic-link token (from the company sign-in or Google flow) still redeems normally."
          },
          "409": {
            "content": {
              "application/json": {
                "schema": {
                  "properties": {
                    "address": {
                      "example": "rose.simple-host.app",
                      "type": "string"
                    },
                    "code": {
                      "enum": [
                        "choose_handle",
                        "handle_taken",
                        "handle_reserved",
                        "password_account_exists"
                      ],
                      "type": "string"
                    },
                    "error": {
                      "type": "string"
                    },
                    "suggested_handle": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                }
              }
            },
            "description": "code choose_handle (a new account: choose its address first; carries suggested_handle and address), handle_taken / handle_reserved (the handle sent cannot be had; error names the address), or password_account_exists (this address already has a password account from PASSWORD_SIGNIN; the code is spent, sign in with the password instead). The code is not used up except for password_account_exists."
          }
        },
        "summary": "Verify a code on the apex and get an account key",
        "tags": [
          "Auth"
        ]
      }
    },
