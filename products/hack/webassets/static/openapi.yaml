    "/v1/hack/events/{slug}/judging/dashboard": {
      "get": {
        "description": "Per-team score coverage (flagged when short of the target — judges_per_team in automatic mode, 2 in open mode) and per-judge progress (done_count, assigned_count). tied_groups is always empty until scores exist (a later release fills this in once totals can be computed). former_judges (SIM-340) lists people who left after scoring: counted_teams is how many of their scores still count (frozen at the moment they left), assigned_count is how many of today's teams they would be assigned under the current mode. They are never in judges. teams lists only the teams that will be judged: an entry not excluded by hand, or a live team site (moving to judging starts an entry for it); a team with neither has no entry and is left out, as it is from automatic assignment and every judge's queue. entries counts the same split (judged, no_entry, excluded) for the Start judging confirm. coverage (SIM-419) is a read-only preview of who would judge each team, from the saved judge set (joined judges plus ticked organisers), conflicts and the current mode; automatic mode runs the planner without saving. It is what the Start judging confirm and the checklist read.",
