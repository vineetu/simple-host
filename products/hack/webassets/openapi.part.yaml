paths:
  /v1/events:
    get:
      x-audience:
      - public-hack
      tags:
      - Events
      operationId: listEventDomains
      summary: List the event hostnames you have claimed
      description: Returns every event hostname claimed by the calling account, with the server address it points
        at and when the claim expires.
      security:
      - apiKey: []
      responses:
        '200':
          description: Claimed event hostnames
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    description: The event domains this instance can create names under. Ask for these rather than
                      assuming; an instance may offer none.
                    items:
                      type: string
                    example:
                    - simple-hack.app
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        host:
                          type: string
                          example: stanford-cs-2026.simple-host.app
                        content_host:
                          type: string
                          example: sites.stanford-cs-2026.simple-host.app
                        ip:
                          type: string
                          example: 85.9.193.170
                        expires_at:
                          type: string
                          format: date-time
    post:
      x-audience:
      - public-hack
      tags:
      - Events
      operationId: claimEventDomain
      summary: Claim two hostnames for an event, pointing at your own server
      description: 'Creates <name>.<domain> and sites.<name>.<domain> as A records at the given public IPv4 address,
        so a hackathon organiser never touches a registrar. The two hostnames are separate on purpose: participant
        content must not share a browser origin with the admin interface. Re-claiming a name you already own replaces
        its records and extends the expiry. A name owned by another account answers 409. Claims expire and are swept,
        because a record left pointing at a released cloud address is a subdomain takeover.'
      security:
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - ip
              properties:
                name:
                  type: string
                  example: stanford-cs-2026
                  description: 1 to 40 letters, digits or hyphens. Lowercased. Reserved names are refused.
                ip:
                  type: string
                  example: 85.9.193.170
                  description: Public IPv4 of the organiser's server. Private and loopback addresses are refused.
                domain:
                  type: string
                  example: simple-hack.app
                  description: One of the instance's configured event domains. Defaults to the first.
                move:
                  type: boolean
                  description: Required to re-point an existing claim at a different address. Without it a re-claim
                    that changes the address is refused, because it would silently move a running event.
      responses:
        '201':
          description: Hostnames created
          content:
            application/json:
              schema:
                type: object
                properties:
                  host:
                    type: string
                  content_host:
                    type: string
                  ip:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '400':
          description: Invalid name
          address or domain: null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: That event name belongs to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The DNS provider refused the record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/events/{name}:
    delete:
      x-audience:
      - public-hack
      tags:
      - Events
      operationId: releaseEventDomain
      summary: Release an event's hostnames
      description: Removes both DNS records and the claim. Safe to retry. Records are deleted before the row, so
        a partial failure leaves something that still knows what to clean up.
      security:
      - apiKey: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: domain
        in: query
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Released
        '404':
          description: Not found
          or not yours: null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The DNS provider refused the deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/hack/demo:
    get:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: getHackDemo
      summary: Get the current standing demo event links
      description: Hosted mode only, no authentication. HACK_DEMO_EVENT_SLUG defaults to demo. Available only for
        an open or building event that has not been taken down. Answers with Cache-Control no-store; self-hosted
        mode answers 404.
      security: []
      responses:
        '200':
          description: Current demo event and invitation links.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - event_url
                - join_url
                - judge_url
                - title
                properties:
                  event_url:
                    type: string
                    format: uri
                  join_url:
                    type: string
                    format: uri
                  judge_url:
                    type: string
                    format: uri
                  title:
                    type: string
        '404':
          description: No available demo event.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                    enum:
                    - no demo event
  /v1/hack/directory:
    get:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: listHackDirectory
      summary: List public hackathons by now, upcoming and past
      description: Public in hosted Hack mode. Lists events by default after Draft; organiser opt-outs and taken-down
        events are excluded. Each row adds applications_open and, only when true, apply_url.
      responses:
        '200':
          description: Groups now, upcoming and past, each with event title, stage, dates, public URL, applications_open
            and (when open) apply_url.
          content:
            application/json:
              schema:
                type: object
                properties:
                  now:
                    type: array
                    items:
                      type: object
                  upcoming:
                    type: array
                    items:
                      type: object
                  past:
                    type: array
                    items:
                      type: object
  /v1/hack/events/{slug}/voting:
    get:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: getHackVotingSettings
      summary: Read an event's people's-choice settings
      description: Organiser only. Returns enabled, opening/closing instants, eligibility, directory listing, current
        status and votes_to_remove (counts keyed by eligibility for confirmation before narrowing).
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      security:
      - apiKey: []
      responses:
        '200':
          description: Voting settings
          content:
            application/json:
              schema:
                type: object
        '404':
          description: event_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: setHackVotingSettings
      summary: Set the voting window and eligibility
      description: Organiser only. A live gallery, opening and closing times, and eligibility are required when
        enabling. Archived events cannot change voting settings. Changing eligibility deletes earlier votes that
        no longer qualify and returns votes_removed.
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      security:
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              - opens_at
              - closes_at
              - eligibility
              properties:
                enabled:
                  type: boolean
                opens_at:
                  type: string
                  description: RFC3339 or local date/time in event time zone; empty when disabled
                closes_at:
                  type: string
                  description: RFC3339 or local date/time in event time zone; empty when disabled
                eligibility:
                  type: string
                  enum:
                  - all_signed_in
                  - event_members
                  - participants
                confirm_vote_removal:
                  type: boolean
                  description: Confirm removal of votes that no longer qualify
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema:
                type: object
        '400':
          description: invalid_voting_window or invalid_voting_eligibility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: gallery_closed, event_closed or vote_removal_confirmation (includes votes_to_remove count)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: event_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/hack/events/{slug}/directory:
    patch:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: setHackDirectoryListing
      summary: Opt an event in or out of the public directory
      description: Organiser only; works after the event ends. New events are unlisted until opted in. Drafts and
        taken-down events are never listed regardless of this setting.
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      security:
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - listed
              properties:
                listed:
                  type: boolean
      responses:
        '200':
          description: Saved listing preference
          content:
            application/json:
              schema:
                type: object
        '404':
          description: event_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/hack/events/{slug}/vote:
    get:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: getHackVoteOptions
      summary: Read people's-choice options and final ranking
      description: Public for non-draft, non-taken-down events. Vote counts are omitted until the configured closing
        time.
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Event
          status: null
          live project options and final ranking after close: null
          content:
            application/json:
              schema:
                type: object
        '404':
          description: event_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: castHackVote
      summary: Cast or change one people's-choice vote
      description: Signed-in personal account. One vote per canonical verified email per event, with +tags dropped.
        The same selection is refused as a duplicate; choosing another live team changes it until close. Own-team
        votes are refused across alias accounts. Approval-restricted members must be approved.
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      security:
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - team
              properties:
                team:
                  type: string
                  description: Team slug from the public vote options
      responses:
        '200':
          description: Selected team and whether an existing vote changed
          content:
            application/json:
              schema:
                type: object
        '403':
          description: vote_ineligible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: team_not_found or event_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: voting_closed
          own_team_vote or duplicate_vote: null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/hack/events/{slug}/my-vote:
    get:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: getHackMyVote
      summary: Read the connected person's own vote
      description: Signed-in personal account. Matches the same canonical email identity as vote writes. Also returns
        eligible, this account's current standing against the event's voting eligibility setting (and the admin-account
        rule PUT vote itself enforces), so the vote page can explain upfront that someone can't vote instead of
        only after a PUT vote 403 vote_ineligible.
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      security:
      - apiKey: []
      responses:
        '200':
          description: '{team, eligible}: team slug or empty string when no vote.'
          content:
            application/json:
              schema:
                type: object
        '404':
          description: event_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/hack/navigation:
    get:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: getHackNavigation
      summary: Read Hack navigation destinations
      security:
      - apiKey: []
      responses:
        '200':
          description: Shared navigation map without event or private values
          content:
            application/json:
              schema:
                type: object
                required:
                - version
                - screens
                - targets
                - aliases
                properties:
                  version:
                    type: integer
                  screens:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  targets:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  aliases:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  roles:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  resolution:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/hack/events:
    get:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: listHackEvents
      summary: Events I am in (EVENTS=hosted only)
      description: 'Items: slug, title, stage, role, can, url, manage_url, starts_at, ends_at, ended_at, time_zone,
        taken_down.'
      security:
      - apiKey: []
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Events the caller is a member of
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    slug:
                      type: string
                    title:
                      type: string
                    stage:
                      type: string
                    can:
                      $ref: '#/components/schemas/HackAbilities'
                    ended_at:
                      type: string
                      format: date-time
                      nullable: true
                      description: Archive timestamp; null for legacy events without one.
                    role:
                      type: string
                      enum:
                      - organiser
                      - participant
                      - judge
                    url:
                      type: string
                    manage_url:
                      type: string
                    starts_at:
                      type: string
                      format: date-time
                      nullable: true
                    ends_at:
                      type: string
                      format: date-time
                      nullable: true
                    taken_down:
                      type: boolean
                    approval_status:
                      type: string
                      enum:
                      - pending
                      - approved
                      - rejected
                      description: 'Participant rows only: so Home can say Waiting for the organisers or Not accepted.'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: createHackEvent
      summary: Create an event (EVENTS=hosted only)
      security:
      - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - slug
              - title
              - organiser_name
              - contact_email
              - purpose
              - expected_participants
              - starts_at
              properties:
                slug:
                  type: string
                title:
                  type: string
                organiser_name:
                  type: string
                organisation:
                  type: string
                contact_email:
                  type: string
                purpose:
                  type: string
                expected_participants:
                  type: integer
                starts_at:
                  type: string
                ends_at:
                  type: string
                time_zone:
                  type: string
                  default: UTC
      responses:
        '201':
          description: Created (organiser view of the event)
        '400':
          description: invalid_name, name_reserved, or a field validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: name_taken or too_many_active_events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: too_many_events_today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: name_check_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '507':
          description: instance_full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/hack/names/{slug}:
    get:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: checkHackName
      summary: Is this event name available (EVENTS=hosted only)
      security:
      - apiKey: []
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: '{available, code?, error?, address}'
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  code:
                    type: string
                  error:
                    type: string
                  address:
                    type: string
        '503':
          description: name_check_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/hack/events/{slug}/assistant:
    get:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: getHackAssistant
      summary: Read whether the organiser assistant is on and today's remaining questions
      security:
      - apiKey: []
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Assistant status for the calling organiser
          content:
            application/json:
              schema:
                type: object
                required:
                - enabled
                properties:
                  enabled:
                    type: boolean
                    description: False until the operator sets an OpenAI-compatible endpoint
                  daily_limit:
                    type: integer
                  used_today:
                    type: integer
                  remaining_today:
                    type: integer
                  budget_reached:
                    type: boolean
                  resets:
                    type: string
                    description: First day of next month (UTC), when the monthly budget resets
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: organisers_only
        '404':
          description: event_not_found
    post:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: askHackAssistant
      summary: Ask the organiser assistant a question; the answer streams back
      description: Read-only. The server answers from the navigation map and its explanation of every organiser
        setting, option and action, the event's current settings, the organiser's event view and checklist, and
        the docs, through the configured endpoint. It never changes the event. Each accepted request counts as one
        question.
      security:
      - apiKey: []
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - messages
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description: The chat so far; the last message is the user's question. Each content is at most
                    2000 characters, 12000 in total.
                  items:
                    type: object
                    required:
                    - role
                    - content
                    properties:
                      role:
                        type: string
                        enum:
                        - user
                        - assistant
                      content:
                        type: string
                screen:
                  type: string
                  description: Optional. The organiser screen the question is asked from, as a navigation screen
                    id (for example organiser-settings). Unknown values, and values over 64 characters, are ignored.
                tab:
                  type: string
                  description: Optional. The tab of that screen (for example judging); over 64 characters is ignored.
      responses:
        '200':
          description: 'Server-sent events: {"delta":"..."} chunks, then {"done":true,"remaining_today":N} or {"error":"provider_error","message":"..."}'
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: organisers_only
        '404':
          description: event_not_found or assistant_off
        '429':
          description: daily_limit or monthly_budget
        '502':
          description: provider_error
  /v1/hack/events/{slug}/checklist:
    get:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: getHackChecklist
      summary: Read a role checklist and its next action
      security:
      - apiKey: []
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      - in: query
        name: role
        schema:
          type: string
          enum:
          - organiser
          - judge
