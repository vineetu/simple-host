        of size, avoiding name and used-site clashes. A locked team is deliberately left alone even with room --
        its admin chose to stop taking anyone new -- and is listed in skipped instead, so the caller can explain
        the gap rather than a stranger being quietly dropped into a new one-person team instead. Returns size, plan
        [{team,name,new,members:[{user_id,display_name}]}], skipped [{team,name,reason}] (reason is currently always
        "locked"; a team skipped only because it's already at size isn't listed) and applied. Apply recomputes from
