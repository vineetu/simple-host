  /v1/hack/events/{slug}/apply:
    get:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: getHackApply
      summary: Apply to join an event, without a join link (EVENTS=hosted only)
      description: Includes account_name (string), the signed-in account name or an empty string when none is known.
        Signed out allowed; a valid X-API-Key meters the account instead of the shared network address. 404 event_not_found
        for a draft, taken-down or unknown event (identical body, so a draft's existence does not leak). fields
        (city, country, age_range, gender) are fixed product choices, always present. signup_questions, coc_default
        and coc_text are present only when signed in AND applications are open right now (not when the organiser's
        switch is off or the stage has moved past it) -- these used to need the join code, and a closed or switched-off
        event must not become a way to read them with only an account. me is present only when signed in and already
        a member (null otherwise), with role, joined_via and, for a participant, approval_status; it is returned
        either way, open or closed. closed_reason is null, applications_off, not_listed (the event is not in Find
        a hackathon, which takes no applications) or signup_over.
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'Apply page fields: slug, title, tagline, icon_url, color, organiser_name, organisation,
            stage, starts_at, ends_at, time_zone, event_url, applications_open, closed_reason, fields'
        '404':
          description: event_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: postHackApply
      summary: Apply as a participant, without a join link (EVENTS=hosted only)
      description: 'D1: every application is pending until an organiser decides it, whatever approval_required says
        (that toggle governs join-link sign-ups only). Rate-limited per account (RATE_LIMIT_EVENT_APPLY_USER) and
        per network address (RATE_LIMIT_EVENT_APPLY_IP). A cap of 20 pending applications per account returns 409
        too_many_pending. A separate per-event ceiling (EVENT_APPLY_PENDING_PER_EVENT, default 500) returns 409
        event_applications_full when that one event already has that many applications waiting for a decision. Reapplying
        as an existing participant -- pending, approved or rejected -- is idempotent (200, nothing changes, including
        after rejection, and whether or not applications are open right now); a different role is 409 already_member.'
      security:
      - apiKey: []
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - accept_coc
              properties:
                accept_coc:
                  type: boolean
                display_name:
                  type: string
                  description: Only used when your account has no name yet; it then becomes your account name. Otherwise
                    ignored.
                city:
                  type: string
                  maxLength: 80
                  description: Optional, up to 80 characters.
                country:
                  type: string
                  description: Optional. ISO 3166-1 alpha-2 country code, e.g. ID, GB, US.
                age_range:
                  type: string
                  enum:
                  - ''
                  - under_18
                  - '18_24'
                  - '25_34'
                  - 35_plus
                  description: Optional.
                gender:
                  type: string
                  enum:
                  - ''
                  - woman
                  - man
                  - non_binary
                  - another
                  - prefer_not_to_say
                  description: Optional.
                answers:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 500
      responses:
        '200':
          description: 'Applied: same shape as POST /v1/hack/join/{code}, me.approval_status pending'
        '400':
          description: coc_required, invalid_display_name, invalid_city, invalid_country, invalid_age_range, invalid_gender,
            answer_required or invalid_answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: event_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: joining_closed, applications_closed, already_member, too_many_pending or event_applications_full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
