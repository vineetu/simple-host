      description: 'Teams redesign, 2026-10-31. Public, signed in or out; same rate limiter as GET .../join/{code}.
        code accepts either the bare team code or the whole team link. Never writes and never joins (safe to prefetch
        or unfurl). Never a member''s name or email. you is null signed out, else {status}: not_in_event, pending,
        rejected, judge, organiser, no_team, on_this_team, or on_other_team (+ team_name, the other team''s own
        name). reason is null, locked, full or teams_closed (stage not open/building, or the team''s own deadline
        passed). A taken-down event or an unknown code is 404 team_link_not_found.'
      parameters:
      - in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{event: {slug, title, url, stage, applications_open}, team: {name, member_count, team_size_max,
            track}, joinable, reason, you}'
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    type: object
                    properties:
                      slug:
                        type: string
                      title:
                        type: string
                      url:
                        type: string
                      stage:
                        type: string
                      applications_open:
                        type: boolean
                        description: 'Whether this event actually takes an application right now (same rule as GET
                          /v1/hack/events/{slug}/apply: the organiser''s switch, directory listing, stage open/building,
                          and not taken down), not the raw per-event switch.'
                  team:
                    type: object
                    properties:
                      name:
                        type: string
                      member_count:
                        type: integer
                      team_size_max:
                        type: integer
                      track:
                        type: object
                        nullable: true
                        properties:
                          name:
                            type: string
                  joinable:
                    type: boolean
                  reason:
                    type: string
                    nullable: true
                    enum:
                    - locked
                    - full
                    - teams_closed
                    - null
                  you:
                    type: object
                    nullable: true
                    properties:
                      status:
                        type: string
                        enum:
                        - not_in_event
                        - pending
                        - rejected
                        - judge
                        - organiser
                        - no_team
                        - on_this_team
                        - on_other_team
                      team_name:
                        type: string
                        description: Only with on_other_team.
        '404':
          description: team_link_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
