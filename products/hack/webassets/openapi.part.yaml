      operationId: putHackEventEntry
      summary: Update my team's entry (participant) (EVENTS=hosted only)
      description: Updates any of the fields supplied and returns the entry. title is one line, 0-80 characters;
        tagline one line, 0-160 (the one-line solution); description 0-5000; problem 0-140; audience 0-100. video_url
        and code_url are empty or an absolute http or https URL with a host, at most 500 characters, with no spaces
        or control characters (400 invalid_url). tools is at most 10 items, each 1-30 characters (400 invalid_tools);
