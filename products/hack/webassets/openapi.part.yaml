      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - offsets_minutes
              properties:
                offsets_minutes:
                  type: array
                  items:
                    type: integer
                  maxItems: 5
                  description: Minutes before the deadline, each 15 to 20160.
      responses:
        '200':
          description: Reminder settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HackReminderSettings'
        '400':
          description: invalid_offsets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: event_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: event_closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
tags:
- name: Notifications
  description: Signed HTTPS notifications for visitor storage writes on Simple Host and Simple Hack.
- name: Hosted events
  description: Hosted events, teams, entries, judging, results and event websites.
- name: Events
  description: Hostname claims for self-hosted events.
components_add:
  schemas:
    HackArchiveLink:
      type: object
      required:
      - url
      - expires_at
      - expires_in
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        expires_in:
          type: integer
          description: Seconds until expiration.
    HackEntryField:
      type: string
      enum:
      - title
      - tagline
      - description
      - video_url
      - code_url
      - screenshot
      description: The legacy entry_required single-list model's six fields. Use HackEntryRuleField for the fuller
        entry-rules model (missing, entry-rules fields and their impact).
    HackEntryRuleField:
      type: string
      enum:
      - title
      - problem
      - tagline
      - audience
      - track
      - tools
      - maturity
      - description
      - video_url
      - site
      - code_url
      - screenshot
      - one_of
      description: Every field the entry-rules engine understands, plus one_of for an unmet show-your-work group
        (by default video_url or site; the event's own rules say which fields it covers). Appears in missing/complete
        results and in entry-rules fields and impact. track is ignored when the event has no tracks; site reflects
        whether the team's published website is live, never a stored entry field.
    HackKeyMeta:
      type: object
      description: A team key without its secret.
      properties:
        last4:
          type: string
          description: Last 4 characters of the key.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
    HackTeamSite:
      type: object
      description: A team's site at https://<team>.<event>.simple-hack.app/. ready is true once that event's team
        addresses have a certificate.
      properties:
        name:
          type: string
          description: The team slug
          which is the site's name.: null
        url:
          type: string
          description: https://<team>.<event>.simple-hack.app/
        ready:
          type: boolean
          description: False until the event's team addresses are set up. A deploy before then is 409 team_sites_not_ready.
        exists:
          type: boolean
        live_version:
          type: integer
          nullable: true
          description: The live version
          or null when the site does not exist.: null
        taken_down:
          type: boolean
          description: True when the organiser or the platform has taken the site down.
        taken_down_reason:
          type: string
          description: Empty when the site is up.
    HackMeTeam:
      type: object
      description: The caller's team, as a participant sees it (names only, never another person's email or account
        id).
      properties:
        slug:
          type: string
        name:
          type: string
        code:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
                description: Member ID for teammate removal.
              display_name:
                type: string
                description: Account name from users.display_name; changes immediately when the account is renamed.
              you:
                type: boolean
        site:
          $ref: '#/components/schemas/HackTeamSite'
        deadline:
          type: string
          format: date-time
          nullable: true
          description: This team's effective deadline.
        extended:
          type: boolean
          description: True when the team has its own later deadline.
        frozen:
          type: boolean
          description: True once the deadline has passed. The site and the entry no longer change.
        pinned_version:
          type: integer
          nullable: true
          description: The site's live version at the deadline. Null when there is nothing to pin.
    HackEvent:
      type: object
      properties:
        accent_color:
          type: string
          description: Organiser palette choice; empty is automatic.
        color:
          type: string
          description: Effective crayon hex seed shared by the page and icon.
        theme:
          type: string
          description: Whole-page style for the public event page (poster, confetti, boardroom, garden, terminal),
            or empty for the classic look.
        slug:
          type: string
        title:
          type: string
        tagline:
          type: string
        about:
          type: string
        rules:
          type: string
        prizes:
          type: string
        overall_prizes:
          type: array
          maxItems: 3
          items:
            type: string
            maxLength: 60
          description: 'Prizes by index: 0 = 1st, 1 = 2nd, 2 = 3rd. Trimmed single lines; empty skips a place, trailing
            empty strings are trimmed, [] clears. Always an array on reads. Invalid values return invalid_overall_prizes.'
        coc_text:
          type: string
        coc_default:
          type: string
          description: The code of conduct used when the organiser has not written one.
        stage:
          type: string
          enum:
          - draft
          - open
          - building
          - closed
          - judging
          - results
          - archived
        time_zone:
          type: string
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        team_size_max:
          type: integer
        team_finding:
          type: boolean
          default: true
        applications_open:
          type: boolean
          default: true
          description: Whether people without the join link can apply from Find a hackathon and the event page.
        url:
          type: string
        taken_down:
          type: boolean
        results_visibility:
          type: string
          enum:
          - winners
          - ranking
        submission_deadline:
          type: string
          format: date-time
          nullable: true
          description: The event's deadline
          RFC 3339 UTC: null
          or null.: null
        judging_ends_at:
          type: string
          format: date-time
          nullable: true
          description: When judging closes, RFC 3339 UTC, or null. Drives the judging-closes reminder; not inferred
            from the schedule.
        entry_required:
          type: array
          deprecated: true
          description: 'Deprecated: the fields marked required by the legacy single-list model, kept in step with
            the fuller rules at .../entry-rules. Default is title.'
          items:
            $ref: '#/components/schemas/HackEntryField'
        submissions_public:
          type: boolean
          default: false
        gallery_open:
          type: boolean
        team_sites_ready:
          type: boolean
          description: True once the event's team addresses have a certificate.
        judging_locked_at:
          type: string
          format: date-time
          nullable: true
          description: When judging was locked. Null while scores can still change.
        scoring_open:
          type: boolean
          description: Whether judges may score in the current stage (during Judging; also while building on the
            standing demo). The judging lock applies separately.
        judging_lock_reason:
          type: string
          description: The reason from the last unlock. Empty until judging has been unlocked once.
        stages_offered:
          type: array
          description: Stages an organiser can set now.
          items:
            type: string
          example:
          - draft
          - open
          - building
          - closed
          - archived
    HackOrganiser:
      type: object
      description: Present for an organiser, and when the platform admin reads the event.
      properties:
        organiser_name:
          type: string
        organisation:
          type: string
        contact_email:
          type: string
        purpose:
          type: string
        expected_participants:
          type: integer
          nullable: true
        join_code:
          type: string
        join_url:
          type: string
        judge_code:
          type: string
        judge_url:
          type: string
        counts:
          type: object
          properties:
            participants:
              type: integer
            teams:
              type: integer
            judges:
              type: integer
            on_no_team:
              type: integer
            emailable_participants:
              type: integer
              description: Approved participants whose username is email-shaped -- the number an announcement's
                email_participants can actually reach.
    HackMe:
      type: object
      properties:
        team_removal_notice:
          type: string
          description: Explains an organiser removal when the participant has no team.
        display_name:
          type: string
          description: Account name from users.display_name; changes immediately when the account is renamed.
        coc_accepted_at:
          type: string
          format: date-time
          nullable: true
        team:
          nullable: true
          description: The caller's team. Null unless they are a participant on a team.
          allOf:
          - $ref: '#/components/schemas/HackMeTeam'
        team_key:
          nullable: true
          description: Participants only; absent for an organiser or a judge. Null when the participant has no team
            key. The plaintext key is never returned here.
          allOf:
          - $ref: '#/components/schemas/HackKeyMeta'
    HackEventContent:
      type: object
      properties:
        sponsors:
          type: array
          items:
            type: object
            required:
            - name
            properties:
              name:
                type: string
              tier:
                type: string
              url:
                type: string
                format: uri
                description: Optional HTTPS website
              logo_data:
                type: string
                description: Optional PNG
                JPEG or WebP data URI: null
        faq:
          type: array
          items:
            type: object
            required:
            - question
            - answer
            properties:
              question:
                type: string
              answer:
                type: string
        schedule:
          type: array
          items:
            type: object
            required:
            - title
            - start_at
            - end_at
            properties:
              title:
                type: string
              description:
                type: string
              start_at:
                type: string
                description: Event-local datetime on write; RFC 3339 UTC on read
              end_at:
                type: string
                description: Event-local datetime on write; RFC 3339 UTC on read
              prompt:
                type: string
                enum:
                - open
                - building
                - closed
                - judging
                - results
                - publish_results
                description: Optional. The forward move the organiser's next step asks for once this row starts
                  (next_step.cue). It never moves the stage. Returned to organisers only. Any other value is 400
                  invalid_schedule_prompt.
        fixed_schedule:
          type: array
          readOnly: true
          description: The event's real times as read-only schedule rows, computed from its settings on every read
            and never stored (a schedule that acts, 2026-11-02). Ignored on PUT, and a schedule row sent with fixed
            true is dropped. A participant whose team was given more time sees team_deadline in place of entry_deadline.
          items:
            $ref: '#/components/schemas/HackFixedScheduleRow'
    HackFixedScheduleRow:
      type: object
      required:
      - key
      - title
      - description
      - start_at
      - end_at
      - all_day
      - fixed
      - set_in
      properties:
        key:
          type: string
          enum:
          - event_start
          - event_end
          - entry_deadline
          - team_deadline
          - voting
          - results_published
          - judging_end
        title:
          type: string
          example: Entries due
        description:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          nullable: true
          description: Null for a moment such as a deadline; set for the voting window.
        all_day:
          type: boolean
          description: An event start or end saved as a date only. Shown without a time and never prompts or nudges.
        fixed:
          type: boolean
          enum:
          - true
        set_in:
          type: string
          enum:
          - basics
          - entries
          - results
          - judging
          description: Where the organiser changes it.
        prompt:
          type: string
          description: Organisers only. The move this row asks for once its time comes (entry_deadline asks closed).
    HackNextStep:
      type: object
      description: The organiser Overview's one forward move, computed by the server.
      properties:
        kind:
          type: string
          enum:
          - stage
          - entry_rules
          - publish_results
          - none
          description: 'entry_rules is a draft event whose organiser hasn''t saved entry rules yet: the button opens
            Entries'' "What teams hand in" setting (PUT .../entry-rules), not a stage change. Saving any choice
            there, even the default, moves this to stage/open ("Open sign-up").'
        stage:
          type: string
          description: Empty for entry_rules
          publish_results or none.: null
        label:
          type: string
          example: Close entries
        deadline_passed:
          type: boolean
        blocked:
          type: string
          nullable: true
          enum:
          - archive_needs_participants
        cue:
          type: object
          nullable: true
          description: The latest schedule row (typed with a prompt, or fixed) that lines up with this move and
            whose time has come. It only words the card. The stage never moves by itself.
          properties:
            key:
              type: string
              description: The fixed row's key
              or empty for a typed row.: null
            title:
              type: string
            start_at:
              type: string
              format: date-time
            end_at:
              type: string
              format: date-time
              nullable: true
            fixed:
              type: boolean
            now:
              type: boolean
              description: True during the row's window
              or within 15 minutes of a moment.: null
            text:
              type: string
              example: Kickoff is now. Open sign-up?
    HackEventAnnouncement:
      description: Text supports labelled http(s) links, bare web addresses, bold, bullets and line breaks. Standalone
        Zoom, Meet, Teams and YouTube links become cards. No raw HTML is rendered. body_html is safe to insert as-is;
        YouTube thumbnails use i.ytimg.com.
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        body_html:
          type: string
          description: Safe server-rendered HTML.
        pinned:
          type: boolean
        created_at:
          type: string
          format: date-time
        emails_sent:
          type: integer
          description: Deliveries actually sent for this announcement so far, not merely queued.
    HackTeamMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        sender_name:
          type: string
        from_team:
          type: boolean
          description: true when a member of the team wrote it to the organisers.
        created_at:
          type: string
          format: date-time
    HackTeamMessages:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/HackTeamMessage'
    HackReminderSettings:
      type: object
      properties:
        offsets_minutes:
          type: array
          items:
            type: integer
          description: Minutes before the deadline, sorted descending.
        default_minutes:
          type: array
          items:
            type: integer
          description: The factory default, 1440 and 60 (24h, 1h).
        min_minutes:
          type: integer
          description: '15.'
        max_minutes:
          type: integer
          description: 20160 (14 days).
        max_count:
          type: integer
          description: '5.'
        judging_ends_at:
          type: string
          format: date-time
          nullable: true
          description: When judging closes, or null when judges get no reminder.
    HackAbilities:
      type: object
      required:
      - manage
      - judge
      - take_part
      description: Actual membership abilities; synthetic admin inspection grants none.
      properties:
        manage:
          type: boolean
        judge:
          type: boolean
        take_part:
          type: boolean
    HackChecklistLink:
      type: object
      nullable: true
      required:
      - screen
      - section
      - tab
      - href
      properties:
        screen:
          type: string
        section:
          type: string
        tab:
          type: string
          nullable: true
        href:
          type: string
    HackChecklistItem:
      type: object
      required:
      - id
      - label
      - state
      - optional
      - can_dismiss
      - origin_stage
      - group
      - actionable
      - target_id
      - link
      - detail
      - count
      - total
      - settled
      - blocked_reason
      properties:
        id:
          type: string
        label:
          type: string
        origin_stage:
          type: string
        target_id:
          type: string
        detail:
          type: string
        version:
          type: string
        optional:
          type: boolean
        can_dismiss:
          type: boolean
        actionable:
          type: boolean
        settled:
          type: boolean
        count:
          type: integer
          nullable: true
        total:
          type: integer
          nullable: true
        state:
          type: string
          enum:
          - done
          - not_needed
          - optional
          - todo
        group:
          type: string
          enum:
          - current
          - earlier_required
          - earlier_optional
          - history
        link:
          $ref: '#/components/schemas/HackChecklistLink'
        blocked_reason:
          type: string
          nullable: true
    HackChecklist:
      type: object
      required:
      - role
      - stage
      - map_version
      - items
      - next
      properties:
        role:
          type: string
        stage:
          type: string
        map_version:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/HackChecklistItem'
        next:
          type: object
          nullable: true
          properties:
            kind:
              type: string
              enum:
              - link
              - stage
              - lock_judging
              - publish_results
              - submit_entry
              - end_event
            item_id:
              type: string
            target_id:
              type: string
            label:
              type: string
            link:
              $ref: '#/components/schemas/HackChecklistLink'
            stage:
              type: string
            confirmation_required:
              type: boolean
            blocked_reason:
              type: string
              nullable: true
            deadline_passed:
              type: boolean
            cue:
              type: object
              nullable: true
              additionalProperties: true
    HackEventView:
      type: object
      properties:
        checklist:
          $ref: '#/components/schemas/HackChecklist'
        event:
          $ref: '#/components/schemas/HackEvent'
        can:
          $ref: '#/components/schemas/HackAbilities'
        role:
          type: string
          enum:
          - organiser
          - participant
          - judge
        me:
          $ref: '#/components/schemas/HackMe'
        organiser:
          description: Present for an organiser, and when the platform admin reads the event.
          allOf:
          - $ref: '#/components/schemas/HackOrganiser'
        admin_view:
          type: boolean
          description: True when the platform admin reads an event it is not in. Writes on these routes are refused.
        next_step:
          description: Present for an organiser, and when the platform admin reads the event.
          allOf:
          - $ref: '#/components/schemas/HackNextStep'
    HackSubmission:
      allOf:
      - $ref: '#/components/schemas/HackResultCard'
      - type: object
        required:
        - team
        - team_name
        properties:
          team:
            type: string
            description: Team slug
          team_name:
            type: string
          screenshot_url:
            type: string
            description: Present only when has_screenshot is true.
    HackResultCard:
      type: object
      description: A ranked team's public summary card, snapshotted when results are published. code_url is empty
        when the event's code line is Off; site_url is the team site's public address only while it is live and
        not taken down.
      properties:
        title:
          type: string
        tagline:
          type: string
          description: The one-line solution
        problem:
          type: string
        audience:
          type: string
        tools:
          type: array
          items:
            type: string
        maturity:
          type: string
          enum:
          - ''
          - working
          - partial
          - concept
        track:
          type: object
          nullable: true
        video_url:
          type: string
        video_host:
          type: string
        code_url:
          type: string
        code_host:
          type: string
        site_url:
          type: string
        has_screenshot:
          type: boolean
    HackTeamKeyStatus:
      type: object
      properties:
        key:
          nullable: true
          description: Null when the caller has no team key.
          allOf:
          - $ref: '#/components/schemas/HackKeyMeta'
        team:
          nullable: true
          description: Null when the caller is on no team.
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
        site:
          nullable: true
          description: Null when the caller is on no team. Same shape as me.team.site.
          allOf:
          - $ref: '#/components/schemas/HackTeamSite'
        upload_limit_bytes:
          type: integer
          description: Maximum archive body size in bytes.
        upload_limits:
          type: string
          description: Current archive and unpacked size and file count limits.
        api_base:
          type: string
          example: https://simple-hack.app
          description: The API origin.
        mcp_url:
          type: string
          example: https://simple-hack.app/mcp
          description: The connector.
    HackTeamKeyCreated:
      type: object
      properties:
        key:
          type: string
          description: The plaintext key. Shown only in this response.
        last4:
          type: string
        created_at:
          type: string
          format: date-time
        site:
          $ref: '#/components/schemas/HackTeamSite'
        api_base:
          type: string
          example: https://simple-hack.app
        mcp_url:
          type: string
          example: https://simple-hack.app/mcp
    HackPerson:
      type: object
      properties:
        primary_organiser:
          type: boolean
          description: True only for the protected event creator.
        user_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
          description: Account name from users.display_name; changes immediately when the account is renamed.
        role:
          type: string
          enum:
          - organiser
          - participant
          - judge
        team:
          nullable: true
          description: Null when the person is on no team.
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
        joined_at:
          type: string
          format: date-time
        coc_accepted_at:
          type: string
          format: date-time
          nullable: true
        has_key:
          type: boolean
          description: Participants only. True when this person has a team key.
        joined_via:
          type: string
          enum:
          - link
          - application
          description: 'How this member arrived: a join link, or an application (zp-hack-applications.sql).'
    HackTeamOrganiser:
      type: object
      description: A team as the organiser sees it, including its site and deadline.
      properties:
        id:
          type: string
          format: uuid
          description: 'The team''s row id (added for M3: judging''s assignment/conflict routes key on this, not
            the slug).'
        slug:
          type: string
        name:
          type: string
        code:
          type: string
        link:
          type: string
          description: The team's instant-join link, https://<hack host>/team/<code>. Teams redesign, 2026-10-31.
        locked:
          type: boolean
          description: Takes nobody new by request, link, code, invite or Fill teams. Teams redesign, 2026-10-31.
        kept:
          type: boolean
          description: 'kept_after_leave: the team was kept, empty, after its last member left past its deadline.
            Always locked for good. Teams redesign, 2026-10-31.'
        created_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
              email:
                type: string
              display_name:
                type: string
                description: Account name from users.display_name; changes immediately when the account is renamed.
              admin:
                type: boolean
                description: Teams redesign
                2026-10-31.: null
        site:
          description: url, exists, live_version, taken_down, taken_down_reason, plus name and ready.
          allOf:
          - $ref: '#/components/schemas/HackTeamSite'
        deadline:
          type: string
          format: date-time
          nullable: true
          description: This team's effective deadline.
        deadline_override:
