- op: putSitesBySitenameLock
  set: /description
  value: Set or generate the owner's website passcode through this trusted REST route. Visitors must unlock each
    host before viewing the site. A passcode is a site gate, not per-person privacy for a storage resource.
- op: getSiteStorageUsage
  set: /description
  value: The default limit is 1,000,000 bytes pooled across this website's KV, SQLite and raw-file resources. Deployed
    assets and historical data have separate limits.
- op: addStorageTableRow
  set: /description
  value: Checked against the table's add rules. One JSON object of real column names and scalar values. The server
    builds INSERT OR ABORT with bound values; visitor-supplied primary keys and rowids are refused. SQLite assigns
    the IDs and RETURNING supplies the result. Visitor visitor_id, created_at and updated_at are ignored; visitor_id
    is filled from the site session and created_at with UTC time when the columns exist. Declared SQLite foreign
    keys must point at a row the visitor may read under the parent table's read value (for own, a row they added),
    checked inside the insert transaction. Missing and unreadable parents both return 404 invalid_reference; the
    insert is rolled back. Optional references must be all NULL; partial composite NULLs are refused. A trigger
    or foreign-key action that writes another table refuses the insert (403). No visitor SQL accepted. Where the add
    check uses auth.checked (spam-checked adds), a caller other than the owner sends the one-time Turnstile token in X-SH-Turnstile
    (auth.js does it on its own); without one 403 spam_check_required, a failed, reused, expired or mismatched one
    403 spam_check_failed, Cloudflare unreachable 403 spam_check_unavailable. The token must have been solved in
    the frame at GET /v1/turnstile/frame for this host and resource. Such a post is at most SPAM_CHECKED_POST_MAX_BYTES
    (413 post_too_large) with at most SPAM_CHECKED_POST_MAX_LINKS links (400 too_many_links), and RATE_LIMIT_SPAM_CHECKED_IP
    and RATE_LIMIT_SPAM_CHECKED_SITE apply (429). The same holds for adding a KV key. The query param for (owner,
    or the owner signed in on the site's own address, only; SIM-358, 2026-11-06, review fixes 2026-11-06) adds this
    row for one other signed-in visitor instead of the caller, by their visitor_id or the email they signed in with,
    only on a table whose read rules limit rows to the row's visitor or the owner (403 for_requires_own on any other
    table).
    It is refused (404 visitor_unknown) if they have never signed in on this site, or (400 visitor_email_ambiguous)
    if more than one signed-in person currently matches that email; there is no pre-sign-in email binding. The server
    ignores any visitor_id or written_by the caller sends and sets them itself, visitor_id to that visitor and written_by
    (added lazily, under the write lock, the first time a table is used this way; 409 written_by_blocked if a trigger
    or view appears to depend on the table) to owner, otherwise the empty string, which is also written_by's value
    whenever for is absent, including a plain owner add. A row added this way does not fire record.added to the
    owner's own subscriptions. Host only, 404 on Simple Hack and event storage.
- op: listNotifications
  set: /description
  value: Owner credentials required on Host. On Hack, use a personal credential for your approved team membership;
    subscriptions belong to the person, not the holding account.
- op: listSiteNotifications
  set: /description
  value: Owner credentials required on Host. On Hack, use a personal credential for your approved team membership;
    subscriptions belong to the person, not the holding account.
- op: listSiteNotifications
  set: /responses/200/description
  value: List notifications for a site; an empty list returns 200, including an authorised Hack website not yet
    published
- op: listSiteNotifications
  set: /parameters/1/description
  value: Hack event slug for a team site. Required when the person belongs to same-named teams in multiple events;
    the connector supplies it from the selected team.
- op: createNotification
  set: /description
  value: The owner-entered URL is accepted without an MCP verification challenge. Generates a secret unless one
    is supplied; the response shows it once. Optional custom header and svix-* aliases are sent only for owner-made
    subscriptions. MCP and REST share the site subscription cap. On Hack, new subscriptions require approved membership
    before the team submission deadline; deliveries and existing refreshes continue afterward. Leaving, removal,
    moves, or loss of approval delete the affected subscriptions.
- op: createNotification
  set: /parameters/2/description
  value: Hack event slug for a team site. Required when the person belongs to same-named teams in multiple events;
    the connector supplies it from the selected team.
- op: pauseNotification
  set: /description
  value: false also resumes suspension and makes held deliveries due now. Owner credentials required. On Hack, new
    subscriptions require approved membership before the team submission deadline; deliveries and existing refreshes
    continue afterward. Leaving, removal, moves, or loss of approval delete the affected subscriptions.
- op: pauseNotification
  set: /parameters/2/description
  value: Hack event slug for a team site. Required when the person belongs to same-named teams in multiple events;
    the connector supplies it from the selected team.
- op: deleteNotification
  set: /description
  value: Owner credentials required on Host. On Hack, use a personal credential for your approved team membership;
    subscriptions belong to the person, not the holding account.
- op: deleteNotification
  set: /parameters/2/description
  value: Hack event slug for a team site. Required when the person belongs to same-named teams in multiple events;
    the connector supplies it from the selected team.
- op: testNotification
  set: /description
  value: Sends notification.test with data {v:1, site, site_url, test:true}; webhook-id starts with evt_test_. The
    response reports the HTTP status and result category, never the receiver body. Test sends require an unexpired
    owner-made subscription and do not appear in delivery history. Challenge and test sends share limits of 10/minute
    per owner, host, and resolved IP, with at most 10 running at once. On Hack, new subscriptions require approved
    membership before the team submission deadline; deliveries and existing refreshes continue afterward. Leaving,
    removal, moves, or loss of approval delete the affected subscriptions.
- op: testNotification
  set: /parameters/2/description
  value: Hack event slug for a team site. Required when the person belongs to same-named teams in multiple events;
    the connector supplies it from the selected team.
- op: rotateNotificationSecret
  set: /description
  value: Shows the new secret once. Deliveries carry signatures for both secrets for 24 hours, until previous_valid_until,
    or drops the previous secret if it cannot be read. An MCP subscription must refresh events/subscribe with a
    new secret instead. On Hack, new subscriptions require approved membership before the team submission deadline;
    deliveries and existing refreshes continue afterward. Leaving, removal, moves, or loss of approval delete the
    affected subscriptions.
- op: rotateNotificationSecret
  set: /parameters/2/description
  value: Hack event slug for a team site. Required when the person belongs to same-named teams in multiple events;
    the connector supplies it from the selected team.
- op: listNotificationDeliveries
  set: /description
  value: Newest first, at most 200 within the configured history window (default 7 days). Pending deliveries are
    held while suspended. Five attempts by default; HTTP 410/413 and refused addresses are not retried. On Hack,
    new subscriptions require approved membership before the team submission deadline; deliveries and existing refreshes
    continue afterward. Leaving, removal, moves, or loss of approval delete the affected subscriptions.
- op: listNotificationDeliveries
  set: /parameters/2/description
  value: Hack event slug for a team site. Required when the person belongs to same-named teams in multiple events;
    the connector supplies it from the selected team.
- component: /securitySchemes/connector/description
  value: 'Per-person OAuth 2.1 (authorization code; PKCE S256 required for every self-registered client). On Simple
    Host, a REST-audience access token sent as `Authorization: Bearer` acts as that person''s X-API-Key. On hosted
    Simple Hack, new consent issues one personal `sites events` grant for all event roles. MCP `hack_select_team`
    stores a publishing team on that grant; each website call rechecks approved membership and uses a separate scoped
    team credential. Legacy `sites team:<uuid>` grants remain site-only. Event roles still control each operation.
    MCP-audience tokens work only on /mcp. Optional MCP Apps My sites and dashboard use these same team and organiser
    tools; their default-off flags do not change REST permissions or routes. Discovery at /.well-known/oauth-authorization-server
    publishes the scopes available on this instance; events is offered only in hosted hack mode.'
- component: /securitySchemes/connector/flows/authorizationCode/scopes/events
  value: Act as the signed-in person across their Simple Hack events and roles
- component: /parameters/createAccess/description
  value: Creation only. Default anyone; specific allows only the owner and named viewers from the first request.
    Simple Hack refuses specific.
- component: /schemas/ErrorResponse/properties/code/description
  value: 'A stable snake_case name for the refusal, present where one status has more than one meaning. site_exists
    (409: this account already has a site of that name), domain_taken (409: the address belongs to another site
    or person), invalid_name (400: not 1-63 lowercase letters, digits and hyphens), name_reserved (400: reserved
    by the platform), invalid_domain (400: not a domain that can be connected), invalid_rules (400: invalid row
    rules, with rule_error and rules_errors), redirects_invalid (400: root _redirects has invalid rules; fix the listed line numbers), site_quota_reached
    (403), custom_domain_required
    (409: the site needs its own address first), use_custom_domain and visitor_auth_required (401), missing_api_key, wrong_auth_header
    (sent Authorization instead of X-API-Key), invalid_api_key (unknown, revoked or signed-out key), key_expired
    (past the expiry chosen when it was minted) and key_expired_idle (unused too long, KEY_IDLE_EXPIRY_DAYS) (401),
    deploy_only_key (403: a deploy-only key on a route it may not call), csrf_required (403), recently_deleted (409:
    the name belongs to a site in Recently deleted), site_not_deleted (409: restore of a live site), confirm_required
    (400), not_found (404: also a PUT deploy to a site the account does not have), site_not_found
    (404: no site of that name on this account, on versions, rollback and site settings), export_link_invalid (404:
    the download link expired or is not valid), site_suspended (403: the operator has taken the site down; changes
    and public reads of its data are refused until it is restored, `reason` says why), account_suspended (403: the
    operator has suspended this account; its keys, connected apps and sign-in are refused, `reason` says why), site_offline
    (403: the owner has taken the site offline; visitor saves are refused until it is back online, the owner''s
    key still writes), preview_unavailable
    (409: the site has no address of its own to preview on), site_locked (403: the site has a passcode and the request
    carries no unlock for this host, nor the owner''s or admin''s key), invalid_passcode (400), passcodes_not_enabled
    and passcode_needs_own_address (409: a passcode cannot be set on this server), no_passcode (409), invalid_request
    (400), use_address_family (400: a *.<domain> sent to a site''s domain route), no_address_family (404), invalid_site_prefix,
    invalid_rank, invalid_cert_mode, cert_mode_unavailable (400), address_family_limit and address_families_unavailable
    (409), signup_unavailable_region (403: this server does not allow sign-in or sign-up from the signer''s region,
    new account or existing; an API key is unaffected). New codes may be added.'
- component: /schemas/NotificationEventName/description
  value: record.added, record.changed, and file.uploaded are visitor storage writes. The four site events are Simple
    Host only (invalid_events on Simple Hack). site.deployed fires when a version goes live through a deploy or
    an active-version change; domain.status_changed when a domain check records a status different from the previous
    one or a long-failing domain is released; viewer.access_requested when a person signed in with an email not
    on a named-viewers list reaches the no-access page, once per person per site per 24 hours; visitor.signed_up
    on a person's first sign-in on the site. A storage filter narrows record and file events only. Up to seven distinct
    names per subscription.
- component: /schemas/Notification/properties/event/description
  value: For a Hack organiser website, its event slug; use event instead of site with notification tools.
- component: /schemas/NotificationLimits/properties/can_create/description
  value: On Hack site lists, whether the current member may create a subscription now.
- component: /schemas/NotificationLimits/properties/can_manage/description
  value: On Hack site lists, whether testing, pausing, resuming, and rotation are permitted now.
- component: /responses/TooLarge/description
  value: The request or deployment exceeds its applicable size limit.
