  /v1/hack/events/{slug}/stage:
    post:
      x-audience:
      - public-hack
      tags:
      - Hosted events
      operationId: setHackEventStage
      summary: Set the event stage (organiser) (EVENTS=hosted only)
      description: closed ("Submissions closed") is accepted. Setting it makes the deadline now when the deadline
        is unset or still later; a team extension that is still in the future is kept. Moving from closed back to
        open or building clears a passed deadline and passed team extensions, so teams can deploy again. Judging
        and results are supported closed-submission stages. Moving from either back to open or building also clears
        passed deadlines and extensions.
      security:
      - apiKey: []
      parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - stage
              properties:
                stage:
                  type: string
                  enum:
                  - draft
                  - open
                  - building
                  - closed
                  - judging
                  - results
                  - archived
                  description: closed makes the deadline now when it is unset or still later. Moving from closed
                    back to open or building clears a passed deadline and passed team extensions. Judging and results
                    keep submissions closed; archived ends the event permanently.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Updated organiser view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HackEventView'
        '409':
          description: 'event_closed (leaving archived), archive_needs_participants (nobody joined: delete instead)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: event_taken_down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: event_not_found
          content:
            application/json:
