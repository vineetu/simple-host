                  message:
                    allOf:
                    - {$ref: '#/components/schemas/HackTeamMessage'}
                    - type: object
                      properties:
                        team_id: {type: string, format: uuid}
                        team_name: {type: string}
                        recipients: {type: integer, description: Organisers notified.}
        '400':
          description: invalid_text
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: event_not_found for a non-participant
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '409':
          description: no_team or event_closed
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '429':
          description: rate_limited; Retry-After header
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
  /v1/hack/events/{slug}/reminders:
    get:
      x-audience: [public-hack]
      tags: [Hosted events]
      operationId: getHackReminderSettings
      summary: Read reminder offsets (organiser) (EVENTS=hosted only)
      description: The minutes-before-deadline offsets that drive both the entry-deadline reminder emails to teams and the judging-closes reminders to judges.
      security:
      - {apiKey: []}
      parameters:
      - {in: path, name: slug, required: true, schema: {type: string}}
      responses:
        '200':
          description: Reminder settings
          content:
            application/json: {schema: {$ref: '#/components/schemas/HackReminderSettings'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: event_not_found
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
    put:
      x-audience: [public-hack]
      tags: [Hosted events]
      operationId: putHackReminderSettings
      summary: Replace reminder offsets (organiser) (EVENTS=hosted only)
      description: 'Validates, dedupes and sorts offsets_minutes descending: 0 to 5 entries, each 15 to 20160 minutes (14 days), distinct.'
      security:
      - {apiKey: []}
      parameters:
      - {in: path, name: slug, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offsets_minutes]
              properties:
                offsets_minutes:
                  type: array
                  items: {type: integer}
                  maxItems: 5
                  description: Minutes before the deadline, each 15 to 20160.
      responses:
        '200':
          description: Reminder settings
          content:
            application/json: {schema: {$ref: '#/components/schemas/HackReminderSettings'}}
        '400':
          description: invalid_offsets
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: event_not_found
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '409':
          description: event_closed
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
tags:
- name: Notifications
  description: Signed HTTPS notifications for visitor storage writes on Simple Host and Simple Hack.
- name: Hosted events
  description: Hosted events, teams, entries, judging, results and event websites.
- {name: Events, description: Hostname claims for self-hosted events.}
components_add:
  schemas:
    HackArchiveLink:
      type: object
      required: [url, expires_at, expires_in]
      properties:
        url: {type: string, format: uri}
        expires_at: {type: string, format: date-time}
        expires_in: {type: integer, description: Seconds until expiration.}
    HackEntryField:
      type: string
      enum: [title, tagline, description, video_url, code_url, screenshot]
      description: The legacy entry_required single-list model's six fields.
    HackEntryRuleField:
      type: string
      enum:
      - title
      - problem
      - tagline
      - audience
      - track
      - tools
      - maturity
      - description
      - video_url
      - site
      - code_url
      - screenshot
      - one_of
      description: Every field the entry-rules engine understands, plus one_of for an unmet show-your-work group (by default video_url or site.
    HackKeyMeta:
      type: object
      description: A team key without its secret.
      properties:
        last4: {type: string, description: Last 4 characters of the key.}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time, nullable: true}
    HackTeamSite:
      type: object
      description: A team's site at https://<team>.<event>.simple-hack.app/.
      properties:
        name: {type: string, description: 'The team slug, which is the site''s name.'}
        url: {type: string, description: 'https://<team>.<event>.simple-hack.app/'}
        ready:
          type: boolean
          description: 'False until the event''s team addresses are set up. Errors: 409 team_sites_not_ready.'
        exists: {type: boolean}
        live_version:
          type: integer
          nullable: true
          description: The live version, or null when the site does not exist.
        taken_down:
          type: boolean
          description: True when the organiser or the platform has taken the site down.
        taken_down_reason: {type: string, description: Empty when the site is up.}
    HackMeTeam:
      type: object
      description: The caller's team, as a participant sees it (names only, never another person's email or account id).
      properties:
        slug: {type: string}
        name: {type: string}
        code: {type: string}
        members:
          type: array
          items:
            type: object
            properties:
              user_id: {type: string, format: uuid, description: Member ID for teammate removal.}
              display_name:
                type: string
                description: Account name from users.display_name; changes immediately when the account is renamed.
              you: {type: boolean}
        site: {$ref: '#/components/schemas/HackTeamSite'}
        deadline:
          type: string
          format: date-time
          nullable: true
          description: This team's effective deadline.
        extended: {type: boolean, description: True when the team has its own later deadline.}
        frozen: {type: boolean, description: True once the deadline has passed.}
        pinned_version: {type: integer, nullable: true, description: The site's live version at the deadline.}
    HackEvent:
      type: object
      properties:
        accent_color: {type: string, description: Organiser palette choice; empty is automatic.}
        color: {type: string, description: Effective crayon hex seed shared by the page and icon.}
        theme:
          type: string
          description: Whole-page style for the public event page (poster, confetti, boardroom, garden, terminal), or empty for the classic look.
        slug: {type: string}
        title: {type: string}
        tagline: {type: string}
        about: {type: string}
        rules: {type: string}
        prizes: {type: string}
        overall_prizes:
          type: array
          maxItems: 3
          items: {type: string, maxLength: 60}
          description: 'Prizes by index: 0 = 1st, 1 = 2nd, 2 = 3rd. Errors: invalid_overall_prizes.'
        coc_text: {type: string}
        coc_default:
          type: string
          description: The code of conduct used when the organiser has not written one.
        stage: {type: string, enum: [draft, open, building, closed, judging, results, archived]}
        time_zone: {type: string}
        starts_at: {type: string, format: date-time, nullable: true}
        ends_at: {type: string, format: date-time, nullable: true}
        team_size_max: {type: integer}
        team_finding: {type: boolean, default: true}
        applications_open:
          type: boolean
          default: true
          description: Whether people without the join link can apply from Find a hackathon and the event page.
        url: {type: string}
        taken_down: {type: boolean}
        results_visibility: {type: string, enum: [winners, ranking]}
        submission_deadline:
          type: string
          format: date-time
          nullable: true
          description: The event's deadline, RFC 3339 UTC, or null.
        judging_ends_at:
          type: string
          format: date-time
          nullable: true
          description: When judging closes, RFC 3339 UTC, or null.
        entry_required:
          type: array
          deprecated: true
          description: 'Deprecated: the fields marked required by the legacy single-list model, kept in step with the fuller rules at .../entry-rules.'
          items: {$ref: '#/components/schemas/HackEntryField'}
        submissions_public: {type: boolean, default: false}
        gallery_open: {type: boolean}
        team_sites_ready: {type: boolean, description: True once the event's team addresses have a certificate.}
        judging_locked_at:
          type: string
          format: date-time
          nullable: true
          description: When judging was locked. Null while scores can still change.
        scoring_open:
          type: boolean
          description: Whether judges may score in the current stage (during Judging; also while building on the standing demo).
        judging_lock_reason: {type: string, description: The reason from the last unlock.}
        stages_offered: {type: array, description: Stages an organiser can set now., items: {type: string}}
    HackOrganiser:
      type: object
      description: Present for an organiser, and when the platform admin reads the event.
      properties:
        organiser_name: {type: string}
        organisation: {type: string}
        contact_email: {type: string}
        purpose: {type: string}
        expected_participants: {type: integer, nullable: true}
        join_code: {type: string}
        join_url: {type: string}
        judge_code: {type: string}
        judge_url: {type: string}
        counts:
          type: object
          properties:
            participants: {type: integer}
            teams: {type: integer}
            judges: {type: integer}
            on_no_team: {type: integer}
            emailable_participants:
              type: integer
              description: Approved participants whose username is email-shaped -- the number an announcement's email_participants can actually reach.
    HackMe:
      type: object
      properties:
        team_removal_notice:
          type: string
          description: Explains an organiser removal when the participant has no team.
        display_name:
          type: string
          description: Account name from users.display_name; changes immediately when the account is renamed.
        coc_accepted_at: {type: string, format: date-time, nullable: true}
        team:
          nullable: true
          description: The caller's team. Null unless they are a participant on a team.
          allOf:
          - {$ref: '#/components/schemas/HackMeTeam'}
        team_key:
          nullable: true
          description: Participants only; absent for an organiser or a judge.
          allOf:
          - {$ref: '#/components/schemas/HackKeyMeta'}
    HackEventContent:
      type: object
      properties:
        sponsors:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: {type: string}
              tier: {type: string}
              url: {type: string, format: uri, description: Optional HTTPS website}
              logo_data: {type: string, description: 'Optional PNG, JPEG or WebP data URI'}
        faq:
          type: array
          items:
            type: object
            required: [question, answer]
            properties: {question: {type: string}, answer: {type: string}}
        schedule:
          type: array
          items:
            type: object
            required: [title, start_at, end_at]
            properties:
              title: {type: string}
              description: {type: string}
              start_at: {type: string, description: Event-local datetime on write; RFC 3339 UTC on read}
              end_at: {type: string, description: Event-local datetime on write; RFC 3339 UTC on read}
              prompt:
                type: string
                enum: [open, building, closed, judging, results, publish_results]
                description: 'Optional. The forward move the organiser''s next step asks for once this row starts (next_step.cue). Errors: 400 invalid_schedule_prompt.'
        fixed_schedule:
          type: array
          readOnly: true
          description: The event's real times as read-only schedule rows, computed from its settings on every read and never stored.
          items: {$ref: '#/components/schemas/HackFixedScheduleRow'}
    HackFixedScheduleRow:
      type: object
      required: [key, title, description, start_at, end_at, all_day, fixed, set_in]
      properties:
        key:
          type: string
          enum:
          - event_start
          - event_end
          - entry_deadline
          - team_deadline
          - voting
          - results_published
          - judging_end
        title: {type: string}
        description: {type: string}
        start_at: {type: string, format: date-time}
        end_at:
          type: string
          format: date-time
          nullable: true
          description: Null for a moment such as a deadline; set for the voting window.
        all_day: {type: boolean, description: An event start or end saved as a date only.}
        fixed: {type: boolean, enum: [true]}
        set_in:
          type: string
          enum: [basics, entries, results, judging]
          description: Where the organiser changes it.
        prompt:
          type: string
          description: Organisers only. The move this row asks for once its time comes (entry_deadline asks closed).
    HackNextStep:
      type: object
      description: The organiser Overview's one forward move, computed by the server.
      properties:
        kind:
          type: string
          enum: [stage, entry_rules, publish_results, none]
          description: 'entry_rules is a draft event whose organiser hasn''t saved entry rules yet: the button opens Entries'' "What teams hand in" setting.'
        stage: {type: string, description: 'Empty for entry_rules, publish_results or none.'}
        label: {type: string}
        deadline_passed: {type: boolean}
        blocked: {type: string, nullable: true, enum: [archive_needs_participants]}
        cue:
          type: object
          nullable: true
          description: The latest schedule row (typed with a prompt, or fixed) that lines up with this move and whose time has come.
          properties:
            key: {type: string, description: 'The fixed row''s key, or empty for a typed row.'}
            title: {type: string}
            start_at: {type: string, format: date-time}
            end_at: {type: string, format: date-time, nullable: true}
            fixed: {type: boolean}
            now:
              type: boolean
              description: True during the row's window, or within 15 minutes of a moment.
            text: {type: string}
    HackEventAnnouncement:
      description: Text supports labelled http(s) links, bare web addresses, bold, bullets and line breaks.
      type: object
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        body: {type: string}
        body_html: {type: string, description: Safe server-rendered HTML.}
        pinned: {type: boolean}
        created_at: {type: string, format: date-time}
        emails_sent:
          type: integer
          description: Deliveries actually sent for this announcement so far, not merely queued.
    HackTeamMessage:
      type: object
      properties:
        id: {type: string, format: uuid}
        text: {type: string}
        sender_name: {type: string}
        from_team: {type: boolean, description: true when a member of the team wrote it to the organisers.}
        created_at: {type: string, format: date-time}
    HackTeamMessages:
      type: object
      properties:
        messages: {type: array, items: {$ref: '#/components/schemas/HackTeamMessage'}}
    HackReminderSettings:
      type: object
      properties:
        offsets_minutes:
          type: array
          items: {type: integer}
          description: Minutes before the deadline, sorted descending.
        default_minutes:
          type: array
          items: {type: integer}
          description: The factory default, 1440 and 60 (24h, 1h).
        min_minutes: {type: integer, description: '15.'}
        max_minutes: {type: integer, description: 20160 (14 days).}
        max_count: {type: integer, description: '5.'}
        judging_ends_at:
          type: string
          format: date-time
          nullable: true
          description: When judging closes, or null when judges get no reminder.
    HackAbilities:
      type: object
      required: [manage, judge, take_part]
      description: Actual membership abilities; synthetic admin inspection grants none.
      properties: {manage: {type: boolean}, judge: {type: boolean}, take_part: {type: boolean}}
    HackChecklistLink:
      type: object
      nullable: true
      required: [screen, section, tab, href]
      properties:
        screen: {type: string}
        section: {type: string}
        tab: {type: string, nullable: true}
        href: {type: string}
    HackChecklistItem:
      type: object
      required:
      - id
      - label
      - state
      - optional
      - can_dismiss
      - origin_stage
      - group
      - actionable
      - target_id
      - link
      - detail
      - count
      - total
      - settled
      - blocked_reason
      properties:
        id: {type: string}
        label: {type: string}
        origin_stage: {type: string}
        target_id: {type: string}
        detail: {type: string}
        version: {type: string}
        optional: {type: boolean}
        can_dismiss: {type: boolean}
        actionable: {type: boolean}
        settled: {type: boolean}
        count: {type: integer, nullable: true}
        total: {type: integer, nullable: true}
        state: {type: string, enum: [done, not_needed, optional, todo]}
        group: {type: string, enum: [current, earlier_required, earlier_optional, history]}
        link: {$ref: '#/components/schemas/HackChecklistLink'}
        blocked_reason: {type: string, nullable: true}
    HackChecklist:
      type: object
      required: [role, stage, map_version, items, next]
      properties:
        role: {type: string}
        stage: {type: string}
        map_version: {type: integer}
        items: {type: array, items: {$ref: '#/components/schemas/HackChecklistItem'}}
        next:
          type: object
          nullable: true
          properties:
            kind:
              type: string
              enum: [link, stage, lock_judging, publish_results, submit_entry, end_event]
            item_id: {type: string}
            target_id: {type: string}
            label: {type: string}
            link: {$ref: '#/components/schemas/HackChecklistLink'}
            stage: {type: string}
            confirmation_required: {type: boolean}
            blocked_reason: {type: string, nullable: true}
            deadline_passed: {type: boolean}
            cue: {type: object, nullable: true, additionalProperties: true}
    HackEventView:
      type: object
      properties:
        checklist: {$ref: '#/components/schemas/HackChecklist'}
        event: {$ref: '#/components/schemas/HackEvent'}
        can: {$ref: '#/components/schemas/HackAbilities'}
        role: {type: string, enum: [organiser, participant, judge]}
        me: {$ref: '#/components/schemas/HackMe'}
        organiser:
          description: Present for an organiser, and when the platform admin reads the event.
          allOf:
          - {$ref: '#/components/schemas/HackOrganiser'}
        admin_view: {type: boolean, description: True when the platform admin reads an event it is not in.}
        next_step:
          description: Present for an organiser, and when the platform admin reads the event.
          allOf:
          - {$ref: '#/components/schemas/HackNextStep'}
    HackSubmission:
      allOf:
      - {$ref: '#/components/schemas/HackResultCard'}
      - type: object
        required: [team, team_name]
        properties:
          team: {type: string, description: Team slug}
          team_name: {type: string}
          screenshot_url: {type: string, description: Present only when has_screenshot is true.}
    HackResultCard:
      type: object
      description: A ranked team's public summary card, snapshotted when results are published.
      properties:
        title: {type: string}
        tagline: {type: string, description: The one-line solution}
        problem: {type: string}
        audience: {type: string}
        tools: {type: array, items: {type: string}}
        maturity: {type: string, enum: ['', working, partial, concept]}
        track: {type: object, nullable: true}
        video_url: {type: string}
        video_host: {type: string}
        code_url: {type: string}
        code_host: {type: string}
        site_url: {type: string}
        has_screenshot: {type: boolean}
    HackTeamKeyStatus:
      type: object
      properties:
        key:
          nullable: true
          description: Null when the caller has no team key.
          allOf:
          - {$ref: '#/components/schemas/HackKeyMeta'}
        team:
          nullable: true
          description: Null when the caller is on no team.
          type: object
          properties: {slug: {type: string}, name: {type: string}}
        site:
          nullable: true
          description: Null when the caller is on no team.
          allOf:
          - {$ref: '#/components/schemas/HackTeamSite'}
        upload_limit_bytes: {type: integer, description: Maximum archive body size in bytes.}
        upload_limits: {type: string, description: Current archive and unpacked size and file count limits.}
        api_base: {type: string, description: The API origin.}
        mcp_url: {type: string, description: The connector.}
    HackTeamKeyCreated:
      type: object
      properties:
        key: {type: string, description: The plaintext key. Shown only in this response.}
        last4: {type: string}
        created_at: {type: string, format: date-time}
        site: {$ref: '#/components/schemas/HackTeamSite'}
        api_base: {type: string}
        mcp_url: {type: string}
    HackPerson:
      type: object
      properties:
        primary_organiser: {type: boolean, description: True only for the protected event creator.}
        user_id: {type: string, format: uuid}
        email: {type: string}
        display_name:
          type: string
          description: Account name from users.display_name; changes immediately when the account is renamed.
        role: {type: string, enum: [organiser, participant, judge]}
        team:
          nullable: true
          description: Null when the person is on no team.
          type: object
          properties: {slug: {type: string}, name: {type: string}}
        joined_at: {type: string, format: date-time}
        coc_accepted_at: {type: string, format: date-time, nullable: true}
        has_key: {type: boolean, description: Participants only. True when this person has a team key.}
        joined_via:
          type: string
          enum: [link, application]
          description: 'How this member arrived: a join link, or an application (zp-hack-applications.sql).'
    HackTeamOrganiser:
      type: object
      description: A team as the organiser sees it, including its site and deadline.
      properties:
        id:
          type: string
          format: uuid
          description: 'The team''s row id (added for M3: judging''s assignment/conflict routes key on this, not the slug).'
        slug: {type: string}
        name: {type: string}
        code: {type: string}
        link:
          type: string
          description: The team's instant-join link, https://<hack host>/team/<code>.
        locked:
          type: boolean
          description: Takes nobody new by request, link, code, invite or Fill teams.
        kept:
          type: boolean
          description: 'kept_after_leave: the team was kept, empty, after its last member left past its deadline.'
        created_at: {type: string, format: date-time}
        members:
          type: array
          items:
            type: object
            properties:
              user_id: {type: string, format: uuid}
              email: {type: string}
              display_name:
                type: string
                description: Account name from users.display_name; changes immediately when the account is renamed.
              admin: {type: boolean, description: 'Teams redesign, 2026-10-31.'}
        site:
          description: url, exists, live_version, taken_down, taken_down_reason, plus name and ready.
          allOf:
          - {$ref: '#/components/schemas/HackTeamSite'}
        deadline:
          type: string
          format: date-time
          nullable: true
          description: This team's effective deadline.
        deadline_override:
          type: string
          format: date-time
          nullable: true
          description: The team's own later deadline, or null when it uses the event's.
        extended: {type: boolean, description: True when deadline_override is set.}
        frozen: {type: boolean, description: True once the effective deadline has passed.}
        pinned_version: {type: integer, nullable: true, description: The live version at the deadline.}
        pinned_url:
          type: string
          nullable: true
          description: A preview link for the deadline version, on the team's own host.
    HackTeamList:
      type: object
      properties:
        teams: {type: array, items: {$ref: '#/components/schemas/HackTeamOrganiser'}}
        team_size_max: {type: integer}
        team_finding: {type: boolean, default: true}
        on_no_team:
          type: array
          description: Participants on no team.
          items:
            type: object
            properties:
              user_id: {type: string, format: uuid}
              email: {type: string}
              display_name:
                type: string
                description: Account name from users.display_name; changes immediately when the account is renamed.
    HackEntry:
      type: object
      properties:
        title: {type: string, description: 'One line, 0-80 characters. Empty until set.'}
        tagline: {type: string, description: 'One line, 0-160 characters: the one-line solution.'}
        description: {type: string, description: 0-5000 characters.}
        video_url: {type: string, description: 'Empty, or an absolute http or https URL.'}
        code_url: {type: string, description: 'Empty, or an absolute http or https URL.'}
        has_screenshot: {type: boolean}
        updated_at: {type: string, format: date-time, nullable: true}
        updated_by: {type: string, description: 'Display name of the last editor, or empty.'}
        problem: {type: string, description: 'The problem it solves, 0-140 characters.'}
        audience: {type: string, description: 'Who it''s for, 0-100 characters.'}
        tools:
          type: array
          description: What was used. Up to 10 items, each 1-30 characters.
          items: {type: string}
        maturity:
          type: string
          enum: ['', working, partial, concept]
          description: How far along it is, or empty when unset.
        track:
          type: object
          nullable: true
          description: The team's chosen track, or null when none is chosen (or the event has no tracks).
          properties: {id: {type: string, format: uuid}, slug: {type: string}, name: {type: string}}
    HackEntryWrite:
      type: object
      description: Any subset. A field left out stays as it is.
      properties:
        updated_at:
          type: string
          description: 'Timestamp from the entry read, or empty for a new entry. Errors: 409 entry_changed.'
        title: {type: string, maxLength: 80, description: 'One line, 0-80 characters.'}
        tagline:
          type: string
          maxLength: 160
          description: 'One line, 0-160 characters: the one-line solution.'
        description: {type: string, maxLength: 5000, description: 0-5000 characters.}
        video_url:
          type: string
          maxLength: 500
          description: 'Empty, or an absolute http or https URL with a host, no spaces or control characters. Errors: 400 invalid_url.'
        code_url: {type: string, maxLength: 500, description: Same rules as video_url.}
        problem: {type: string, maxLength: 140, description: 'The problem it solves, 0-140 characters.'}
        audience: {type: string, maxLength: 100, description: 'Who it''s for, 0-100 characters.'}
        tools:
          type: array
          maxItems: 10
          items: {type: string, minLength: 1, maxLength: 30}
          description: What was used. At most 10 items, each 1-30 characters (400 invalid_tools).
        maturity:
          type: string
          enum: ['', working, partial, concept]
          description: 'How far along it is, or empty to clear. Errors: 400 invalid_maturity.'
        track:
          type: string
          description: 'Track slug to set the team''s chosen track, or empty to clear it. Errors: 400 invalid_track, 409 team_choice_closed.'
    HackEntryView:
      type: object
      properties:
        entry: {$ref: '#/components/schemas/HackEntry'}
        status:
          type: string
          enum: [draft, submitted, not_submitted]
          description: not_submitted is an incomplete draft the deadline sweep left unsubmitted.
        submitted_at: {type: string, format: date-time, nullable: true}
        submitted_by:
          type: string
          nullable: true
          description: Display name of whoever submitted it, or null.
        submit_auto:
          type: boolean
          description: True when the deadline sweep submitted a complete draft automatically rather than the team submitting it by hand.
        rules:
          type: object
          description: The event's entry rules, read-only here; the organiser changes them with PUT .../entry-rules.
          properties:
            preset:
              type: string
              enum: [video_or_website, video_website_code, build, code, ideas, custom]
            fields:
              type: object
              description: Every entry-rules field (HackEntryRuleField, minus one_of) mapped to required, optional, off or one_of.
              additionalProperties: {type: string, enum: [required, optional, false, one_of]}
            judge_first: {type: string, enum: [video, site], description: Which evidence judges see first.}
            summary:
              type: string
              description: One sentence naming what "show your work" needs, e.g. "a video or a published website".
        required:
          type: array
          deprecated: true
          description: 'Deprecated: use rules.fields. The fields entry_required lists under the legacy single-list model.'
          items: {$ref: '#/components/schemas/HackEntryField'}
        complete:
          type: boolean
          description: True when every rules-required field, and any one_of group, is filled.
        missing:
          type: array
          description: Required fields (and one_of, for an unmet show-your-work group) still missing.
          items: {$ref: '#/components/schemas/HackEntryRuleField'}
        site:
          type: object
          description: The team's published site, as counted by the rules engine's site field (never from the entry row).
          properties:
            exists: {type: boolean}
            live_version: {type: integer, nullable: true, description: Null when nothing is live.}
        editable: {type: boolean, description: False when refusal is set.}
        refusal:
          type: string
          nullable: true
          description: 'Null when the entry can be edited. Errors: event_taken_down, event_closed, team_site_taken_down, submissions_closed.'
        deadline:
          type: string
          format: date-time
          nullable: true
          description: This team's effective deadline.
        deadline_is_extension:
          type: boolean
          description: True when deadline is a team-specific extension rather than the event's own deadline.
        progress:
          type: object
          description: The Home screen's four-step checklist (team, summary, evidence, submit), computed identically here and on the website.
          properties:
            steps:
              type: array
              description: team, summary, evidence, submit, each {id, done, ...step-specific fields}.
              items: {type: object, additionalProperties: true}
            next: {type: string, description: 'The next step id to do, or empty when every step is done.'}
            deadline: {type: string, format: date-time, nullable: true}
            deadline_is_extension: {type: boolean}
            event_deadline:
              type: string
              format: date-time
              nullable: true
              description: The event's own deadline, ignoring any team-specific extension.
            server_now:
              type: string
              format: date-time
              description: Server clock at read time, for countdown rendering.
    HackEntryListItem:
      type: object
      properties:
        team:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: 'The team''s row id (added for M3: used by the judge queue and scoring routes).'
            slug: {type: string}
            name: {type: string}
        title: {type: string, description: Empty when the team has no entry.}
        tagline: {type: string}
        description: {type: string}
        video_url: {type: string}
        code_url: {type: string}
        has_screenshot: {type: boolean}
        problem: {type: string}
        audience: {type: string}
        tools: {type: array, items: {type: string}}
        maturity: {type: string, enum: ['', working, partial, concept]}
        track:
          type: object
          nullable: true
          properties: {slug: {type: string}, name: {type: string}}
        status: {type: string, enum: [draft, submitted, not_submitted]}
        submitted_at: {type: string, format: date-time, nullable: true}
        submit_auto: {type: boolean}
        incomplete:
          type: boolean
          description: 'True exactly when status is not_submitted: an incomplete entry judged as-is at the deadline.'
        excluded:
          type: boolean
          description: Hand-excluded from judging by the organiser (POST .../entry/exclude).
        excluded_at: {type: string, format: date-time, nullable: true}
        complete: {type: boolean}
        missing: {type: array, items: {$ref: '#/components/schemas/HackEntryRuleField'}}
        video:
          type: object
          nullable: true
          description: Present only when video_url is set.
          properties:
            url: {type: string}
            host: {type: string, description: 'The URL''s host, for a plain link label.'}
            embed_url:
              type: string
              nullable: true
              description: 'A player URL the judge screen may frame, rebuilt by the server from the parsed video id: https://www.youtube-nocookie.com/embed/{id}.'
        site:
          type: object
          nullable: true
          description: The team's website as the judge screen shows it.
          properties:
            url: {type: string, description: The team site's own address.}
            host: {type: string, description: The host named above the preview.}
            preview_url:
              type: string
              nullable: true
              description: A preview of the pinned (submitted) version once the team is pinned, else of the live version.
            frameable:
              type: boolean
              description: 'True when the judge screen may frame preview_url: no passcode, no named viewers, not offline, not taken down, sites ready.'
            not_frameable_why:
              type: string
              nullable: true
              enum: [passcode, viewers, offline, taken_down, not_ready, null]
              description: Why frameable is false.
        updated_at: {type: string, format: date-time, nullable: true}
        site_url: {type: string, description: 'https://<team>.<event>.simple-hack.app/'}
        site_exists: {type: boolean}
        deadline:
          type: string
          format: date-time
          nullable: true
          description: This team's effective deadline.
        frozen: {type: boolean}
        pinned_version: {type: integer, nullable: true}
        pinned_url: {type: string, nullable: true, description: Preview link for the deadline version.}
    HackEntryList:
      type: object
      properties:
        required:
          type: array
          deprecated: true
          description: 'Deprecated: use entry-rules instead.'
          items: {$ref: '#/components/schemas/HackEntryField'}
        entries:
          type: array
          description: Every team, sorted by team name.
          items: {$ref: '#/components/schemas/HackEntryListItem'}
        counts:
          type: object
          properties:
            submitted: {type: integer}
            drafts: {type: integer}
            not_started: {type: integer}
            not_submitted: {type: integer, description: Incomplete drafts the deadline sweep left unsubmitted.}
            sites_live: {type: integer}
    HackEntryRulesView:
      type: object
      properties:
        preset:
          type: string
          enum: [video_or_website, video_website_code, build, code, ideas, custom]
          description: video_or_website and video_website_code are the two current presets.
        fields:
          type: object
          description: Every entry-rules field mapped to required, optional, off or one_of.
          additionalProperties: {type: string, enum: [required, optional, false, one_of]}
        judge_first: {type: string, enum: [video, site], description: Which evidence judges see first.}
        summary: {type: string, description: One sentence naming what "show your work" needs.}
        has_tracks:
          type: boolean
          description: Whether the event has any tracks; track is ignored when false, even if marked required.
        editable:
          type: boolean
          description: False from Closed onward — rules are fixed once entries close, so judging sees one definition of complete.
    HackEntryRulesWrite:
      type: object
      description: Any subset. A field left out stays as it is.
      properties:
        preset:
          type: string
          enum: [video_or_website, video_website_code]
          description: 'Expands to that preset''s own field table first; any fields below are then applied on top. Errors: 400 invalid_preset.'
        fields:
          type: object
          description: 'Field name to required, optional, off or one_of (one_of only on video_url, site, code_url, screenshot. Errors: 400 invalid_entry_field_mode.'
          additionalProperties: {type: string, enum: [required, optional, false, one_of]}
        judge_first:
          type: string
          enum: [video, site]
          description: 'Which evidence judges see first. Errors: 400 invalid_judge_first.'
        dry_run:
          type: boolean
          description: true previews impact and the resulting rules in the response, without saving anything.
    HackEntryRulesImpact:
      type: object
      description: The response to a dry_run save.
      properties:
        impact:
          type: object
          properties:
            submitted_missing:
              type: integer
              description: Already-submitted entries that would newly read as missing something.
            drafts_newly_blocked:
              type: integer
              description: Drafts complete today that would become incomplete under the proposed rules.
            teams:
              type: array
              description: The affected teams (submitted_missing plus drafts_newly_blocked).
              items:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string}
                  missing: {type: array, items: {$ref: '#/components/schemas/HackEntryRuleField'}}
        preview:
          type: object
          description: The rules as they would be saved.
          properties:
            preset:
              type: string
              enum: [video_or_website, video_website_code, build, code, ideas, custom]
            fields:
              type: object
              additionalProperties: {type: string, enum: [required, optional, false, one_of]}
            judge_first: {type: string, enum: [video, site]}
            summary: {type: string}
            has_tracks: {type: boolean}
    HackMyTeams:
      type: object
      properties:
        teams:
          type: array
          items:
            type: object
            properties:
              team_id: {type: string, format: uuid}
              team_name: {type: string}
              team_slug: {type: string}
              event_slug: {type: string}
              event_title: {type: string}
              site_url: {type: string, description: 'https://<team>.<event>.simple-hack.app/'}
  responses:
    HackScreenshot:
      description: The screenshot. Content-Type is the stored type (image/png, image/jpeg or image/webp).
      headers:
        X-Content-Type-Options: {description: Always nosniff., schema: {type: string}}
        Content-Security-Policy: {description: default-src 'none'; sandbox, schema: {type: string}}
        Cache-Control: {description: 'private, no-store', schema: {type: string}}
        Content-Disposition: {description: inline, schema: {type: string}}
      content:
        image/png: {schema: {type: string, format: binary}}
        image/jpeg: {schema: {type: string, format: binary}}
        image/webp: {schema: {type: string, format: binary}}
