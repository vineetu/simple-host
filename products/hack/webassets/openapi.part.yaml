- op: getAdminPaperMetrics
  set: /description
  value: 'Admin-only. Service-wide aggregates kept by host/papermetrics (method in docs/paper-metrics.md):
    server-side time per route class (histograms and percentiles), five-minute process and box samples,
    nightly counts, weekly anonymous per-site footprint rows, the per-route API counts, and Hack event
    snapshots, populated one-minute activity, mergeable class/status histograms, relative minute/phase
    offsets with baseline flags, decimal-string event keys, and run provenance on the Hack collector only.
    Hack people counts below five and related judge/application totals are NULL with suppression flags
    in event and daily sets. No event-key row contains absolute dates/timestamps; event snapshots omit
    creation/snapshot dates. Per-event rows require at least five teams unless include_small=1. Hack responses
    identify metric_def_version; Host export columns, metadata and values are unchanged. No personal identifiers,
    request paths or site names are exported; provenance hashes describe only binaries and non-secret
    config. Without set (or set=summary) every set comes back in one JSON object; with set and format=csv
    one set comes back as CSV. A signed-in non-admin gets 404.'
- op: getAdminPaperMetrics
  set: /parameters/3/description
  value: Admin-only small-event filter override; never disables people-count suppression.
- op: getAdminPaperMetrics
  set: /responses/200/content/application~1json/schema/properties/metric_def_version/description
  value: Hack-only metadata; 4 for new Hack definitions, 1 for legacy histogram sets. Absent from Host
    exports.
- op: getAdminPaperMetrics
  set: /responses/200/content/application~1json/schema/properties/bucket_scheme/description
  value: Present on Hack histogram exports; distinguishes legacy and scale-3 buckets. Absent from Host
    exports.
