- op: putSitesBySitenameActiveVersion
  set: /description
  value: 'Re-point the live site at an existing version number: an earlier one, or one stored with publish=false
    (which then counts as live). On simple-hack.app (EVENTS=hosted) only a team key (or a connector bound to a team)
    deploys, to its own team''s site only; errors 403 no_personal_sites, 403 team_site_only, 403 team_key_scope,
