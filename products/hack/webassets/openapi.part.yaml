overrides:
- op: GET /
  set: /description
  value: 'The selected Host or Hack landing. Accept text/markdown negotiates Markdown; HTML is the default. Both
    carry discovery Link headers and Vary: Accept.'
- op: GET /.well-known/mcp/server-card.json
  set: /description
  value: Public product identity, build version, icon, and local MCP endpoint. Available on Host and Hack.
- op: GET /.well-known/agent-card.json
  set: /description
  value: Public product identity, version, OAuth discovery, and generic tool overview. Hack lists event and selected-team
    tools with role rules, without account or event data.
- op: GET /auth.md
  set: /responses/200/description
  value: Instance-aware sign-in documentation. Hack describes browser sign-in, company OIDC when configured, connector
    OAuth, and selected-team publishing. Email-code steps are omitted when unavailable.
- op: getMe
  remove: /responses/200/content/application~1json/schema/properties/home_site
- op: deleteMe
  set: /description
  value: Permanently delete the signed-in account and its websites, stored resources and connected apps. This cannot
    be undone; offer the account export first.
- op: changeOwnPassword
  set: /description
  value: Available only when PASSWORD_SIGNIN=on, for an account that already has a password (404 for one that does
    not). current_password is verified against the same limiters as sign-in (passwordLoginLimiter, keyed by the
    normalized username, and passwordIPLimiter); a wrong current password counts against both and refunds neither,
    and answers 403 (not 401, which the dashboard and Hack account screens read as an expired key and sign the browser
    out). new_password must be 8-256 characters and differ from current_password. Only a real account API key may
    call this; a connector's OAuth access token, even one otherwise valid for the REST API, is refused. Does not
    revoke keys, sessions or connector tokens; every other sign-in stays valid.
- op: exportMe
  set: /description
  value: Download an owner-authorised archive of website files and stored data. It may include historical private
    data from before the previous storage model was retired. Keep the archive and any download link private.
- op: exportMeLegacy
  set: /description
  value: Download an owner-authorised archive of website files and stored data. It may include historical private
    data from before the previous storage model was retired. Keep the archive and any download link private.
- op: getMeDeletedSites
  set: /description
  value: List websites recently deleted by this account, including their restoration deadline.
- op: postMeKey
  set: /description
  value: Create an account key for a trusted CI client or another machine. A deploy-only key can publish the account's
    permitted websites but cannot manage account settings or website storage. The key is returned once; keep it
    outside chat.
- op: getSites
  set: /description
  value: Returns the authenticated account's own sites, newest edited first (updated_at desc, then created_at desc).
    all=1 widens an admin's list to every account's sites; refused (403) for a non-admin. On simple-hack.app (EVENTS=hosted)
    only a team key (or a connector bound to a team) deploys, to its own team's site only; errors 403 no_personal_sites,
    403 team_site_only, 403 team_key_scope, 401 team_key_inactive, 409 team_sites_not_ready, 409 submissions_closed,
    403 team_site_taken_down.
- op: postSitesBySitenameFiles
  set: /description
  value: 'The LLM-friendly deploy path — send every file inline in one request, no archiving. Text goes in `files`;
    base64-encoded binary goes in `files_base64`. `index.html` is required. Relative paths only (`..`/absolute are
    rejected); secret files (`.env`, `.git/*`, `id_rsa`) are dropped and script extensions (`.sh .py .php …`) are
    rejected. Use PUT to update an existing site (409 site_exists says so); PUT with ?create=1 creates or updates
    in one call. On simple-hack.app (EVENTS=hosted) only a team key (or a connector bound to a team) deploys, to
    its own team''s site only; errors 403 no_personal_sites, 403 team_site_only, 403 team_key_scope, 401 team_key_inactive,
    409 team_sites_not_ready, 409 submissions_closed, 403 team_site_taken_down. Choose `access: specific` at creation
    for only the owner and named viewers from the first request; omitted or `anyone` keeps the default (anyone with
    the address). Optional `viewers` emails require `specific`, are normalized and deduplicated, and respect SITE_VIEWERS_MAX.
    Named viewers require sign-in and the site''s own address and are unavailable on Simple Hack. JSON body fields:
    `access` and `viewers`.'
- op: putSitesBySitenameFiles
  set: /description
  value: 'Same as POST, but for an existing site you own. Creates a new version and activates it; with ?publish=false
    the version is only stored (visitors keep seeing the live one) and the answer adds unpublished_version, preview_url
    and preview_expires_at. With ?create=1 a missing site is created instead (201, with the same checks as POST),
    so CI deploys in one call; without it a missing site is 404. With ?keep=1, send only changed files: other files
    in the live version are retained byte-for-byte, and remove_files drops listed relative paths. remove_files requires
    keep=1; index.html is not required in a patch. The merged version meets the ordinary file and storage caps.
    On simple-hack.app (EVENTS=hosted) only a team key (or a connector bound to a team) deploys, to its own team''s
    site only; errors 403 no_personal_sites, 403 team_site_only, 403 team_key_scope, 401 team_key_inactive, 409
    team_sites_not_ready, 409 submissions_closed, 403 team_site_taken_down. Choose `access: specific` at creation
    for only the owner and named viewers from the first request; omitted or `anyone` keeps the default (anyone with
    the address). Optional `viewers` emails require `specific`, are normalized and deduplicated, and respect SITE_VIEWERS_MAX.
    Named viewers require sign-in and the site''s own address and are unavailable on Simple Hack. With create=1,
    access/viewers apply when creating. On an existing site, specific refuses 409 access_differs unless it is already
    specific; viewers are not added. anyone never changes an existing site''s access. Without create=1, access/viewers
    are 400 invalid_request; later use set_site_access / grant_site_viewer. JSON body fields: `access` and `viewers`.'
- op: putUploadLink
  set: /description
  value: Use the private link returned by create_upload_link with archive true from a shell (the default on Simple
    Hack). Works once for one site for 15 minutes, including failed uploads. Sign-in is checked again at upload.
    Links stop working when the person signs out, disconnects the app or their sign-in expires. Creates the site
    if missing, else publishes a new version, public at its address on success. Never share the link or put it in
    a web page. Usual deploy and scope checks apply.
- op: postUploadLink
  set: /description
  value: Use the private link returned by create_upload_link with archive true from a shell (the default on Simple
    Hack). Works once for one site for 15 minutes, including failed uploads. Sign-in is checked again at upload.
    Links stop working when the person signs out, disconnects the app or their sign-in expires. Creates the site
    if missing, else publishes a new version, public at its address on success. Never share the link or put it in
    a web page. Usual deploy and scope checks apply.
- op: patchSitesBySitename
  set: /description
  value: Change the website's offline status or name. While offline, visitor storage reads and writes are refused;
    versions and stored resources remain available to the owner.
- op: postSitesBySitename
  set: /description
  value: 'Upload a `.tar.gz` or `.zip` (for framework builds, binary assets, large sites). Max 100 MB. On simple-hack.app
    (EVENTS=hosted) only a team key (or a connector bound to a team) deploys, to its own team''s site only; errors
    403 no_personal_sites, 403 team_site_only, 403 team_key_scope, 401 team_key_inactive, 409 team_sites_not_ready,
    409 submissions_closed, 403 team_site_taken_down. Choose `access: specific` at creation for only the owner and
    named viewers from the first request; omitted or `anyone` keeps the default (anyone with the address). Optional
    `viewers` emails require `specific`, are normalized and deduplicated, and respect SITE_VIEWERS_MAX. Named viewers
    require sign-in and the site''s own address and are unavailable on Simple Hack. Archive options use query parameters
    `access` and `viewers` (comma-separated or repeated).'
- op: putSitesBySitename
  set: /description
  value: 'Upload a new version of an existing site you own. Creates a new version and activates it; with ?publish=false
    the version is only stored (visitors keep seeing the live one) and the answer adds unpublished_version, preview_url
    and preview_expires_at. With ?create=1 a missing site is created instead (201, with the same checks as POST):
    one call from CI, e.g. `curl -X PUT ".../v1/sites/<name>?create=1" -H "X-API-Key: $KEY" --data-binary @site.tar.gz`.
    On simple-hack.app (EVENTS=hosted) only a team key (or a connector bound to a team) deploys, to its own team''s
    site only; errors 403 no_personal_sites, 403 team_site_only, 403 team_key_scope, 401 team_key_inactive, 409
    team_sites_not_ready, 409 submissions_closed, 403 team_site_taken_down. Choose `access: specific` at creation
    for only the owner and named viewers from the first request; omitted or `anyone` keeps the default (anyone with
    the address). Optional `viewers` emails require `specific`, are normalized and deduplicated, and respect SITE_VIEWERS_MAX.
    Named viewers require sign-in and the site''s own address and are unavailable on Simple Hack. With create=1,
    access/viewers apply when creating. On an existing site, specific refuses 409 access_differs unless it is already
    specific; viewers are not added. anyone never changes an existing site''s access. Without create=1, access/viewers
    are 400 invalid_request; later use set_site_access / grant_site_viewer. Archive options use query parameters
    `access` and `viewers` (comma-separated or repeated).'
- op: deleteSitesBySitename
  set: /description
  value: Take the website offline and move it to Recently deleted, retaining its versions and stored resources until
    the restoration deadline.
- op: restoreSite
  set: /description
  value: Restore a website from Recently deleted with its versions, stored resources and connected address.
- op: exportSite
  set: /description
