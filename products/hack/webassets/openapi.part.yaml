        invalid_maturity). track sets the team's chosen track by slug, or clears it with an empty string (400 invalid_track
        for an unlisted slug; 409 team_choice_closed once team choices are closed). Saving a draft never checks
        or changes completeness; use POST .../entry/submit to submit. A save on an already-submitted entry that
        would make it incomplete is refused with 422 entry_would_be_incomplete (includes missing), changing nothing.
        Refused inside the write when the team may no longer change its entry.
