openapi: 3.0.3
info:
  title: Simple Host API
  description: 'Static website hosting with a light per-site backend. Every /v1/sites route, GET /v1/me/deleted-sites and GET /v1/analytics/sites take ?owner=<handle> to act, with your own key or sign-in, on the sites of a team you belong to or the one site of an account you edit (403 editor_scope outside that site''s deploys, versions, saved data, visits and your own notifications).'
  version: 2.0.0
servers:
- {url: 'https://simple-host.app', description: 'Production API (agents, with an API key).'}
tags:
- {name: Discovery, description: 'Public product, connector, and API discovery.'}
- name: Auth
  description: 'Account sign-in by emailed code or Google, for Simple Host account owners and the agents working for them. Errors: 403 account_auth_unavailable.'
- {name: Account, description: 'Account profile, credentials and connected apps.'}
- {name: Sites, description: 'List, inspect and manage websites.'}
- {name: Teams, description: 'Accounts that own sites and that people join by an invitation to their email; members act with ?owner=<team>.'}
- {name: Deploy, description: Publish inline JSON files or a tar.gz/zip archive.}
- {name: Versions, description: 'Inspect retained deployments, preview and roll back.'}
- {name: Analytics, description: Owner-scoped website traffic.}
- {name: Custom domains, description: Claim a free address or connect a custom domain.}
- {name: Address families, description: Connect a wildcard address family for your sites.}
- name: Storage resources
  description: Owner-declared KV, SQLite and durable file resources.
- name: Notifications
  description: Signed HTTPS notifications for visitor storage writes on Simple Host.
- name: Visitor sign-in
  description: Site-scoped browser sessions for website visitors (customers, guests, members), on the site's own address.
- {name: Skills, description: Discover and fetch this server’s agent skills and references.}
- {name: Showcase, description: Public feed of a person’s showcased sites.}
- {name: Health, description: Service health and readiness.}
- {name: Admin, description: Internal operator API.}
paths:
  /:
    get:
      tags: [Discovery]
      x-audience: [public-host]
      summary: Read the product landing page
      description: The selected product landing. Accept text/markdown negotiates Markdown; HTML is the default.
      security: []
      responses:
        '200':
          description: Read the product landing page
          content:
            text/html: {schema: {type: string}}
            text/markdown: {schema: {type: string}}
  /index.md:
    get:
      tags: [Discovery]
      x-audience: [public-host]
      summary: Read the landing as Markdown
      description: The selected product landing copy, with this instance's canonical address.
      security: []
      responses:
        '200':
          description: Read the landing as Markdown
          content:
            text/markdown: {schema: {type: string}}
  /llms.md:
    get:
      tags: [Discovery]
      x-audience: [public-host]
      summary: Read the landing as Markdown
      description: Alias of /index.md.
      security: []
      responses:
        '200':
          description: Read the landing as Markdown
          content:
            text/markdown: {schema: {type: string}}
  /.well-known/mcp/server-card.json:
    get:
      tags: [Discovery]
      x-audience: [public-host]
      summary: Read the MCP server card
      description: Public product identity, build version, icon, and local MCP endpoint.
      security: []
      responses:
        '200':
          description: Read the MCP server card
          content:
            application/json: {schema: {type: object}}
  /mcp/server-card:
    get:
      tags: [Discovery]
      x-audience: [public-host]
      summary: Read the MCP server card
      description: Alias of /.well-known/mcp/server-card.json.
      security: []
      responses:
        '200':
          description: Read the MCP server card
          content:
            application/json: {schema: {type: object}}
  /.well-known/agent-card.json:
    get:
      tags: [Discovery]
      x-audience: [public-host]
      summary: Read the agent capability card
      description: Public product identity, version, OAuth discovery, and generic tool overview.
      security: []
      responses:
        '200':
          description: Read the agent capability card
          content:
            application/json: {schema: {type: object}}
  /.well-known/ai-catalog.json:
    get:
      tags: [Discovery]
      x-audience: [public-host]
      summary: Read the AI catalog
      description: Links the agent card, MCP server card, and OpenAPI document.
      security: []
      responses:
        '200':
          description: Read the AI catalog
          content:
            application/json: {schema: {type: object}}
  /.well-known/ard.json:
    get:
      tags: [Discovery]
      x-audience: [public-host]
      summary: Read the agent resource directory
      description: Product-specific resource names and identifiers with links to the server card, skills, and REST API.
      security: []
      responses:
        '200':
          description: Read the agent resource directory
          content:
            application/json: {schema: {type: object}}
  /.well-known/api-catalog:
    get:
      tags: [Discovery]
      x-audience: [public-host]
      summary: Read the API catalog
      description: RFC 9727 linkset for this product's OpenAPI formats, role or deployment guide, and API reference.
      security: []
      responses:
        '200':
          description: Read the API catalog
          content:
            application/linkset+json: {schema: {type: object}}
  /auth.md:
    get:
      tags: [Auth]
      x-audience: [public-host]
      summary: Read the authentication reference
      security: []
      responses:
        '200':
          description: Instance-aware sign-in documentation.
          content:
            text/markdown: {schema: {type: string}}
  /v1/skills:
    get:
      x-audience: [public-host]
      tags: [Skills]
      operationId: listSkills
      summary: Skills hub catalog — discover the bundled agent skills
      description: Public catalog of the skills this server bundles (name + description + fetch URL), so any agent can search them over HTTP.
      responses:
        '200':
          description: Skill catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugin: {type: string}
                  version: {type: string}
                  count: {type: integer}
                  skills:
                    type: array
                    items:
                      type: object
                      properties: {name: {type: string}, description: {type: string}, url: {type: string}}
  /v1/skills/{name}:
    get:
      x-audience: [public-host]
      tags: [Skills]
      operationId: getSkill
      summary: Fetch one skill's SKILL.md (markdown)
      description: Returns the raw SKILL.md for the named skill.
      parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The skill's SKILL.md
          content:
            text/markdown: {schema: {type: string}}
        '404':
          description: No such skill
          content:
            text/plain: {schema: {type: string}}
  /v1/skills/{name}/SKILL.md:
    get:
      x-audience: [public-host]
      tags: [Skills]
      operationId: getSkillMarkdown
      summary: Fetch one skill's SKILL.md (markdown), same as /v1/skills/{name}
      description: Same response as /v1/skills/{name}.
      parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The skill's SKILL.md
          content:
            text/markdown: {schema: {type: string}}
        '404':
          description: No such skill
          content:
            text/plain: {schema: {type: string}}
  /v1/skills/{name}/references/{file}:
    get:
      x-audience: [public-host]
      tags: [Skills]
      operationId: getSkillReference
      summary: Fetch one of a skill's reference documents (markdown)
      description: A skill's SKILL.md routes to reference documents under its references/ directory.
      parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
      - name: file
        in: path
        required: true
        description: The reference filename, e.g. backend.md
        schema: {type: string}
      responses:
        '200':
          description: The reference document
          content:
            text/markdown: {schema: {type: string}}
        '400':
          description: Invalid skill or reference name
          content:
            text/plain: {schema: {type: string}}
        '404':
          description: No such reference
          content:
            text/plain: {schema: {type: string}}
  /v1/auth:
    post:
      x-audience: [public-host]
      tags: [Auth]
      operationId: postAuth
      summary: Request an account sign-in code (account owners only)
      description: For Simple Host account owners and their agents, never for a site's visitors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
                nonce_hash:
                  type: string
                  description: Browser pages only. base64url SHA-256 of a random nonce the page keeps.
      responses:
        '403':
          description: 'account_auth_unavailable: account sign-in answers only on the app''s own address; a page''s visitors use visitor sign-in (auth.js SH.mount). Errors: email_signin_off.'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorResponse'}
                - type: object
                  properties:
                    code: {type: string, enum: [account_auth_unavailable, email_signin_off]}
        '202':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties: {message: {type: string}, email: {type: string}, expires_in_seconds: {type: integer}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /v1/auth/password:
    post:
      x-audience: [public-host]
      tags: [Auth]
      operationId: passwordSignIn
      summary: Sign in with a username or email and password
      description: Available only when PASSWORD_SIGNIN=on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login: {type: string}
                password: {type: string, format: password, minLength: 8, maxLength: 256}
                new_password: {type: string, format: password, minLength: 8, maxLength: 256}
                name: {type: string}
                sso_state: {type: string}
              required: [login, password]
      responses:
        '200':
          description: Authenticated
          content:
            application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: Wrong username or password (bad_credentials), including unknown and passwordless accounts.
        '403':
          description: 'password_change_required: current password verified; resubmit with a different new_password. Errors: account_suspended.'
        '404': {description: 'not found: PASSWORD_SIGNIN is off.'}
      security: []
  /v1/auth/password/signup:
    post:
      x-audience: [public-host]
      tags: [Auth]
      operationId: passwordSignup
      summary: Create a password account and sign in
      description: Available only when PASSWORD_SIGNIN=on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {type: string, minLength: 1, maxLength: 254}
                password: {type: string, format: password, minLength: 8, maxLength: 256}
              required: [username, password]
      responses:
        '200':
          description: Authenticated
          content:
            application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}
        '400': {description: invalid_username or invalid_password}
        '403': {description: signup_unavailable_region}
        '404': {description: 'not found: PASSWORD_SIGNIN off or PASSWORD_SELF_SIGNUP off'}
        '409': {description: username_taken}
        '429': {description: rate_limited; Retry-After header}
      security: []
  /v1/admin/password-users:
    post:
      x-audience: [internal]
      tags: [Admin]
      operationId: createPasswordUser
      summary: Create an account with a temporary password
      description: Available only when PASSWORD_SIGNIN=on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {type: string}
                password: {type: string, format: password, minLength: 8, maxLength: 256}
              required: [username]
      responses:
        '200':
          description: Temporary password shown once; must be changed before sign-in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  username: {type: string}
                  handle: {type: string}
                  temporary_password: {type: string}
                  message: {type: string}
                required: [id, username, handle, temporary_password, message]
        '400': {description: Invalid username/password or admin account reset}
        '401': {description: Unauthorized}
        '404': {description: 'not found: disabled, non-admin caller or missing account'}
        '409': {description: username_taken}
      security:
      - {apiKey: []}
  /v1/admin/users/{id}/password:
    post:
      x-audience: [internal]
      tags: [Admin]
      operationId: resetAccountPassword
      summary: Set a temporary password for a non-admin account
      description: Available only when PASSWORD_SIGNIN=on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string, format: password, minLength: 8, maxLength: 256}
              required: []
      responses:
        '200':
          description: Temporary password shown once; must be changed before sign-in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  username: {type: string}
                  handle: {type: string}
                  temporary_password: {type: string}
                  message: {type: string}
                required: [id, username, handle, temporary_password, message]
        '400': {description: Invalid username/password or admin account reset}
        '401': {description: Unauthorized}
        '404': {description: 'not found: disabled, non-admin caller or missing account'}
        '409': {description: username_taken}
      security:
      - {apiKey: []}
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  /v1/auth/verify:
    post:
      x-audience: [public-host]
      tags: [Auth]
      operationId: postAuthVerify
      summary: Verify a code on the apex and get an account key
      description: Exchange an emailed code or a sign-in link for an API key, on the app's own address only. The code expires in 15 minutes and allows 3 attempts.
      parameters:
      - name: from
        in: query
        schema: {type: string, maxLength: 40}
        description: Optional same-visit attribution label (letters, digits, hyphens).
      - name: utm_source
        in: query
        schema: {type: string}
        description: Optional same-visit attribution; UTM values are bounded plain text, referrer is an outside hostname only.
      - name: utm_medium
        in: query
        schema: {type: string}
        description: Optional same-visit attribution; UTM values are bounded plain text, referrer is an outside hostname only.
      - name: utm_campaign
        in: query
        schema: {type: string}
        description: Optional same-visit attribution; UTM values are bounded plain text, referrer is an outside hostname only.
      - name: utm_term
        in: query
        schema: {type: string}
        description: Optional same-visit attribution; UTM values are bounded plain text, referrer is an outside hostname only.
      - name: utm_content
        in: query
        schema: {type: string}
        description: Optional same-visit attribution; UTM values are bounded plain text, referrer is an outside hostname only.
      - name: referrer
        in: query
        schema: {type: string}
        description: Optional same-visit attribution; UTM values are bounded plain text, referrer is an outside hostname only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string, format: email}
                code: {type: string}
                sso_state:
                  type: string
                  description: Optional server-issued hop state for visitor signup attribution
                token: {type: string, description: magic-link token (alternative to email+code)}
                nonce:
                  type: string
                  description: required with token — the nonce whose hash was sent when the link was requested
                name:
                  type: string
                  maxLength: 60
                  description: Optional label for the key this sign-in issues, shown in the Keys list (GET /v1/me/keys).
                choose_handle:
                  type: boolean
                  description: 'When this sign-in would create a new account: create nothing yet and answer 409 with code choose_handle and a suggested_handle.'
                handle:
                  type: string
                  pattern: ^[a-z0-9-]{1,39}$
                  description: 'The address (<handle>.simple-host.app) a NEW account takes; ignored for an existing account. Errors: 400 invalid_handle, 409 handle_reserved, 409 handle_taken, choose_handle.'
      responses:
        '403':
          description: 'account_auth_unavailable: account sign-in answers only on the app''s own address; a page''s visitors use visitor sign-in (auth.js SH.mount). Errors: email_signin_off.'
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/ErrorResponse'}
                - type: object
                  properties:
                    code: {type: string, enum: [account_auth_unavailable, email_signin_off]}
        '200':
          description: Authenticated
          content:
            application/json: {schema: {$ref: '#/components/schemas/AuthResponse'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409':
          description: 'code choose_handle (a new account: choose its address first. Errors: handle_taken, handle_reserved, password_account_exists.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                  code:
                    type: string
                    enum: [choose_handle, handle_taken, handle_reserved, password_account_exists]
                  suggested_handle: {type: string}
                  address: {type: string}
        '401':
          description: Invalid code. `code` stays invalid_code. `reason` is code_wrong, code_used_up, code_expired, or link_other_browser.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
  /v1/handles/check:
    get:
      x-audience: [public-host]
      tags: [Auth]
      operationId: getHandleCheck
      summary: Is this address (handle) free?
      description: 'Whether <handle>.simple-host.app can be taken as an account''s address: at sign-up (POST /v1/auth/verify with handle) or as a change.'
      parameters:
      - {name: handle, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: The verdict
          content:
            application/json:
              schema:
                type: object
                required: [handle, available, address]
                properties:
                  handle: {type: string}
                  available: {type: boolean}
                  address: {type: string}
                  code: {type: string, enum: [invalid_handle, handle_reserved, handle_taken]}
                  error: {type: string}
        '403':
          description: Cross-site browser request
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '429':
          description: Too many checks from this address
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
  /v1/auth/oauth/providers:
    get:
      x-audience: [public-host]
      tags: [Auth]
      operationId: getOAuthProviders
      summary: List enabled sign-in methods (public discovery)
      description: 'Public discovery for pages and the dashboard: auth.js reads it from a site to offer Google; it is not account sign-in and sets nothing.'
      responses:
        '200':
          description: Enabled providers
          content:
            application/json:
              schema:
                type: object
                required: [providers, email_enabled]
                properties:
                  password:
                    type: object
                    description: Present only when password sign-in is enabled on this install.
                    properties: {enabled: {type: boolean}, self_signup: {type: boolean}}
                  sso_enabled: {type: boolean, description: Whether site Sign in should use the apex SSO hop}
                  email_enabled:
                    type: boolean
                    description: Whether email-code sign-in is configured and EMAIL_SIGNIN is not off
                  providers:
                    type: array
                    items: {type: string, enum: [google, github, oidc]}
                  oidc_label: {type: string, description: The company sign-in button's name (OIDC_LABEL).}
  /v1/auth/oauth/{provider}:
    get:
      x-audience: [public-host]
      tags: [Auth]
      operationId: startOAuth
      summary: Start account Google sign-in (account owners; a site sign-in is forwarded)
      description: Account sign-in starts only on the app's own address.
      parameters:
      - name: provider
        in: path
        required: true
        schema: {type: string, enum: [google, github, oidc]}
      - name: return_to
        in: query
        required: true
        schema: {type: string, format: uri}
        description: Absolute URL of the page to return to after sign-in
      responses:
        '403':
          description: 'account_auth_unavailable: on the app''s address but from a page''s origin.'
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '302':
          description: Redirect to the identity provider
          headers:
            Location: {schema: {type: string, format: uri}}
        '400':
          description: Invalid or missing return_to
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '404':
          description: Unknown or disabled provider
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503':
          description: 'oidc_unavailable: company sign-in''s identity provider could not be reached yet (lazy discovery); retry shortly.'
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
  /v1/auth/oauth/{provider}/callback:
    get:
      x-audience: [public-host]
      tags: [Auth]
      operationId: oauthCallback
      summary: OAuth callback (apex only)
      description: Answers only on the app's own address (403 account_auth_unavailable elsewhere).
      parameters:
      - name: provider
        in: path
        required: true
        schema: {type: string, enum: [google, github, oidc]}
      - {name: code, in: query, schema: {type: string}}
      - {name: state, in: query, schema: {type: string}}
      - {name: error, in: query, schema: {type: string}}
      responses:
        '403':
          description: 'account_auth_unavailable (JSON): not on the app''s own address.'
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
            text/html: {schema: {type: string}}
        '302':
          description: 'Site purpose: redirect to /v1/visitor/establish on the stored host.'
          headers:
            Location: {schema: {type: string, format: uri}}
        '400':
          description: Bad, replayed, or expired state, or provider error
          content:
            text/html: {schema: {type: string}}
        '404':
          description: Unknown or disabled provider
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '502':
          description: Token or userinfo failure
          content:
            text/html: {schema: {type: string}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /v1/visitor/oauth/{provider}:
    get:
      x-audience: [public-host]
      tags: [Visitor sign-in]
      operationId: startVisitorOAuth
      summary: Start visitor sign-in on the site's own host
      description: Visitor sign-in start, served on the site's own address (its `<site>.<handle>` host, person address, claimed name or bound domain).
      parameters:
      - name: provider
        in: path
        required: true
        schema: {type: string, enum: [google, github, oidc]}
      - name: return_to
        in: query
        required: true
        schema: {type: string, format: uri}
        description: Absolute URL of a page on this host to return to after sign-in
      responses:
        '302':
          description: Nonce cookie set; redirect to the identity provider
          headers:
            Location: {schema: {type: string, format: uri}}
            Set-Cookie: {schema: {type: string}}
        '400':
          description: Missing return_to, or one that is not a page of the site on this host
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '404':
          description: Unknown or disabled provider
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /v1/visitor/establish:
    get:
      x-audience: [public-host]
      tags: [Visitor sign-in]
      operationId: establishVisitor
      summary: Establish the visitor session cookie
      description: One-time hop on the site's own address (its `<site>.<handle>` host or domain).
      parameters:
      - {name: once, in: query, required: true, schema: {type: string}}
      responses:
        '302':
          description: Cookie set; redirect to the stored return_to
          headers:
            Location: {schema: {type: string, format: uri}}
            Set-Cookie: {schema: {type: string}}
        '400':
          description: Bad, replayed, expired, host-mismatch, missing or wrong nonce cookie, or apex Host
          content:
            text/html: {schema: {type: string}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /v1/sso/consents/{site}:
    delete:
      x-audience: [public-host]
      tags: [Visitor sign-in]
      operationId: forgetSSOConsent
      summary: Forget this person's consent for a site
      description: Same-origin account-key request.
      security:
      - {apiKey: []}
      parameters:
      - {name: site, in: path, required: true, schema: {type: string}, description: Site UUID}
      responses:
        '204': {description: Consent forgotten or already absent}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Wrong origin or not a full account key}
  /v1/sso/start:
    get:
      x-audience: [public-host]
      tags: [Visitor sign-in]
      operationId: startSSO
      summary: Start a site sign-in hop on the site's own host
      description: Stores the validated return address and nonce hash server-side, sets the host-only nonce cookie, and redirects to the account apex.
      security: []
      parameters:
      - {name: return_to, in: query, required: true, schema: {type: string, format: uri}}
      responses:
        '302': {description: Nonce cookie set; navigate to the apex hop}
        '400': {description: Invalid site return address or navigation}
        '403': {description: 'Site locked, offline, suspended, or non-navigation request'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /v1/sso/hop:
    get:
      x-audience: [public-host]
      tags: [Visitor sign-in]
      operationId: hopSSO
      summary: Continue site sign-in on the account apex
      description: Uses only the apex SSO cookie.
      security: []
      parameters:
      - {name: state, in: query, required: true, schema: {type: string}}
      - name: token
        in: query
        required: false
        description: Browser-bound owner provider token
        schema: {type: string}
      - name: cn
        in: query
        required: false
        description: Provider browser nonce hash
        schema: {type: string}
      responses:
        '200': {description: Apex sign-in or consent card}
        '302': {description: Navigate to the site's establish endpoint}
        '400': {description: 'Missing, used, or expired state'}
        '403': {description: Wrong origin or non-document request}
        '429': {description: IP rate limit exceeded}
  /v1/sso/consent:
    post:
      x-audience: [public-host]
      tags: [Visitor sign-in]
      operationId: consentSSO
      summary: Remember consent and continue to a site
      description: Same-origin form POST with Sec-Fetch-Site validation and a one-use form token bound to the current SSO pass and server-stored hop.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [state, form_token]
              properties: {state: {type: string}, form_token: {type: string}}
      responses:
        '302': {description: Consent remembered; navigate to the site's establish endpoint}
        '400': {description: Invalid or expired hop}
        '401': {description: Sign in on the apex first}
        '403': {description: Invalid form token or origin}
        '429': {description: IP rate limit exceeded}
  /v1/sso/session:
    post:
      x-audience: [public-host]
      tags: [Visitor sign-in]
      operationId: bootstrapSSO
      summary: Add the apex sign-in cookie to an existing dashboard session
      description: Same-origin apex POST authenticated by a live stored full account key.
      security:
      - {apiKey: []}
      responses:
        '204': {description: Apex SSO cookie ready}
        '401': {description: 'Missing, expired, suspended, or unsuitable account key'}
        '403': {description: Wrong host or origin}
        '429': {description: Pass issuance rate limit exceeded}
  /v1/sso/signed-out:
    get:
      x-audience: [public-host]
      tags: [Visitor sign-in]
      operationId: signedOutSSO
      summary: Complete browser sign-out at the apex and return to the site
      description: Rate-limited top-level navigation after site sign-out.
      security: []
      parameters:
      - {name: token, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Confirmation form or final dashboard-key sign-out page}
        '400': {description: 'Invalid, expired, or already used ticket'}
        '403': {description: Wrong host or non-document request}
        '429': {description: IP rate limit exceeded}
    post:
      x-audience: [public-host]
      tags: [Visitor sign-in]
      operationId: confirmSignedOutSSO
      summary: Confirm sign-out on this browser
      description: Same-origin apex form POST with Origin and Fetch Metadata checks, a one-use form token bound to the cookie that opened the confirmation.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, form_token]
              properties: {token: {type: string}, form_token: {type: string}}
      responses:
        '200': {description: Final apex page revokes the stored dashboard key and returns to the site}
        '400': {description: 'Invalid, expired, replayed, or mismatched ticket or form token'}
        '403': {description: Wrong host or origin}
        '429': {description: IP rate limit exceeded}
  /v1/visitor/logout:
    post:
      x-audience: [public-host]
      tags: [Visitor sign-in]
      operationId: logoutVisitor
      summary: Sign out this browser across linked sites
      description: For a hop session, deletes its parent dashboard key, apex pass, and all linked site sessions.
      parameters:
      - name: X-SH-CSRF
        in: header
        required: false
        schema: {type: string, enum: ['1']}
      responses:
        '200':
          description: Navigate the top-level window to redirect_url to clear the apex cookie
          content:
            application/json:
              schema:
                type: object
                required: [redirect_url]
                properties: {redirect_url: {type: string, format: uri}}
        '204': {description: Session deleted and cookie cleared}
        '403':
          description: Missing CSRF header (and not a JSON request) (code csrf_required)
          content:
            application/json:
              schema:
                type: object
                properties: {error: {type: string}, code: {type: string}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /v1/me:
    patch:
      x-audience: [public-host]
      tags: [Account]
      operationId: patchMe
      summary: Edit display name or change your handle
      description: Change the display name or handle; once something is published the handle can change once every 30 days, and old addresses redirect.
      security:
      - {apiKey: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                display_name: {type: string, maxLength: 100, description: Trimmed; empty clears the name.}
                handle:
                  type: string
                  pattern: ^[a-z0-9-]{1,39}$
                  description: The <handle> in your address https://<handle>.simple-host.app/.
                signin_alerts:
                  type: boolean
                  description: 'Sign-in alert emails (default true): one email after each sign-in or app connection, at most one per browser or app a day. Errors: 400 not_an_account_key.'
      responses:
        '200': {description: Updated account profile}
        '400':
          description: Invalid profile, or signin_alerts sent without an account key (code not_an_account_key)
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '401':
          description: API key required
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '409':
          description: 'The handle cannot be had: code handle_taken (another account''s handle or old handle, or a site''s claimed free name. Errors: handle_reserved, 400 invalid_handle.'
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '429':
          description: The handle already changed within the last 30 days after publishing
          content:
            application/json:
              schema:
                type: object
                properties: {error: {type: string}, next_change_after: {type: string, format: date-time}}
    get:
      x-audience: [public-host]
      tags: [Account]
      operationId: getMe
      summary: Current user
      security:
      - {apiKey: []}
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  username: {type: string}
                  handle:
                    type: string
                    description: 'The <handle> in your addresses: sites at https://<site>.<handle>.simple-host.app/, your page at https://<handle>.simple-host.app/'
                  home_site: {type: string, nullable: true, description: Chosen home site name; null means showcase.}
                  public_page:
                    type: string
                    format: uri
                    description: The account's public page listing its public sites, e.g. https://<handle>.simple-host.app/.
                  display_name: {type: string}
                  is_admin: {type: boolean}
                  signin_alerts:
                    type: boolean
                    description: Whether an email follows each sign-in or app connection (PATCH /v1/me to change).
                  has_password: {type: boolean, description: Whether this account has a password set.}
                  login:
                    type: string
                    description: A password account's own login (account_passwords.login), present whenever has_password is true.
                  max_sites:
                    type: integer
                    description: 'Sites this account may hold (sites in Recently deleted count. Errors: 403 site_quota_reached.'
                  file_usage:
                    type: object
                    properties:
                      used_bytes: {type: integer}
                      limit_mb: {type: integer, description: 0 means no account file cap}
                      message: {type: string}
                      tips: {type: string}
                    description: Website files and kept versions including the live copy and Recently deleted sites; saved data and storage resources excluded
                  can_set_keep_versions: {type: boolean, description: Account is allowed to change per-site retention}
                  keep_versions: {type: integer, description: Account default retention; 0 means all}
                  max_site_mb:
                    type: integer
                    description: Largest site this account may deploy, in MB (an upload or its unpacked files over it is 413 site_too_large).
                  address: {$ref: '#/components/schemas/AddressState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    delete:
      x-audience: [public-host]
      tags: [Account]
      operationId: deleteMe
      summary: Delete your account and all its data
      description: Deletes the account at once and for good; nothing goes to Recently deleted and nothing can be restored.
      security:
      - {apiKey: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: {type: string, description: 'The account''s handle, or its email when it has no handle.'}
      responses:
        '204': {description: Deleted}
        '400':
          description: confirm missing (code confirm_required) or does not match (code confirm_mismatch)
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Suspended account (code account_suspended), a site of the account taken down (code site_suspended) or admin account (code admin_account)
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '409':
          description: The account still holds event hostnames (code event_hostnames)
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '429':
          description: Too many requests from this address
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
  /v1/me/password:
    post:
      x-audience: [public-host]
