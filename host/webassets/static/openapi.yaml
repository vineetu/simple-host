                  description: The push service endpoint from the browser's PushSubscription.
                keys:
                  type: object
                  properties: {p256dh: {type: string}, auth: {type: string}}
                resource:
                  type: string
                  description: Required for a visitor; optional for the owner (empty is site-wide).
                events:
                  type: array
                  items: {type: string}
                  description: Owner only; a visitor's device is always the record/file events regardless of this field.
