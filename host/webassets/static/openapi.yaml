  /v1/admin/usage:
    get:
      x-audience: [internal]
      tags: [Admin]
      operationId: getInstanceUsage
      summary: What this instance is using, and what is left (admin only)
      description: Measured from the filesystem, not projected.
      security:
      - {apiKey: []}
      parameters:
      - in: query
        name: sizes
        required: false
        schema: {type: string, enum: ['1']}
        description: Add site_sizes
      responses:
        '200':
          description: Current disk usage
          content:
            application/json:
              schema:
                type: object
                required:
                - disk_bytes
                - disk_free_bytes
                - disk_used_bytes
                - disk_used_pct
                - site_bytes
                - sites
                - status
                - message
                properties:
                  disk_bytes: {type: integer, description: Size of the filesystem holding site data}
                  disk_free_bytes: {type: integer}
                  disk_used_bytes:
                    type: integer
                    description: Everything on that filesystem, including Postgres, logs and the OS
                  disk_used_pct: {type: number}
                  site_bytes: {type: integer, description: 'Site files specifically, every retained version included'}
                  sites: {type: integer}
                  accounts: {type: integer, description: 'Participant accounts, or -1 if the count could not be read'}
                  site_limit_mb:
                    type: integer
                    description: Per-site cap in force (MAX_ARCHIVE_MB); accounts in MAX_ARCHIVE_MB_OVERRIDES have their own (max_site_mb in GET /v1/admin/users)
                  workers:
                    type: array
                    description: Background owner lifecycle and progress; pending is null for periodic scans.
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        enabled: {type: boolean}
                        running: {type: boolean}
                        last_attempt: {type: string, format: date-time, nullable: true}
                        last_progress: {type: string, format: date-time, nullable: true}
                        last_error: {type: string}
                        last_error_at: {type: string, format: date-time, nullable: true}
                        pending: {type: integer, format: int64, nullable: true}
                  site_limit_overrides:
                    type: object
                    nullable: true
                    additionalProperties: {type: integer}
                    description: MAX_ARCHIVE_MB_OVERRIDES as handle to MB; null when no account has its own
                  keep_versions:
                    type: integer
                    description: Deploys of each site kept (KEEP_VERSIONS in force); 0 keeps every one
                  version:
                    type: string
                    description: Release this server was built from, e.g. v0.3.0; "dev" for an unstamped build
                  commit: {type: string, description: 'Short commit hash of the build, or "unknown"'}
                  status: {type: string, enum: [ok, filling, full]}
                  message: {type: string, description: One sentence for an admin screen}
                  measured_at: {type: string, format: date-time, description: When the walk behind these figures ran.}
                  largest:
                    type: array
                    description: The ten biggest sites, largest first, so a full disk has a visible cause
                    items:
                      type: object
                      properties:
                        user_id: {type: string}
                        name: {type: string}
                        bytes:
                          type: integer
                          description: Everything the site holds on disk, every kept version plus the live copy
                        live_bytes:
                          type: integer
                          description: The live copy alone (what visitors are served, and what the per-site limit is about)
                  network:
                    type: object
                    description: Network use this calendar month (UTC).
                    properties:
                      allowance_gb:
                        type: integer
                        description: 'NETWORK_MONTHLY_ALLOWANCE_GB: free outbound data a month, in GB; 0 means none is set'
                      alert_pct:
                        type: integer
                        description: 'NETWORK_ALERT_PCT: the share of the allowance that counts as filling'
                      box:
                        type: object
                        nullable: true
                        description: The box's own bytes on its main interface, from the kernel counters sampled every NETWORK_SAMPLE_MINUTES plus the growth since the last…
                        properties:
                          interface: {type: string}
                          in_bytes: {type: integer}
                          out_bytes: {type: integer}
                          counting_since:
                            type: string
                            format: date-time
                            nullable: true
                            description: When counting began, if during this month (the month's figures start there)
                          sampled_at: {type: string, format: date-time, nullable: true}
                      served:
                        type: object
                        nullable: true
                        description: Bytes the web server sent for every request to a website address, from the analytics log (null without ANALYTICS_LOG).
                        properties:
                          today: {$ref: '#/components/schemas/TrafficFigure'}
                          last_7_days: {$ref: '#/components/schemas/TrafficFigure'}
                          last_30_days: {$ref: '#/components/schemas/TrafficFigure'}
                          month: {$ref: '#/components/schemas/TrafficFigure'}
                          month_pages: {$ref: '#/components/schemas/TrafficFigure'}
                          month_api: {$ref: '#/components/schemas/TrafficFigure'}
                          bytes_since:
                            type: string
                            format: date
                            nullable: true
                            description: The first day any bytes were logged; windows that start earlier count from then
                          top_sites:
                            type: array
                            description: The ten websites that took the most bytes this month
                            items:
                              type: object
                              properties:
                                site_id: {type: string}
                                user_id: {type: string}
                                name: {type: string}
                                owner: {type: string, description: The owner's handle}
                                bytes: {type: integer}
                                pages_bytes: {type: integer, description: The website's files}
                                api_bytes: {type: integer, description: Its /v1 calls}
                                requests: {type: integer}
                  site_sizes:
                    type: array
                    description: 'Only with ?sizes=1: every site on disk (every retained version included), in no order'
                    items:
                      type: object
                      properties:
                        user_id: {type: string}
                        name: {type: string}
                        bytes:
                          type: integer
                          description: Everything the site holds on disk, every kept version plus the live copy
                        live_bytes:
                          type: integer
                          description: The live copy alone (what visitors are served, and what the per-site limit is about)
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: Caller is not an admin
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '500':
          description: This server's disk could not be read
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
