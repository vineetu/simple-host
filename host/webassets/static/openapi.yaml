      description: Give the site a free <name>.simple-host.app (active at once) or a custom domain. A pending custom domain expires 24 hours after binding unless DNS already points here; if a verified one fails every check for 24 hours the owner is emailed, and after 72 hours it is disconnected; at most 5 new domain certificates per account per day.
