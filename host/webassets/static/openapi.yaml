                  previous_domain:
                    type: string
                    description: The site's earlier own address, still serving it until this domain is verified.
                  failing_since:
                    type: string
                    format: date-time
                    description: 'A verified domain that stopped passing its checks: the owner is emailed after 24 hours; after 72 hours it stops being the site''s address.'
                  dns:
                    type: object
                    properties: {type: {type: string}, host: {type: string}, value: {type: string}}
                  dns_txt:
                    description: 'The ownership record: TXT _simple-host.<domain> holding this site''s token.'
