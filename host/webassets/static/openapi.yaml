                  status: {type: string, enum: [pending, active, error]}
                  bound_at: {type: string, format: date-time}
                  verified_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Set at once for a free <name>.simple-host.app address
                  expires_at:
                    type: string
                    format: date-time
                    description: bound_at plus 24 hours; included only while pending and never verified
                  certificate_status:
                    type: string
