      parameters:
      - {$ref: '#/components/parameters/sitename'}
      - {name: person, in: path, required: true, description: 'The editor''s handle.', schema: {type: string}}
      - {$ref: '#/components/parameters/owner'}
      responses:
        '200': {description: OK}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    apiKey: {type: apiKey, in: header, name: X-API-Key}
    connector:
      type: oauth2
      description: Per-person OAuth 2.1 (authorization code; PKCE S256 required for every self-registered client).
      flows:
        authorizationCode:
          authorizationUrl: https://simple-host.app/oauth/authorize
          tokenUrl: https://simple-host.app/oauth/token
          refreshUrl: https://simple-host.app/oauth/token
          scopes:
            sites: Publish and manage your sites and their data
            events: Available when this server supports the operation.
  parameters:
    owner:
      name: owner
      in: query
      required: false
      description: Handle of the team or account to act for (see the API description).
      schema: {type: string}
    createAccess:
      name: access
      in: query
      schema: {type: string, enum: [anyone, specific]}
      description: Creation only. Default anyone; specific allows only the owner and named viewers from the first request.
    createViewers:
      name: viewers
      in: query
      schema: {type: array, items: {type: string, format: email}}
      style: form
      explode: true
      description: Optional creation viewer emails, only with access specific.
    createIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string}
      description: 'Opaque key for a create request. Errors: 409 idempotency_key_reused.'
    version: {name: version, in: path, required: true, schema: {type: integer, minimum: 1}}
    path:
      name: path
      in: path
      required: true
      description: Relative file path (may contain forward slashes)
      schema: {type: string}
    sitename: {name: sitename, in: path, required: true, schema: {type: string}}
    create:
      name: create
      in: query
      required: false
      schema: {type: string, enum: ['1', '0', 'true', 'false'], default: '0'}
      description: 1 creates the site when you have none of that name.
    publish:
      name: publish
      in: query
      required: false
      schema: {type: boolean, default: true}
      description: 'false stores the new version without making it live (updates only; a new site''s first version always goes live: 400)'
    author:
      name: author
      in: query
      required: false
      schema: {type: string, maxLength: 80}
      description: 'Who made this version: free text, trimmed, control characters removed, at most 80 characters.'
    pending:
      name: pending
      in: query
      required: false
      schema: {type: string, enum: ['1', 'true', 'yes']}
      description: 1 lists only the versions stored with publish=false that have never been live (status ready, not the live one)
    familySuffix:
      name: suffix
      in: path
      required: true
      description: 'The family: trips.example.com or *.trips.example.com (URL-escaped)'
      schema: {type: string}
    csrf:
      name: X-SH-CSRF
      in: header
      required: false
      schema: {type: string, enum: ['1']}
      description: Required on cookie-authenticated writes
  schemas:
    DeletedResponse:
      type: object
      required: [deleted]
      properties: {deleted: {type: boolean}}
    StorageRowCreated:
      type: object
      required: [changes, last_insert_id]
      properties: {changes: {type: integer}, last_insert_id: {type: integer, format: int64}}
    StorageDownloadLink:
      type: object
      required: [url, expires_at]
      properties: {url: {type: string}, expires_at: {type: string, format: date-time}}
    SignupDetail:
      type: object
      nullable: true
      description: The outside link carried in the account-creation visit URL/form; null when none.
      properties:
        from: {type: string}
        utm_source: {type: string}
        utm_medium: {type: string}
        utm_campaign: {type: string}
        utm_term: {type: string}
        utm_content: {type: string}
        referrer: {type: string, description: Host of the page that linked in; never its path or query}
        landed_at: {type: string, format: date-time, description: Account-creation visit time}
    StorageSQL:
      type: object
      description: 'Errors (body {error, code}): the error text says what happened and what to do; the owner''s messages also list the real tables or columns. Errors: sql_request, sql_params, 503 storage_busy.'
      required: [sql]
      properties:
        sql: {type: string, description: One SQLite statement; use bound question-mark parameters.}
        params: {type: array, description: Positional JSON scalar values, items: {nullable: true}}
    TrafficFigure:
      type: object
      description: Bytes sent and requests served
      properties: {bytes: {type: integer}, requests: {type: integer}}
    GrowthSeries:
      type: object
      properties:
        total: {type: integer}
        previous: {type: integer, description: Total over the previous period of the same length.}
        change_pct: {type: number, nullable: true}
        daily: {type: array, items: {type: integer}, description: One value per entry of dates.}
        groups:
          type: object
          description: API calls only; one array per kind, aligned with dates.
          additionalProperties: {type: array, items: {type: integer}}
    TrafficCounts:
      type: object
      properties:
        views: {type: integer}
        visitors:
          type: integer
          description: Unique visitors — distinct hashed IPs over this bucket's window
    TrafficSplit:
      type: object
      description: One bucket of traffic, split by who was asking.
      properties:
        person: {$ref: '#/components/schemas/TrafficCounts'}
        bot: {$ref: '#/components/schemas/TrafficCounts'}
        infra: {$ref: '#/components/schemas/TrafficCounts'}
        owner: {$ref: '#/components/schemas/TrafficCounts'}
        unknown: {$ref: '#/components/schemas/TrafficCounts'}
    APIKey:
      type: object
      required: [id, created_at, last_used_at, current]
      properties:
        id: {type: string, format: uuid}
        name:
          type: string
          description: Where it came from (dashboard sign-in, agent sign-in, event account, replacement key) or the name typed when it was created.
        last4: {type: string, description: 'Last 4 characters of the key, to recognise it.'}
        scope:
          type: string
          enum: [full, deploy]
          description: full, or deploy (create, update, roll back and list sites and make preview links only)
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time, nullable: true}
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: The fixed expiry chosen when it was minted; null for none
        idle_expires_at:
          type: string
          format: date-time
          nullable: true
          description: When it stops working unless used before then; null when idle expiry is off
        expired:
          type: string
          enum: [expired, idle]
          description: 'Present once the key has stopped working: past expires_at (expired) or unused too long (idle)'
        current: {type: boolean, description: This is the key the request was made with}
    AuthResponse:
      type: object
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        login:
          type: string
          description: A password account's own login (account_passwords.login), present on a password sign-in or signup.
        api_key:
          type: string
          description: A new key for this sign-in, starting shk_ (keys issued before 2026-09-27 are bare hex and keep working).
        is_admin: {type: boolean}
        created: {type: boolean, description: true if this verify created the account}
    FilesBody:
      type: object
      required: [files]
      properties:
        access:
          type: string
          enum: [anyone, specific]
          description: Creation only (POST or PUT create=1).
        viewers:
          type: array
          items: {type: string, format: email}
          description: Optional emails, only with access specific; normalized, deduplicated, limited by SITE_VIEWERS_MAX.
        files:
          type: object
          additionalProperties: {type: string}
          description: relative path -> file contents (text).
        files_base64:
          type: object
          additionalProperties: {type: string, format: byte}
          description: relative path -> base64-encoded binary contents.
        remove_files:
          type: array
          items: {type: string}
          description: Paths to drop from the live version; only with PUT keep=1.
    Site:
      type: object
      properties:
        summary:
          type: object
          description: Compact content from the newest uploaded index.html; omitted when empty.
          properties:
            title: {type: string, description: Page title (up to 200 bytes).}
            description: {type: string, description: Meta description (up to 300 bytes).}
            headings: {type: string, description: First six headings (up to 300 bytes).}
            text: {type: string, description: Visible body text (up to 300 bytes).}
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        name: {type: string}
        active_version: {type: integer}
        site_url:
          type: string
          nullable: true
          description: 'The link to share: https://<site>.<handle>.simple-host.app/.'
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        visibility:
          type: string
          enum: [public, unlisted]
          description: 'List on my profile: public = on; unlisted = off (default).'
        custom_domain:
          type: string
          description: The site's free <name>.simple-host.app address or its own domain, when it has one
        domain_status: {type: string, enum: [pending, active, error]}
        deployed_at:
          type: string
          format: date-time
          description: When the newest version went live (site list only)
        domain_last_error:
          type: string
          description: 'Site list only, for a domain that is not active: what the last check found'
        domain_expires_at:
          type: string
          format: date-time
          description: 'Site list only: when an unproven domain binding is released (24 h after binding; absent once DNS points here)'
        domain_certificate_status:
          type: string
          enum: [pending, issuing, live, failed]
          description: 'Site list only, for a domain not live yet: its certificate'
        previous_domain:
          type: string
          description: 'Site list only, for a domain not live yet: the earlier address the site keeps answering at until it is'
        domain_dns:
          description: 'Site list only, for an own domain that is not active: the DNS record that points it here, to add at the registrar'
          type: object
          properties: {type: {type: string}, host: {type: string}, value: {type: string}}
        domain_dns_txt:
          description: 'Site list only, for an own domain that is not active: the TXT ownership record to add next to domain_dns.'
          type: object
          properties: {type: {type: string}, host: {type: string}, value: {type: string}}
        suspended: {type: boolean, description: Present and true when the operator has taken the site down.}
        suspended_reason: {type: string, description: 'The operator''s one-line reason, when suspended.'}
        offline: {type: boolean, description: Present and true when the owner has taken the site offline.}
        unpublished_version:
          type: integer
          description: 'Only on a deploy with publish=false: the version stored without going live.'
        preview_url:
          type: string
          format: uri
          description: 'Only on a deploy with publish=false: a link showing the stored version that works for anyone with it, for one hour.'
        preview_expires_at: {type: string, format: date-time, description: When preview_url stops working.}
        domain_partner:
          type: string
          description: The custom domain's www / bare partner, which forwards to it (see GET .../domain partner_domain)
        domain_partner_dns:
          description: The record that points the partner here too
          type: object
          properties: {type: {type: string}, host: {type: string}, value: {type: string}}
        domain_partner_status: {type: string, enum: [pending, live, not_set_up]}
        domain_partner_note: {type: string, description: 'Why the partner is not set up, when it is not'}
        address_state: {$ref: '#/components/schemas/AddressState'}
        keep:
          type: boolean
          description: 'Site list only: the owner marked the site Keep; it is never flagged as idle (PUT .../keep)'
        idle_removal_at:
          type: string
          format: date-time
          description: 'Site list only: the site had no visits by people and no new version for 90 days and its owner was emailed.'
        file_bytes:
          type: integer
          description: Website file footprint including live copy and kept versions; populated in GET /v1/sites
        keep_versions:
          type: integer
          description: 'How many versions of this site are kept, when its owner set it (PUT .../keep-versions): the newest N plus the live one.'
        family_address:
          type: string
          description: The site's address under its account's most specific live address family.
        family_addresses:
          type: array
          items: {type: string}
          description: Every address family address the site answers at, the most specific first
        passcode_protected:
          type: boolean
          description: 'Present and true when the site has a passcode (PUT .../lock): every address shows "This site is protected" until a visitor enters it.'
        access:
          type: string
          enum: [anyone, specific]
          description: 'Who can open the site: anyone, or specific (only the owner and its named viewers; GET .../access).'
        views:
          type: object
          description: 'Site list only, and only on installs that read the analytics log: views by people in the last 7 and 30 days.'
          properties: {people_7_days: {type: integer}, people_30_days: {type: integer}}
    AddressFamilyRequest:
      type: object
      description: '`suffix` or `family` names it: `*.trips.example.com` or `trips.example.com`.'
      properties:
        suffix: {type: string}
        family: {type: string, description: Same as suffix}
        site_prefix: {type: string, description: Sites named <site_prefix><label> answer at <label>.<suffix>.}
        rank:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
          description: 'Tie-break between families with the same site_prefix: the lowest rank is the main address.'
        canonical:
          type: boolean
          default: true
          description: A family address is the site's main address (unless the site has a domain of its own); false keeps the site's own address as the main one.
        cert_mode:
          type: string
          enum: [wildcard, per_host]
          default: wildcard
          description: 'wildcard: the operator''s wildcard certificate. Errors: 400 cert_mode_unavailable.'
    AddressFamily:
      type: object
      required: [id, family, suffix, site_prefix, rank, canonical, status, live, bound_at, certificate]
      properties:
        id: {type: string, format: uuid}
        family: {type: string}
        suffix: {type: string}
        site_prefix: {type: string}
        rank: {type: integer}
        canonical:
          type: boolean
          description: Whether a family address is each matching site's main address (unless it has a domain of its own)
        status:
          type: string
          enum: [pending, active, failing]
          description: pending (waiting for the DNS records), active (verified), failing (verified, but its checks fail now)
        live:
          type: boolean
          description: 'Its addresses are answered now: verified and its certificate live'
        last_error: {type: string, description: 'What the last check found, when it failed'}
        bound_at: {type: string, format: date-time}
        verified_at: {type: string, format: date-time}
        expires_at:
          type: string
          format: date-time
          description: 'Pending only: when it is dropped if its records are still not seen'
        failing_since: {type: string, format: date-time}
        release_at:
          type: string
          format: date-time
          description: When a failing family is disconnected (after its owner was emailed)
        dns:
          description: The wildcard record to add at the registrar
          type: object
          properties: {type: {type: string}, host: {type: string}, value: {type: string}}
        dns_a:
          description: The A-record alternative to dns, where the server hands one out
          type: object
          properties: {type: {type: string}, host: {type: string}, value: {type: string}}
        dns_txt:
          description: 'The ownership record: TXT _simple-host.<suffix> holding the family''s token.'
          type: object
          properties: {type: {type: string}, host: {type: string}, value: {type: string}}
        proof_exempt:
          type: boolean
          description: Present and true when the operator verified it without the TXT record
        certificate:
          type: object
          required: [mode, status]
          properties:
            mode: {type: string, enum: [wildcard]}
            status:
              type: string
              enum: [waiting_for_operator, pending, issuing, live, failed]
              description: waiting_for_operator (the operator has not set up the wildcard certificate yet), pending (the family is not verified yet), issuing.
            note: {type: string}
            expires_at: {type: string, format: date-time}
        example_url: {type: string, description: One matching site's address under the family}
        sites:
          description: 'Only with ?sites=1: every matching site and its address'
          type: array
          items:
            type: object
            required: [site, address, main]
            properties:
              site: {type: string}
              address: {type: string}
              main: {type: boolean, description: This is the site's main address}
              lives_at:
                type: string
                description: The site has a domain of its own; this address redirects there
        owner: {type: string, description: 'Admin view only: the owner''s email'}
        owner_id: {type: string, description: 'Admin view only: the owner''s account id'}
        cert_name: {type: string, description: 'Admin view only: the operator''s certificate lineage'}
    SiteAccess:
      type: object
      description: Who can open a site (named viewers)
      required: [site, access, viewers, viewer_limit, passcode_protected]
      properties:
        site: {type: string}
        access: {type: string, enum: [anyone, specific]}
        viewers:
          type: array
          items:
            type: object
            properties:
              email: {type: string}
              added_at: {type: string, format: date-time}
              signed_in_at: {type: string, format: date-time, description: When they first signed in to this site.}
        viewer_limit: {type: integer, description: SITE_VIEWERS_MAX}
        passcode_protected: {type: boolean}
        added: {type: array, items: {type: string}}
        already_listed: {type: array, items: {type: string}}
        removed: {type: string}
        note: {type: string}
    SitePasscode:
      type: object
      required: [site, passcode_protected]
      properties:
        site: {type: string}
        passcode_protected: {type: boolean}
        passcode: {type: string, description: The passcode (owner only; GET and PUT .../lock).}
        passcode_set_at: {type: string, format: date-time}
        note: {type: string, description: 'What happened, in plain words, to relay to the person'}
    AddressState:
      type: object
      description: The account's own site address (https://<site>.<handle>.simple-host.app/) and its certificate.
      properties:
        state:
          type: string
          enum: [ready, waiting, failing]
          description: ready; waiting (the certificate is queued behind the weekly and daily limits).
        address:
          type: string
          description: 'The own address: on /v1/me the pattern https://<site>.<handle>.simple-host.app/, on a site that site''s address'
        interim_address: {type: string, description: Where sites are until then (waiting or failing)}
        ready_by: {type: string, format: date-time, description: Rough estimate (waiting or failing)}
        ready_in_hours: {type: integer, description: 'The same, in whole hours, at least 1'}
        note: {type: string, description: A plain sentence to show the person (waiting or failing)}
    IdleSite:
      type: object
      properties:
        site: {type: string}
        owner: {type: string, description: The owner's email}
        last_activity:
          type: string
          format: date-time
          description: 'Latest of: created, last deploy, last visit by a person, last Keep'
        warned_at: {type: string, format: date-time}
    AdminSiteState:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        owner: {type: string}
        handle: {type: string}
        site_url: {type: string}
        suspended: {type: boolean}
        suspended_reason: {type: string}
        suspended_by:
          type: string
          enum: [site, account, '']
          description: 'Which switch holds it down: its own, or its owner''s account'
    AdminUserState:
      type: object
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        suspended: {type: boolean}
        suspended_reason: {type: string}
        site_count: {type: integer}
    SiteWithNote:
      allOf:
      - {$ref: '#/components/schemas/Site'}
      - type: object
        properties: {note: {type: string}}
    StoragePolicySet:
      type: object
      nullable: true
      description: Owner-written row rules for kv and sqlite; null is treated as absent.
      required: [policies]
      properties:
        version: {type: integer, enum: [1], description: Omit for version 1.}
        policies: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/StoragePolicy'}}
    StoragePolicy:
      type: object
      required: [name, command]
      properties:
        name: {type: string, description: Unique policy name in this set.}
        command: {type: string, enum: [read, add, edit, delete, all]}
        using: {type: string, description: 'Existing-row predicate, at most 2048 UTF-8 bytes.'}
        check: {type: string, description: 'New-row predicate, at most 2048 UTF-8 bytes.'}
        restrictive:
          type: boolean
          description: Restrictive policies combine with AND; permissive policies combine with OR.
    StorageRuleError:
      type: object
      required: [table, policy, clause, position, message]
      properties:
        table: {type: string, description: Table name or empty for resource defaults.}
        policy: {type: string, description: Policy name or empty for a set-level error.}
        clause: {type: string, description: Clause or validation bound that failed.}
        position: {type: integer, description: UTF-8 byte offset or -1 when no offset applies.}
        message: {type: string}
    StorageResource:
      type: object
      description: Every resource carries name, kind, site_passcode, rules, rules_status, rules_errors and (sqlite) tables.
      properties:
        name: {type: string}
        kind: {type: string, enum: [kv, sqlite, files]}
        site_passcode: {type: string, enum: [inherit, 'off']}
        rules: {$ref: '#/components/schemas/StoragePolicySet'}
        rules_status: {type: string, enum: [rules, invalid]}
        rules_errors: {type: array, items: {$ref: '#/components/schemas/StorageRuleError'}}
        tables:
          type: object
          description: sqlite only.
          additionalProperties:
            type: object
            properties: {rules: {$ref: '#/components/schemas/StoragePolicySet'}}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        rule_error: {$ref: '#/components/schemas/StorageRuleError'}
        rules_errors:
          type: array
          description: All diagnostics for an invalid_rules save; rule_error is the first.
          items: {$ref: '#/components/schemas/StorageRuleError'}
        error: {type: string, description: 'What went wrong, in plain words.'}
        code:
          type: string
          description: 'A stable snake_case name for the refusal, present where one status has more than one meaning. Errors: 409 site_exists, 409 domain_taken, 400 invalid_name, 400 name_reserved, 400 invalid_domain, 400 invalid_rules, 400 redirects_invalid, 403 site_quota_reached, 409 custom_domain_required, use_custom_domain, missing_api_key, wrong_auth_header, invalid_api_key, 403 deploy_only_key, 403 csrf_required, 409 recently_deleted, 409 site_not_deleted, 400 confirm_required, 404 not_found, 404 site_not_found, 404 export_link_invalid, 403 site_suspended, 403 account_suspended, 403 site_offline, 409 preview_unavailable, 403 site_locked, 400 invalid_passcode, passcodes_not_enabled, 409 passcode_needs_own_address, 409 no_passcode, 400 invalid_request, 400 use_address_family, 404 no_address_family, invalid_site_prefix, invalid_rank, invalid_cert_mode, 400 cert_mode_unavailable, address_family_limit, 409 address_families_unavailable.'
        hint:
          type: string
          description: How to fix the request, in plain words, where there is a concrete next step.
        reason:
          type: string
          description: 'On 401 invalid_code from email sign-in, which failure it is: code_wrong, code_used_up, code_expired, or link_other_browser.'
        tries_left: {type: integer, description: Remaining guesses on a code_wrong sign-in answer.}
    NotificationEventName:
      type: string
      enum:
      - record.added
      - record.changed
      - file.uploaded
      - site.deployed
      - domain.status_changed
      - viewer.access_requested
      - visitor.signed_up
      description: record.added, record.changed, and file.uploaded are visitor storage writes.
    NotificationResult:
      type: string
      description: Empty before an attempt; ok for success; otherwise a failure category.
      enum:
      - ''
      - ok
      - connection_refused
      - secret_unreadable
      - timeout
      - tls_error
      - http_4xx
      - http_5xx
      - redirect
      - refused_address
      - dns_error
      - challenge_failed
      - site_unavailable
    NotificationSecret:
      type: string
      format: password
      pattern: ^whsec_[A-Za-z0-9+/]+={0,2}$
      description: whsec_ followed by standard base64 encoding of 24 to 64 random bytes.
    Notification:
      type: object
      properties:
        event:
          type: string
          description: For a group website, its group slug; use event instead of site with notification tools.
        id: {type: string}
        site: {type: string}
        url: {type: string, format: uri}
        events: {type: array, items: {$ref: '#/components/schemas/NotificationEventName'}}
        storage: {type: string, description: Resource filter; empty matches all storage on the site.}
        label: {type: string}
        source: {type: string, enum: [mcp, owner]}
        app_name: {type: string}
        state: {type: string, enum: [active, paused, suspended, pending, expired]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, nullable: true}
        last_attempt_at: {type: string, format: date-time, nullable: true}
        last_success_at: {type: string, format: date-time, nullable: true}
        last_result: {$ref: '#/components/schemas/NotificationResult'}
        failing_since: {type: string, format: date-time, nullable: true}
        auth_header_name: {type: string}
      description: Owner-visible subscription. Never contains the signing secret or custom header value.
    NotificationLimits:
      type: object
      required: [enabled, per_site, per_minute, per_day, history_days]
      properties:
        can_create:
          type: boolean
          description: On group site lists, whether the current member may create a subscription now.
        can_manage:
          type: boolean
          description: On group site lists, whether testing, pausing, resuming, and rotation are permitted now.
        enabled:
          type: boolean
          description: Whether the server has PASSCODE_ENC_KEY and accepts new notifications.
        per_site: {type: integer}
        per_minute: {type: integer}
        per_day: {type: integer}
        history_days: {type: integer}
      description: Effective operator-configured limits.
    NotificationList:
      type: object
      required: [notifications, limits]
      properties:
        notifications: {type: array, items: {$ref: '#/components/schemas/Notification'}}
        limits: {$ref: '#/components/schemas/NotificationLimits'}
    NotificationAuthHeader:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          pattern: ^([Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn]|[Xx]-[A-Za-z0-9-]{1,62})$
          description: Authorization or X- followed by 1 to 62 letters, digits, or hyphens (case-insensitive).
        value:
          type: string
          maxLength: 1024
          writeOnly: true
          description: At most 1024 bytes; printable, with no CR or LF.
    NotificationCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS, at most 2048 bytes, no userinfo or fragment.
        events: {type: array, items: {$ref: '#/components/schemas/NotificationEventName'}, minItems: 1}
        storage:
          type: string
          default: ''
          description: Existing site storage resource; empty means all resources.
        secret: {$ref: '#/components/schemas/NotificationSecret'}
        auth_header: {$ref: '#/components/schemas/NotificationAuthHeader'}
        label: {type: string, default: ''}
    NotificationCreated:
      type: object
      required: [notification, secret]
      properties:
        notification: {$ref: '#/components/schemas/Notification'}
        secret: {$ref: '#/components/schemas/NotificationSecret'}
    NotificationUpdated:
      type: object
      required: [notification]
      properties: {notification: {$ref: '#/components/schemas/Notification'}}
    NotificationPause:
      type: object
      required: [paused]
      properties:
        paused:
          type: boolean
          description: true pauses; false resumes a paused or suspended subscription and makes held deliveries due now.
    NotificationDeleted:
      type: object
      required: [deleted]
      properties:
        deleted: {type: boolean, enum: [true]}
    NotificationTestResult:
      type: object
      required: [delivered, status, result]
      properties:
        delivered: {type: boolean}
        status: {type: integer, description: 'Receiver HTTP status, or 0 when no response was received.'}
        result: {$ref: '#/components/schemas/NotificationResult'}
    NotificationRotatedSecret:
      type: object
      required: [secret, previous_valid_until]
      properties:
        secret: {$ref: '#/components/schemas/NotificationSecret'}
        previous_valid_until:
          type: string
          format: date-time
          nullable: true
          description: Null when the previous secret cannot be read.
    NotificationDelivery:
      type: object
      properties:
        event_id: {type: string}
        name:
          type: string
          description: Storage event name. Test sends do not appear in delivery history.
        created_at: {type: string, format: date-time}
        state: {type: string, enum: [pending, delivered, failed, skipped]}
        attempts: {type: integer, minimum: 0}
        last_attempt_at: {type: string, format: date-time, nullable: true}
        last_http: {type: integer, nullable: true}
        result: {$ref: '#/components/schemas/NotificationResult'}
        duration_ms: {type: integer, nullable: true}
    NotificationDeliveries:
      type: object
      required: [deliveries]
      properties:
        deliveries: {type: array, items: {$ref: '#/components/schemas/NotificationDelivery'}, maxItems: 200}
    NotificationError:
      type: object
      required: [error, code]
      properties:
        error: {type: string, description: Plain explanation.}
        code:
          type: string
          description: Notification-specific errors. Authentication middleware can also return its usual credential errors.
          enum:
          - invalid_url
          - refused_address
          - invalid_events
          - invalid_secret
          - invalid_header
          - storage_not_found
          - too_many_notifications
          - notifications_not_enabled
          - notification_access_ended
          - forbidden
          - not_found
          - not_offered
          - client_secret
    NotificationEvent:
      type: object
      required: [eventId, name, timestamp, cursor, data]
      properties:
        eventId: {type: string, description: 'Stable event ID, also sent as webhook-id.'}
        name:
          type: string
          enum:
          - record.added
          - record.changed
          - file.uploaded
          - site.deployed
          - domain.status_changed
          - viewer.access_requested
          - visitor.signed_up
          - notification.test
        timestamp: {type: string, format: date-time}
        cursor:
          type: string
          pattern: ^c_[0-9]+$
          description: 'Safe watermark: every event at or below this site sequence for this subscription has been delivered or abandoned.'
        data:
          type: object
          required: [v, site, site_url]
          properties:
            v: {type: integer, enum: [1]}
            site: {type: string}
            site_url: {type: string, format: uri}
            storage: {type: string}
            kind: {type: string, enum: [sqlite, kv, files]}
            table: {type: string}
            row_id: {type: integer, format: int64}
            key: {type: string}
            path: {type: string}
            size: {type: integer, format: int64}
            content_type: {type: string}
            fields:
              type: object
              additionalProperties: true
              description: SQLite values after stamping (without visitor_id), changed values on edits, or KV JSON.
            change: {type: string, enum: [edited, deleted]}
            visitor:
              type: string
              nullable: true
              description: Stamped visitor ID or null, never the visitor account email.
            untrusted: {type: array, items: {type: string}, description: Keys containing visitor-written text.}
            version: {type: integer, description: site.deployed only. The version now live.}
            previous_version: {type: integer, description: site.deployed only. The version that was live before.}
            via:
              type: string
              enum: [deploy, active_version]
              description: site.deployed only. deploy when a new version was uploaded and published; active_version when an existing version was made live.
            domain: {type: string, description: domain.status_changed only.}
            status:
              type: string
              enum: [pending, active, error, released]
              description: domain.status_changed only. The new check status; released when a long-failing domain was disconnected.
            previous_status: {type: string, description: domain.status_changed only. The status before this check.}
            reason:
              type: string
              description: domain.status_changed only. The check's own text, or empty.
            cert:
              type: string
              enum: [pending, issuing, live, failed, '']
              description: domain.status_changed only. Certificate state; empty on released.
            truncated:
              type: array
              items: {type: string}
              description: Strings over NOTIFY_FIELD_MAX_BYTES (default 2 KB) are cut.
            test:
              type: boolean
              description: true on notification.test; test data has only v, site, site_url, and test.
      description: Signed outbound POST body. SQLite uses table, row_id, and fields; KV uses key and fields; files use path, size, and content_type.
    NotificationVerification:
      type: object
      required: [type, challenge]
      properties:
        type: {type: string, enum: [verification]}
        challenge:
          type: string
          description: 32 random URL-safe characters; echo unchanged in a 2xx JSON response.
      description: MCP-only signed challenge before activation.
  responses:
    BadRequest:
      description: Invalid request. A saved-data write whose JSON holds a NUL character.
      content:
        application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
    Unauthorized:
      description: 'Missing or invalid API key — send the X-API-Key header, not Authorization Bearer. Errors: missing_api_key, wrong_auth_header, invalid_api_key.'
      content:
        application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
    Forbidden:
      description: Admin access required
      content:
        application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
    NotFound:
      description: Not found
      content:
        application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
    Conflict:
      description: 'Conflict: the code says which (site_exists, domain_taken, custom_domain_required)'
      content:
        application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
    TooLarge:
      description: 'Payload too large (on saved data, code item_too_large. Errors: site_too_large, site_total_too_large, account_storage_full.'
      content:
        application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
    TooManyRequests:
      description: Rate limited (code rate_limited).
      content:
        application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
    OriginMismatch:
      description: Origin/Referer is not one of the site's own addresses (code origin_not_allowed).
      content:
        application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
    OriginMismatchOrSiteLocked:
      description: 'Origin/Referer is not one of the site''s own addresses (code origin_not_allowed. Errors: site_locked.'
      content:
        application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
    VisitorAuthRequired:
      description: Visitor sign-in required to write
      content:
        application/json:
          schema:
            type: object
            required: [error, code, sign_in, retry]
            properties:
              error: {type: string}
              code: {type: string}
              sign_in: {type: string}
              retry: {type: boolean}
