                    description: 'The custom domain''s certificate: pending (DNS not pointed here yet), issuing, live, or failed (why in last_error; retried).'
                  previous_domain:
                    type: string
                    description: The site's earlier own address, still serving it until this domain is verified (then it redirects here).
                  dns:
                    description: The record that points the domain here, to add at the registrar; absent for a free <name>.simple-host.app address
                    type: object
