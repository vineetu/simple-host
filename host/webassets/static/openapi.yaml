    post:
      x-audience: [public-host]
      tags: [Notifications]
      operationId: webPushSubscribe
      summary: Subscribe one device to web push (SIM-360)
      description: The owner (API key or an owner cookie) may subscribe site-wide or to one resource, naming the events like a webhook subscription.
      security:
      - {apiKey: []}
      responses:
        '201':
          description: Subscribe one device to web push
          content:
            application/json:
              schema:
                type: object
                properties: {id: {type: string}, public_key: {type: string}}
        '400':
          description: invalid_request, invalid_events, storage_not_found, invalid_url, refused_address, or invalid_keys.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '403':
          description: forbidden (sign in on this site first, for a visitor with no session).
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '404':
          description: site_not_found, or not_offered when the flag does not cover this account.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
        '409':
          description: 'too_many_notifications: the site subscription cap is reached.'
          content:
            application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}
