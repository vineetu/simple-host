                    properties: {type: {type: string}, host: {type: string}, value: {type: string}}
                  partner_domain:
                    type: string
                    description: The domain's www / bare partner (www.<domain> for a bare domain, the bare domain for www.<domain>).
                  dns_partner:
                    description: The record that points the partner here too (A for a bare domain, CNAME for www).
                    type: object
                    properties: {type: {type: string}, host: {type: string}, value: {type: string}}
                  partner_status:
                    type: string
                    enum: [pending, live, not_set_up]
