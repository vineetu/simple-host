name: simple-host

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: simplehost
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: simplehost
    volumes:
      - db:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplehost -d simplehost"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: ${IMAGE:-simple-host:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DSN: postgres://simplehost:${DB_PASSWORD}@db:5432/simplehost?sslmode=disable
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      # No default. An unset hostname is the signal that this box has just been
      # installed and does not yet know where it lives, which is what puts it
      # into setup mode. Defaulting it to anything means a catalog install would
      # come up pretending to be a working instance on an address nobody chose.
      SITE_DOMAIN: ${SITE_DOMAIN-}
      CONTENT_HOST: ${CONTENT_HOST-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL-}
      SETUP_PASSWORD: ${SETUP_PASSWORD-}
      SETUP_PUBLIC_API: ${SETUP_PUBLIC_API-}
      ANALYTICS_LOG: /var/log/caddy/access.log
      # How big one site may be, in megabytes. Default 100, which real sites are
      # nowhere near — the median site on simple-host is 25 KB. It is a guard
      # against one upload filling a disk, not a budget anyone is expected to
      # spend. /v1/admin/usage reports what is actually being used.
      MAX_ARCHIVE_MB: ${MAX_ARCHIVE_MB:-}
      # How many deploys of a site to keep. Every version is a full copy and the
      # live tree is one more, so history — not sites — is what fills a small
      # disk when an agent redeploys a page a dozen times in an afternoon.
      # 1 keeps only what is live, which is the right trade for an event: there
      # is no rollback, and the participant's agent still has the files.
      # Set 0 to keep every version, as a general instance with room does.
      KEEP_VERSIONS: ${KEEP_VERSIONS:-1}
      # Only the public instance hands out event hostnames; a self-hosted
      # instance leaves these unset and organisers bring their own domain.
      EVENT_DNS_TOKEN: ${EVENT_DNS_TOKEN:-}
      EVENT_DNS_TEAM_ID: ${EVENT_DNS_TEAM_ID:-}
      EVENT_DOMAINS: ${EVENT_DOMAINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - sites:/data/sites
      # Read-only: the ingester only ever reads the access log Caddy writes.
      - caddy_logs:/var/log/caddy:ro

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDR: ${SITE_ADDR:-http://localhost}
      CONTENT_ADDR: ${CONTENT_ADDR:-http://sites.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_logs:/var/log/caddy
      - sites:/data/sites:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  caddy_logs:
  sites:
  caddy_data:
  caddy_config:
