name: simple-host

# Container logs are capped on every service: Docker's default json-file driver
# never rotates, and on a small VPS the Caddy and Postgres output would
# eventually fill the disk. `local` keeps 3 files of 10 MB per container.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: simplehost
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: simplehost
    volumes:
      - db:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplehost -d simplehost"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    logging: *logging
    image: ${IMAGE:-simple-host:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DSN: postgres://simplehost:${DB_PASSWORD}@db:5432/simplehost?sslmode=disable
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      # No default. An unset hostname is the signal that this box has just been
      # installed and does not yet know where it lives, which is what puts it
      # into setup mode. Defaulting it to anything means a catalog install would
      # come up pretending to be a working instance on an address nobody chose.
      SITE_DOMAIN: ${SITE_DOMAIN-}
      CONTENT_HOST: ${CONTENT_HOST-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL-}
      SETUP_PASSWORD: ${SETUP_PASSWORD-}
      SETUP_PUBLIC_API: ${SETUP_PUBLIC_API-}
      ANALYTICS_LOG: /var/log/caddy/access.log
      # How big one site may be, in megabytes. Default 100, which real sites are
      # nowhere near — the median site on simple-host is 25 KB. It is a guard
      # against one upload filling a disk, not a budget anyone is expected to
      # spend. /v1/admin/usage reports what is actually being used.
      MAX_ARCHIVE_MB: ${MAX_ARCHIVE_MB:-100}
      # How many deploys of a site to keep. Every version is a full copy and the
      # live tree is one more, so history — not sites — is what fills a small
      # disk when an agent redeploys a page a dozen times in an afternoon.
      # 1 keeps only what is live, which is the right trade for an event: there
      # is no rollback, and the participant's agent still has the files.
      # Set 0 to keep every version, as a general instance with room does.
      KEEP_VERSIONS: ${KEEP_VERSIONS:-1}
      # Only the public instance hands out event hostnames; a self-hosted
      # instance leaves these unset and organisers bring their own domain.
      EVENT_DNS_TOKEN: ${EVENT_DNS_TOKEN:-}
      EVENT_DNS_TEAM_ID: ${EVENT_DNS_TEAM_ID:-}
      EVENT_DOMAINS: ${EVENT_DOMAINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Operational times and limits (docs/configuration.md). Empty means the
      # built-in default, so these pass through only what .env sets.
      SIGNIN_CODE_TTL_MINUTES: ${SIGNIN_CODE_TTL_MINUTES:-}
      MAX_KEYS_PER_ACCOUNT: ${MAX_KEYS_PER_ACCOUNT:-}
      HANDLE_RENAME_EVERY_DAYS: ${HANDLE_RENAME_EVERY_DAYS:-}
      EMAIL_CHANGE_UNDO_DAYS: ${EMAIL_CHANGE_UNDO_DAYS:-}
      MAX_SITES_PER_ACCOUNT: ${MAX_SITES_PER_ACCOUNT:-}
      MAX_FILES_PER_SITE: ${MAX_FILES_PER_SITE:-}
      PREVIEW_LINK_TTL_MINUTES: ${PREVIEW_LINK_TTL_MINUTES:-}
      EXPORT_LINK_TTL_MINUTES: ${EXPORT_LINK_TTL_MINUTES:-}
      VISITOR_SESSION_DAYS: ${VISITOR_SESSION_DAYS:-}
      VISITOR_SESSION_IDLE_DAYS: ${VISITOR_SESSION_IDLE_DAYS:-}
      OAUTH_ACCESS_TTL_MINUTES: ${OAUTH_ACCESS_TTL_MINUTES:-}
      OAUTH_REFRESH_TTL_DAYS: ${OAUTH_REFRESH_TTL_DAYS:-}
      OAUTH_UNUSED_CLIENT_DAYS: ${OAUTH_UNUSED_CLIENT_DAYS:-}
      DOMAIN_UNPROVEN_HOURS: ${DOMAIN_UNPROVEN_HOURS:-}
      DOMAIN_UNPROVEN_MAX_DAYS: ${DOMAIN_UNPROVEN_MAX_DAYS:-}
      DOMAIN_LAPSE_WARN_HOURS: ${DOMAIN_LAPSE_WARN_HOURS:-}
      DOMAIN_LAPSE_HOURS: ${DOMAIN_LAPSE_HOURS:-}
      DOMAIN_CHECK_INTERVAL_MINUTES: ${DOMAIN_CHECK_INTERVAL_MINUTES:-}
      DOMAIN_CERTS_PER_ACCOUNT_DAILY: ${DOMAIN_CERTS_PER_ACCOUNT_DAILY:-}
      EVENT_TTL_DAYS: ${EVENT_TTL_DAYS:-}
      EVENT_MAX_CLAIMS: ${EVENT_MAX_CLAIMS:-}
      DELETED_RETENTION_DAYS: ${DELETED_RETENTION_DAYS:-}
      IDLE_AFTER_DAYS: ${IDLE_AFTER_DAYS:-}
      IDLE_GRACE_DAYS: ${IDLE_GRACE_DAYS:-}
      IDLE_REPLY_TO: ${IDLE_REPLY_TO:-}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-}
      API_METRICS_RETENTION_DAYS: ${API_METRICS_RETENTION_DAYS:-}
      AI_MAX_JOBS_PER_USER: ${AI_MAX_JOBS_PER_USER:-}
      AI_MAX_JOBS: ${AI_MAX_JOBS:-}
      AI_JOB_TIMEOUT_MINUTES: ${AI_JOB_TIMEOUT_MINUTES:-}
      RATE_LIMIT_SIGNIN_IP: ${RATE_LIMIT_SIGNIN_IP:-}
      RATE_LIMIT_SIGNIN_EMAIL: ${RATE_LIMIT_SIGNIN_EMAIL:-}
      RATE_LIMIT_VISITOR_OAUTH: ${RATE_LIMIT_VISITOR_OAUTH:-}
      RATE_LIMIT_VISITOR_AUTH: ${RATE_LIMIT_VISITOR_AUTH:-}
      RATE_LIMIT_VISITOR: ${RATE_LIMIT_VISITOR:-}
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-}
      RATE_LIMIT_STATE: ${RATE_LIMIT_STATE:-}
      RATE_LIMIT_SITE_OPS: ${RATE_LIMIT_SITE_OPS:-}
      RATE_LIMIT_EXPORT: ${RATE_LIMIT_EXPORT:-}
      RATE_LIMIT_DOMAIN_CHECK: ${RATE_LIMIT_DOMAIN_CHECK:-}
      RATE_LIMIT_DOMAIN_CHECK_USER: ${RATE_LIMIT_DOMAIN_CHECK_USER:-}
      RATE_LIMIT_OAUTH_REGISTER: ${RATE_LIMIT_OAUTH_REGISTER:-}
      RATE_LIMIT_OAUTH_AUTHORIZE: ${RATE_LIMIT_OAUTH_AUTHORIZE:-}
      RATE_LIMIT_OAUTH_TOKEN: ${RATE_LIMIT_OAUTH_TOKEN:-}
      RATE_LIMIT_AI_IP: ${RATE_LIMIT_AI_IP:-}
      RATE_LIMIT_AI_USER: ${RATE_LIMIT_AI_USER:-}
      RATE_LIMIT_TRANSCRIBE: ${RATE_LIMIT_TRANSCRIBE:-}
      SAVED_DATA_UNDO_DAYS: ${SAVED_DATA_UNDO_DAYS:-}
      SAVED_DATA_HISTORY_MAX_MB: ${SAVED_DATA_HISTORY_MAX_MB:-}
      SAVED_DATA_SITE_MAX_MB: ${SAVED_DATA_SITE_MAX_MB:-}
      SAVED_DATA_SWEEP_MINUTES: ${SAVED_DATA_SWEEP_MINUTES:-}
      SAVED_DATA_WATCH_DAYS: ${SAVED_DATA_WATCH_DAYS:-}
      SAVED_DATA_WATCH_INC_MAX: ${SAVED_DATA_WATCH_INC_MAX:-}
      SAVED_DATA_WATCH_ITEM_KB: ${SAVED_DATA_WATCH_ITEM_KB:-}
      SAVED_DATA_IDEMPOTENCY_HOURS: ${SAVED_DATA_IDEMPOTENCY_HOURS:-}
      SAVED_DATA_READ_PER_SEC: ${SAVED_DATA_READ_PER_SEC:-}
      SAVED_DATA_READ_BURST: ${SAVED_DATA_READ_BURST:-}
      SAVED_DATA_APPEND_PER_MIN: ${SAVED_DATA_APPEND_PER_MIN:-}
      SAVED_DATA_APPEND_BURST: ${SAVED_DATA_APPEND_BURST:-}
      SAVED_DATA_IDEMPOTENCY_MAX_PER_SITE: ${SAVED_DATA_IDEMPOTENCY_MAX_PER_SITE:-}
      SAVED_DATA_SNAPSHOT_EVERY: ${SAVED_DATA_SNAPSHOT_EVERY:-}
      SAVED_DATA_WATCH_KEEP_DAYS: ${SAVED_DATA_WATCH_KEEP_DAYS:-}
      SAVED_DATA_CONTENT_MAX_KB: ${SAVED_DATA_CONTENT_MAX_KB:-}
      SAVED_DATA_CONTENT_NAMES_MAX: ${SAVED_DATA_CONTENT_NAMES_MAX:-}
      SAVED_DATA_ENTRY_MAX_KB: ${SAVED_DATA_ENTRY_MAX_KB:-}
      SAVED_DATA_ENTRIES_MAX: ${SAVED_DATA_ENTRIES_MAX:-}
      SAVED_DATA_WITHDRAW_UNDO_MINUTES: ${SAVED_DATA_WITHDRAW_UNDO_MINUTES:-}
      SAVED_DATA_NOTIFY_EACH_MINUTES: ${SAVED_DATA_NOTIFY_EACH_MINUTES:-}
      SAVED_DATA_NOTIFY_DAILY_HOURS: ${SAVED_DATA_NOTIFY_DAILY_HOURS:-}
      SAVED_DATA_SAVERS_MAX: ${SAVED_DATA_SAVERS_MAX:-}
      ASK_ENABLED: ${ASK_ENABLED:-}
      ASK_BURST: ${ASK_BURST:-}
      ASK_EVERY_SECONDS: ${ASK_EVERY_SECONDS:-}
      ASK_DAILY_MAX: ${ASK_DAILY_MAX:-}
      ASK_MAX_IN_FLIGHT: ${ASK_MAX_IN_FLIGHT:-}
      ASK_MODEL: ${ASK_MODEL:-}
      ASK_REASONING_EFFORT: ${ASK_REASONING_EFFORT:-}
      ASK_MAX_TOKENS: ${ASK_MAX_TOKENS:-}
    volumes:
      - sites:/data/sites
      # Read-only: the ingester only ever reads the access log Caddy writes.
      - caddy_logs:/var/log/caddy:ro

  web:
    image: caddy:2-alpine
    logging: *logging
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDR: ${SITE_ADDR:-http://localhost}
      CONTENT_ADDR: ${CONTENT_ADDR:-http://sites.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_logs:/var/log/caddy
      - sites:/data/sites:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  caddy_logs:
  sites:
  caddy_data:
  caddy_config:
