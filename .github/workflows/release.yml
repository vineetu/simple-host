name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# A stable release and its latest promotion use the same lock, including on
# retries. Candidate runs only contend with another run of the same tag.
concurrency:
  group: release-${{ contains(github.ref_name, '-rc.') && github.ref_name || 'stable' }}
  queue: max

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      stable: ${{ steps.release.outputs.stable }}
    permissions:
      actions: read
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Resolve and check the tag
        id: release
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"
          bash scripts/release/build.sh metadata "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Verify stable installer pins
        if: steps.release.outputs.stable == 'true'
        run: |
          host_pin=$(sed -n 's/^VERSION="\(v[^"]*\)"$/\1/p' deploy/install/install.sh)
          hack_pin=$(sed -n 's/^ *image: .*simple-hack:\([^}]*\)}$/v\1/p' deploy/hack/standalone/compose.yaml)
          if [[ $host_pin != "$GITHUB_REF_NAME" || $hack_pin != "$GITHUB_REF_NAME" ]]; then
            echo "Host installer pins '$host_pin' and Hack Compose pins '$hack_pin', expected '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
      - name: Find retained downloads on retry
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=release-assets-$GITHUB_REF_NAME" \
            --jq '.artifacts[0] | if .expired then error("Release downloads have expired") else .id // empty end')
          echo "id=$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install release tooling
        run: python3 -m pip install Pillow PyYAML
      - name: rules engine module
        run: make test-rules
      - name: Five product boundary checks
        env:
          TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}
        run: make check-boundaries
      - name: Install the pinned Helm 3
        # The checked-in manifests are compared byte for byte with a fresh render, and Helm 4 renders
        # extra blank lines. The runner image's Helm changes without notice, so the version is pinned here.
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo "a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  $RUNNER_TEMP/helm.tgz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
          helm version --short
      - name: Check both charts and the Hack setup pins
        env:
          TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}
        run: |
          bash deploy/kubernetes/test-chart.sh
          python3 scripts/check-hack-setup.py
      - name: Build and verify binaries, charts and bundles
        if: steps.retained.outputs.id == ''
        run: bash scripts/release/build.sh artifacts "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.retained.outputs.id == ''
        with:
          name: release-assets-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error

  verify-binaries:
    needs: build-artifacts
    strategy:
      matrix:
        runner: [ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets
      - name: Verify cross-built downloads on their native platform
        run: bash scripts/release/build.sh verify-binaries "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-assets"

  build-images:
    needs: verify-binaries
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Find retained OCI archives on retry
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=release-images-$GITHUB_REF_NAME" \
            --jq '.artifacts[0] | if .expired then error("Verified OCI archives have expired") else .id // empty end')
          echo "id=$artifact" >> "$GITHUB_OUTPUT"
      - name: Install Skopeo
        if: steps.retained.outputs.id == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
      # The distroless targets cross-compile. The Caddy wrapper runs apk on
      # each target architecture, so it also needs QEMU.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: steps.retained.outputs.id == ''
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.retained.outputs.id == ''
      - name: Build and verify all three multiarch images
        if: steps.retained.outputs.id == ''
        run: |
          bash scripts/release/build.sh images "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-images"
          bash scripts/release/build.sh verify-images "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-images"
          (cd "$RUNNER_TEMP/release-images" && sha256sum host.tar hack.tar standalone.tar > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.retained.outputs.id == ''
        with:
          name: release-images-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-images
          if-no-files-found: error
          compression-level: 0

  check-stable-release:
    needs: [build-artifacts, build-images]
    if: needs.build-artifacts.outputs.stable == 'true'
    runs-on: ubuntu-latest
    # GitHub only lists draft releases for callers with push access.
    permissions:
      contents: write
    outputs:
      approved_draft_tag: ${{ steps.check.outputs.approved_draft_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check the stable draft notes or existing published release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build-artifacts.outputs.commit }}
        run: python3 scripts/release/publish.py check-stable-release "$GITHUB_REF_NAME" "$RELEASE_COMMIT"

  publish-images:
    needs: [build-artifacts, build-images, check-stable-release]
    if: >-
      !cancelled() && needs.build-images.result == 'success' &&
      (needs.check-stable-release.result == 'success' || needs.build-artifacts.outputs.stable == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      stable: ${{ steps.release.outputs.stable }}
      commit: ${{ needs.build-artifacts.outputs.commit }}
      host_digest_ref: ${{ steps.publish.outputs.host_digest_ref }}
      host_latest: ${{ steps.release.outputs.host_latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Resolve the tag
        id: release
        run: bash scripts/release/build.sh metadata "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-images-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-images
      - name: Verify retained archive checksums
        working-directory: ${{ runner.temp }}/release-images
        run: sha256sum --check SHA256SUMS
      - name: Install Skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # For an rc tag all three destinations are under the dry-run path.
      - name: Publish the three versioned images
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.build-artifacts.outputs.commit }}
          HOST_IMAGE: ${{ steps.release.outputs.host_image }}
          HACK_BASE_IMAGE: ${{ steps.release.outputs.hack_base_image }}
          HACK_IMAGE: ${{ steps.release.outputs.hack_image }}
          APPROVED_DRAFT_TAG: ${{ needs.check-stable-release.outputs.approved_draft_tag }}
          RELEASE_IMAGES: ${{ runner.temp }}/release-images
        run: |
          python3 scripts/release/publish.py images "$GITHUB_REF_NAME" "$RELEASE_COMMIT" "$RELEASE_IMAGES" \
            "$HOST_IMAGE" "$HACK_BASE_IMAGE" "$HACK_IMAGE"

  publish-downloads:
    needs: publish-images
    if: needs.publish-images.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      promote: ${{ steps.publish.outputs.promote }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-assets
      - name: Publish stable downloads
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.publish-images.outputs.commit }}
        run: python3 scripts/release/publish.py downloads "$GITHUB_REF_NAME" "$RELEASE_COMMIT" "$RUNNER_TEMP/release-assets"

  promote-latest:
    needs: [publish-images, publish-downloads]
    if: needs.publish-downloads.outputs.promote == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.publish-images.outputs.commit }}
          persist-credentials: false
      - name: Install Skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Update the stable Host latest image
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_DIGEST_REF: ${{ needs.publish-images.outputs.host_digest_ref }}
          HOST_LATEST: ${{ needs.publish-images.outputs.host_latest }}
          RELEASE_COMMIT: ${{ needs.publish-images.outputs.commit }}
        run: python3 scripts/release/publish.py promote "$GITHUB_REF_NAME" "$RELEASE_COMMIT" "$HOST_DIGEST_REF" "$HOST_LATEST"
