name: Simple Hack release

on:
  push:
    tags:
      - 'hack-v*'

permissions:
  contents: write
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: release metadata
        id: release
        run: |
          version=${GITHUB_REF_NAME#hack-v}
          [[ "$GITHUB_REF_NAME" =~ ^hack-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}:hack-$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/simple-hack" >> "$GITHUB_OUTPUT"
      - name: downloadable installation package
        run: |
          version=${{ steps.release.outputs.version }}
          package="simple-hack-$version"
          mkdir -p "dist/$package/deploy/hack" "dist/$package/deploy/digitalocean/droplet/scripts" "dist/$package/docs/platforms" "dist/$package/db"
          cp -a deploy/hack/standalone "dist/$package/deploy/hack/"
          for script in 010-docker.sh 014-ufw-http.sh 900-cleanup.sh 950-final-cleanup.sh 999-img_check.sh; do
            cp "deploy/digitalocean/droplet/scripts/$script" "dist/$package/deploy/digitalocean/droplet/scripts/"
          done
          cp db/schema.sql "dist/$package/db/"
          cp docs/platforms/simple-hack-*.md "dist/$package/docs/platforms/"
          cp docs/configuration.md "dist/$package/docs/"
          # The archive's defaults must match the image built by this tag.
          source_version=$(grep -Eo 'simple-hack:[0-9]+\.[0-9]+\.[0-9]+' deploy/hack/standalone/compose.yaml | head -1 | cut -d: -f2)
          [[ "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source_pattern=${source_version//./\\.}
          for file in deploy/hack/standalone/{install.sh,compose.yaml,Dockerfile,coolify/compose.yaml,digitalocean/template.json,digitalocean/prepare.sh}; do
            sed -i "s/$source_pattern/$version/g" "dist/$package/$file"
          done
          # Only update instructions for this package. Historic verification of
          # an earlier release must keep its actual version number.
          python3 - "$package" "$source_version" "$version" <<'PY'
          from pathlib import Path
          import sys
          package, old, new = sys.argv[1:]
          docs = Path("dist") / package / "docs/platforms"
          replacements = {
              "simple-hack-standalone.md": (
                  (f"**Release status: v{old} is published.**", f"**Release status: v{new} is published.**"),
                  (f"[hack-v{old} release](https://github.com/vineetu/simple-host/releases/tag/hack-v{old})",
                   f"[hack-v{new} release](https://github.com/vineetu/simple-host/releases/tag/hack-v{new})"),
                  (f"upgrade.sh --image ghcr.io/vineetu/simple-hack:{old}",
                   f"upgrade.sh --image ghcr.io/vineetu/simple-hack:{new}"),
                  (f"The `hack-v{old}` release builds", f"The `hack-v{new}` release builds"),
                  (f"SIMPLE_HOST_IMAGE=ghcr.io/vineetu/simple-host:hack-{old}",
                   f"SIMPLE_HOST_IMAGE=ghcr.io/vineetu/simple-host:hack-{new}"),
              ),
              "simple-hack-coolify.md": (
                  (f"Its default `ghcr.io/vineetu/simple-hack:{old}` image",
                   f"Its default `ghcr.io/vineetu/simple-hack:{new}` image"),
              ),
          }
          for name, pairs in replacements.items():
              path = docs / name
              body = path.read_text()
              for before, after in pairs:
                  if body.count(before) != 1:
                      raise SystemExit(f"expected one current instruction in {path}: {before}")
                  body = body.replace(before, after, 1)
              path.write_text(body)
          PY
          printf 'Simple Hack %s\n\nStart with docs/platforms/simple-hack-standalone.md.\nImage: ghcr.io/%s/simple-hack:%s\nSource: %s\n' "$version" "${GITHUB_REPOSITORY_OWNER,,}" "$version" "$GITHUB_SHA" > "dist/$package/README.txt"
          cd dist
          tar -czf "$package.tar.gz" "$package"
          zip -qr "$package.zip" "$package"
          sha256sum "$package.tar.gz" "$package.zip" > SHA256SUMS
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Both images use this checkout; the schema cannot drift from the binary.
      # This tag family leaves the older small-box release pins intact.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=v${{ steps.release.outputs.version }}
            COMMIT=${{ steps.release.outputs.commit }}
          tags: ${{ steps.release.outputs.base }}
          cache-from: type=gha,scope=hack-base
          cache-to: type=gha,mode=max,scope=hack-base
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/hack/standalone/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: SIMPLE_HOST_IMAGE=${{ steps.release.outputs.base }}
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=hack-platform
          cache-to: type=gha,mode=max,scope=hack-platform
      - name: publish installation downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --verify-tag --latest=false --title "Simple Hack ${{ steps.release.outputs.version }}" \
            --notes "Full Simple Hack installation package and multi-architecture image. See the standalone, DigitalOcean and Coolify guides included in the download. Marketplace approval is separate."
