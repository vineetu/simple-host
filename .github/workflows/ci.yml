name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Nginx rendering regressions compare with the original template in Git.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # make check runs node --test fixtures and PyYAML-based scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - run: pip install pyyaml
      - run: sudo apt-get update -qq && sudo apt-get install -y nginx-light

      - name: rules engine module
        run: make test-rules

      - name: make check (including five product boundary checks)
        env:
          # check-fresh-install.sh defaults to `sudo -u postgres psql`, which is
          # how it runs on the server. In CI the database is a service container.
          PSQL: psql -h 127.0.0.1 -p ${{ job.services.postgres.ports[5432] }} -U postgres
          PGPASSWORD: postgres
          # scripts/test-integration.sh (run by `make check`) creates its own
          # platform-only and composed throwaway templates on this server.
          # Package paths select the schema, including for narrowed TEST_PKGS runs.
          TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}
        run: make check FULL=1

      - name: make check-release
        run: make check-release
