name: mcpjam

# The connector check of both programs' MCP servers (Simple Host and Simple
# Hack, one job each) against a throwaway local instance, on every push and
# pull request and weekly: MCPJam protocol, OAuth, host compatibility and MCP
# Apps conformance, the tool annotation tests, the kit's tool list and package,
# and the tool listing's size against scripts/mcpeval/baseline-*.json. The
# model evals need the claude CLI and run locally (plugins/ROUTINE.md).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  MCPJAM_CLI: '@mcpjam/cli@6.0.0'
  DB_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
  FIX: /tmp/mcpjam-fixture

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        product: [host, hack]
    env:
      PRODUCT: ${{ matrix.product }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make connector-check NO_EVALS=1
      - if: failure()
        run: tail -n 40 "$FIX"/step-*.log "$FIX/server.log"
