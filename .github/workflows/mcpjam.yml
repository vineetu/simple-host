name: mcpjam

# MCPJam checks of the MCP server against a throwaway local instance: protocol
# and OAuth conformance, host compatibility and the Claude directory policy on
# every push and pull request (free), and the eval suite weekly or by hand on
# two Claude models with our own Anthropic key (a full run is more than the
# MCPJam free plan's 200 daily credits). See scripts/mcpjam/.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  MCPJAM_CLI: '@mcpjam/cli@6.0.0'
  DB_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
  BIN: /tmp/simple-host
  FIX: /tmp/mcpjam-fixture

jobs:
  checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: CGO_ENABLED=0 go build -o "$BIN" ./cmd/server
      - run: bash scripts/mcpjam/fixture.sh
      - run: bash scripts/mcpjam/checks.sh
      - if: failure()
        run: tail -50 "$FIX/server.log"

  evals:
    # Only main's copy of this file may reach the key.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [anthropic/claude-haiku-4.5, anthropic/claude-sonnet-5]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: CGO_ENABLED=0 go build -o "$BIN" ./cmd/server
      - run: bash scripts/mcpjam/fixture.sh
      - run: python3 scripts/mcpjam/seed.py "$FIX/user.key"
      - name: eval suite on ${{ matrix.model }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MCPJAM_API_KEY: ${{ secrets.MCPJAM_API_KEY }}
          MCPJAM_PROJECT: v974pamkqdpwc0bsn151fhz8vx8gs35r
        run: |
          status=0
          for suite in core-jobs advanced-jobs; do
            sed "s#^  model: .*#  model: ${{ matrix.model }}#" ".mcpjam/evals/$suite.yaml" > "$FIX/$suite.yaml"
            npx -y "$MCPJAM_CLI" --no-telemetry --format human test "$FIX/$suite.yaml" --inference byok \
              --url http://127.0.0.1:18190/mcp --header "X-API-Key: $(cat "$FIX/user.key")" --out "$FIX/eval-report-$suite.json" || status=1
          done
          exit $status
      # The report carries each case's transcript (the CLI redacts credentials).
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ strategy.job-index }}
          path: ${{ env.FIX }}/eval-report-*.json
          if-no-files-found: ignore
          retention-days: 14
