# Core customer jobs against the local fixture (scripts/mcpjam). The site
# eval-cafe and its resources come from scripts/mcpjam/seed.py. Runs weekly
# and by hand (.github/workflows/mcpjam.yml) with ANTHROPIC_API_KEY (--inference byok).
schemaVersion: "2"
mode: agentWorkflow
reportingMode: standard
suite:
  id: s_simple_host_core_jobs
  name: Simple Host core jobs
target:
  servers:
    - name: simplehost
defaults:
  judge:
    enabled: false
  model: anthropic/claude-haiku-4.5
  iterations: 1
  passThreshold: 1
  validity: {}
cases:
  - id: c_create_site
    title: publishes a new site
    steps:
      - id: s1
        kind: prompt
        prompt: Publish a new one-page website named eval-bakery for Rosa's Bakery, open 7am to 3pm daily.
    assertions:
      - type: toolCalledWith
        toolName: create_site
        args: {mode: partial, args: {site: eval-bakery}}
      - type: toolNeverCalled
        toolName: delete_site
  - id: c_read_site
    title: reads a site without changing it
    steps:
      - id: s1
        kind: prompt
        prompt: What opening hours does the home page of my site eval-cafe show right now?
    # get_site carries a text summary of the page, so either it or
    # read_site_file is a right answer. Runs before c_update_site changes them.
    assertions:
      - type: responseMatches
        pattern: "8\\s?[aA]\\.?[mM]"
      - type: toolNeverCalled
        toolName: update_site
      - type: noToolErrors
  - id: c_update_site
    title: changes an existing site without replacing it
    steps:
      - id: s1
        kind: prompt
        prompt: On my site eval-cafe, change the opening hours on the home page to 7am to 8pm. Keep everything else.
    assertions:
      - type: toolCalledWith
        toolName: update_site
        args: {mode: partial, args: {site: eval-cafe}}
      - type: toolNeverCalled
        toolName: create_site
      - type: toolNeverCalled
        toolName: delete_site
  - id: c_kv
    title: updates a saved value
    steps:
      - id: s1
        kind: prompt
        prompt: On eval-cafe, set today's special in the menu data to lemon cake.
    assertions:
      - type: toolCalledWith
        toolName: storage_put_kv
        args: {mode: partial, args: {site: eval-cafe, name: menu}}
      - type: toolNeverCalled
        toolName: update_site
  - id: c_sql
    title: reads a table without writing
    steps:
      - id: s1
        kind: prompt
        prompt: How many bookings are saved in the bookings data on eval-cafe?
    assertions:
      - type: toolCalledWith
        toolName: storage_sql_query
        args: {mode: partial, args: {site: eval-cafe, name: bookings}}
      - type: toolNeverCalled
        toolName: storage_sql_execute
  - id: c_files
    title: lists uploaded files
    steps:
      - id: s1
        kind: prompt
        prompt: List the photos uploaded to the photos storage on eval-cafe.
    assertions:
      # Not in the first listing since SIM-187: reached through run_tool.
      - type: toolCalledWith
        toolName: run_tool
        args: {mode: partial, args: {name: storage_list_file_objects, arguments: {site: eval-cafe, name: photos}}}
  - id: c_personal_photos
    title: hands over a photo link for phone pictures
    steps:
      - id: s1
        kind: prompt
        prompt: I have pictures on my phone to add to my eval-cafe site. Send me the link so I can choose them.
    assertions:
      - type: toolCalledWith
        toolName: create_upload_link
        args: {mode: partial, args: {site: eval-cafe}}
      - type: responseMatches
        # The picker's sign-in address when the client declares MCP Apps, the token link otherwise (SIM-226).
        pattern: 'https://[^\s]+/photos\?site=eval-cafe(#t=[A-Za-z0-9_-]+|&account=)'
      - type: toolNeverCalled
        toolName: create_site
      - type: toolNeverCalled
        toolName: update_site
      - type: noToolErrors
