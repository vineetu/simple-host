<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="t">Simple Host on Coolify</title>
<desc id="d">A Coolify server runs its proxy, which ends HTTPS with Let's Encrypt certificates for both names, and forwards to one Docker Compose resource: an app container running Caddy and the Simple Host server with a data volume, a Postgres container with a volume, and a one-shot release container that loads the schema and migrations before the app starts. Coolify builds it from a Git repository.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="800" height="900" fill="#ffffff"/>
<text x="40" y="38" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Simple Host on Coolify</text>
<text x="40" y="60" font-size="13" font-weight="400" fill="#475569" text-anchor="start">One Docker Compose resource: app (Caddy and the server), Postgres, and a one-shot release</text>
<text x="40" y="78" font-size="13" font-weight="400" fill="#475569" text-anchor="start">step. Files: deploy/platforms/coolify (compose.yaml, Dockerfile, Caddyfile, start.sh).</text>
<rect x="40" y="92" width="220" height="74" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="150.0" y="116" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">People and AI agents</text>
<text x="150.0" y="136" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">browsers, curl, the connector</text>
<rect x="460" y="92" width="300" height="92" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="610.0" y="116" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Your DNS provider</text>
<text x="610.0" y="136" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">hack.example.com and</text>
<text x="610.0" y="154" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">sites.hack.example.com</text>
<text x="610.0" y="172" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">A → your server's address</text>
<rect x="40" y="232" width="720" height="92" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.6"/>
<text x="400.0" y="256" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Coolify's proxy on the server (Traefik by default)</text>
<text x="400.0" y="276" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">HTTPS ends here: a Let's Encrypt certificate for each name, by HTTP-01</text>
<text x="400.0" y="294" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">the visitor's address goes to the app in X-Forwarded-For</text>
<text x="400.0" y="312" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">forwarded as plain HTTP to the app's port 8080</text>
<line x1="150" y1="166" x2="150" y2="232" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="260" y="193" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">https://hack.example.com</text>
<text x="260" y="209" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">https://sites.hack.example.com</text>
<line x1="610" y1="184" x2="610" y2="232" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="604" y="210" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">resolves to the server</text>
<rect x="40" y="374" width="720" height="372" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
<text x="56" y="398" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Docker Compose resource</text>
<text x="56" y="418" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Started in this order: db, release, app</text>
<rect x="60" y="436" width="330" height="92" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.6"/>
<text x="225.0" y="460" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">db: Postgres 16</text>
<text x="225.0" y="480" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">private to the resource</text>
<text x="225.0" y="498" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">user simplehost, password</text>
<text x="225.0" y="516" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">generated by Coolify</text>
<rect x="60" y="564" width="330" height="92" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.6"/>
<text x="225.0" y="588" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">release: runs once, then exits</text>
<text x="225.0" y="608" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">loads schema.sql into an empty database,</text>
<text x="225.0" y="626" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">then simple-host migrate</text>
<text x="225.0" y="644" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">if it fails, app does not start</text>
<line x1="225" y1="564" x2="225" y2="528" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="410" y="436" width="330" height="128" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.6"/>
<text x="575.0" y="460" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">app: Caddy and the server</text>
<text x="575.0" y="480" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Caddy on port 8080: serves sites from disk,</text>
<text x="575.0" y="498" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">hides /internal/*, writes the access log</text>
<text x="575.0" y="516" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">the released server on 127.0.0.1:8090</text>
<text x="575.0" y="534" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">API, sign-in, saved data, analytics</text>
<rect x="410" y="600" width="330" height="56" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.6"/>
<text x="575.0" y="624" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Volume data at /data</text>
<text x="575.0" y="644" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">the sites and the access log</text>
<rect x="60" y="672" width="330" height="56" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.6"/>
<text x="225.0" y="696" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Volume db</text>
<text x="225.0" y="716" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Postgres files</text>
<line x1="390" y1="482" x2="410" y2="482" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="400" y="428" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">DB_DSN</text>
<line x1="575" y1="564" x2="575" y2="600" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="225" y1="564" x2="225" y2="528" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="225" y1="324" x2="225" y2="374" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="330" y="353" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">HTTP to port 8080</text>
<rect x="40" y="780" width="720" height="74" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="400.0" y="804" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Your Git repository with deploy/platforms/coolify</text>
<text x="400.0" y="824" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">New resource &gt; Docker Compose in Coolify; a redeploy builds the image</text>
<text x="400.0" y="842" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">(Caddy + the released server) and applies migrations before it starts</text>
<line x1="400" y1="780" x2="400" y2="746" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="480" y="768" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">builds and deploys</text>
<text x="40" y="878" font-size="13" font-weight="400" fill="#475569" text-anchor="start">SITE_DOMAIN is set by you. ADMIN_API_KEY and the database password are generated by Coolify (Environment).</text>
</svg>
