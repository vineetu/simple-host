<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip · Itinerary</title>

<!-- ===================================================================== -->
<!--  EDIT ONLY THE TRIP OBJECT BELOW. Everything under it is the renderer  -->
<!--  and needs no changes for a normal trip.                               -->
<!-- ===================================================================== -->
<script>
const TRIP = {
  title:    'Lisbon & the Algarve',
  subtitle: 'Two weeks · four of us',

  // Optional. Omit (or leave {}) for a solo trip and the "You are" filter hides.
  people: {
    A: {name:'Ana'},
    B: {name:'Ben'},
    C: {name:'Cleo'},
    D: {name:'Dev'},
  },

  // ---- THE ONLY PART THAT REALLY MATTERS -----------------------------------
  // Each item needs an absolute start/end and the timezone of the PLACE.
  //
  //  kind   flight | train | ferry | car | stay | activity | event
  //  start  ISO instant — MUST end in Z or carry an offset (+01:00).
  //         "2026-05-04T09:00" (no zone) is read in the VIEWER's timezone and
  //         will show the wrong local time for everyone not sitting there.
  //  end    same. For a stay this is checkout — the range is what keeps the
  //         lodging showing as "right now" underneath the day's activities.
  //  zone   IANA zone of where it happens ('Europe/Lisbon'). Times always
  //         render in this zone, never converted to the reader's clock.
  //  who    'all' or a string of person keys ('AB'). Ignored if no people.
  //  qr     optional data: URL or image path — a QR card appears ONLY if set.
  //  warn   optional amber callout for a clash or gotcha.
  items: [
    {kind:'flight', title:'LHR → LIS · TP1359', where:'London → Lisbon',
     zone:'Europe/London', start:'2026-05-04T08:35:00Z', end:'2026-05-04T11:20:00Z',
     who:'all', detail:'TAP Air Portugal · seats 12A–12D · 1 checked bag each'},

    {kind:'stay', title:'Alfama apartment', where:'Lisbon',
     zone:'Europe/Lisbon', start:'2026-05-04T14:00:00Z', end:'2026-05-08T10:00:00Z',
     who:'all', detail:'4 nights · Rua dos Remédios · self check-in, code sent by host'},

    {kind:'activity', title:'Fado dinner', where:'Clube de Fado, Lisbon',
     zone:'Europe/Lisbon', start:'2026-05-05T19:30:00Z', end:'2026-05-05T22:00:00Z',
     who:'all', detail:'Booked · table for 4 · arrive 15 min early'},

    {kind:'train', title:'Lisbon → Lagos', where:'Oriente station',
     zone:'Europe/Lisbon', start:'2026-05-08T11:09:00Z', end:'2026-05-08T14:52:00Z',
     who:'all', detail:'Alfa Pendular · coach 2 · booking KJ42P',
     warn:'Apartment checkout is 10:00 — leave time to cross the city.',
     qr:''},

    {kind:'stay', title:'Lagos guesthouse', where:'Lagos, Algarve',
     zone:'Europe/Lisbon', start:'2026-05-08T15:00:00Z', end:'2026-05-12T10:00:00Z',
     who:'all', detail:'4 nights · breakfast included'},

    {kind:'activity', title:'Benagil cave boat trip', where:'Lagos marina',
     zone:'Europe/Lisbon', start:'2026-05-09T09:00:00Z', end:'2026-05-09T11:30:00Z',
     who:'AB', detail:'2h 30m · paid in full'},

    {kind:'car', title:'Pick up the car', where:'Lagos station',
     zone:'Europe/Lisbon', start:'2026-05-10T09:00:00Z', end:'2026-05-10T09:30:00Z',
     who:'all', detail:'Compact · unlimited km · conf 4471902'},

    {kind:'flight', title:'FAO → LHR · TP1364', where:'Faro → London',
     zone:'Europe/Lisbon', start:'2026-05-12T13:40:00Z', end:'2026-05-12T16:25:00Z',
     who:'all', detail:'TAP Air Portugal · drop the car at the airport first'},
  ],

  // Optional map pins [label, lat, lng]. Remove the array to drop the map.
  places: [
    ['Lisbon', 38.7223, -9.1393],
    ['Lagos',  37.1028, -8.6741],
    ['Faro',   37.0194, -7.9304],
  ],

  // Optional quick links / numbers. Remove to drop the section.
  links: [
    {name:'Apartment host', desc:'WhatsApp preferred', url:'tel:+351000000000'},
    {name:'Car hire desk',  desc:'Lagos station · 08:00–19:00', url:'tel:+351000000001'},
  ],
};
</script>
<!-- ===================================================================== -->
<!--  END OF EDITABLE SECTION                                              -->
<!-- ===================================================================== -->

<style>
:root{
  --bg:#faf9f7; --surface:#fff; --line:#e6e2db; --text:#1c1a17; --dim:#6b6560;
  --accent:#0f766e; --radius:12px;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14130f;--surface:#1c1a17;--line:#2e2b26;--text:#f2efe9;--dim:#a09a92;--accent:#5eead4}
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:64px}
.wrap{max-width:840px;margin:0 auto;padding:0 18px}
header.hero{padding:28px 0 6px}
h1{font-size:26px;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:14px;margin-top:4px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:26px 0 10px;font-weight:600}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.bar select,.search{font:inherit;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
.search{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.card.is-now{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.09)}
.card.is-past{opacity:.45}
.row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.title{font-weight:600;font-size:15.5px}
.where{color:var(--dim);font-size:13px}
.time{font-family:var(--mono);font-size:13px;font-weight:600}
.zone{font-family:var(--mono);font-size:11px;color:var(--dim)}
.detail{color:var(--dim);font-size:13px;margin-top:6px}
.warn{margin-top:8px;font-size:12.5px;background:#fef3c7;border:1px solid #fde68a;color:#7c2d12;padding:7px 10px;border-radius:8px}
.pill{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.pill.live{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.soon{background:rgba(15,118,110,.09);border-color:rgba(15,118,110,.3);color:var(--accent)}
.empty{color:var(--dim);font-size:14px;padding:10px 2px}
.daylabel{font-size:12px;font-weight:600;color:var(--dim);margin:18px 0 6px}
.qrbtn{margin-top:9px;font:inherit;font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.qrwrap{margin-top:10px}
.qrwrap img{width:180px;height:180px;border:1px solid var(--line);border-radius:8px;background:#fff}
#map{height:260px;border:1px solid var(--line);border-radius:var(--radius)}
a.card{display:block;text-decoration:none;color:inherit}
.preview{background:#1c1a17;color:#f5f3ef;padding:9px 0;font-size:13px}
.preview input{font:inherit;font-size:13px;padding:4px 8px;border-radius:7px;border:1px solid #3a3733;background:#2a2723;color:#f5f3ef}
</style>
</head>
<body>

<!-- Authoring aid: open with ?preview to get a "pretend it's..." clock and
     check what Now/Next looks like on any day. Invisible to normal visitors. -->
<div class="preview" id="preview" hidden>
  <div class="wrap">Preview clock <input type="datetime-local" id="pv"> <span id="pvnote"></span></div>
</div>

<div class="wrap">
  <header class="hero">
    <h1 id="t"></h1>
    <div class="sub" id="s"></div>
    <div class="bar" id="bar"></div>
  </header>

  <h2>Right now</h2>
  <div id="now"></div>

  <h2>Next</h2>
  <div id="next"></div>

  <h2>Everything</h2>
  <input class="search" id="q" placeholder="Search the trip…" autocomplete="off">
  <div id="all"></div>

  <div id="mapsec" hidden><h2>Where</h2><div id="map"></div></div>
  <div id="linksec" hidden><h2>Numbers &amp; links</h2><div id="links"></div></div>
</div>

<script>
const KIND={
  flight:{label:'Flight',icon:'✈'}, train:{label:'Train',icon:'🚆'},
  ferry:{label:'Ferry',icon:'⛴'},   car:{label:'Car',icon:'🚗'},
  stay:{label:'Stay',icon:'🏠'},    activity:{label:'Activity',icon:'✦'},
  event:{label:'Event',icon:'◆'},
};
const HAS_PEOPLE = TRIP.people && Object.keys(TRIP.people).length > 0;
const ITEMS = (TRIP.items||[]).slice().sort((a,b)=>new Date(a.start)-new Date(b.start));
let PERSON='all', AT=null;
const at=()=>AT===null?Date.now():AT;

/* Always format in the item's own zone. There is no "convert everything to my
   timezone" mode on purpose: a departure time means the clock at that airport. */
const f=(iso,zone,o)=>new Intl.DateTimeFormat('en-US',Object.assign({timeZone:zone,hour:'numeric',minute:'2-digit',hour12:true},o||{})).format(new Date(iso));
function abbr(iso,zone){try{return new Intl.DateTimeFormat('en-US',{timeZone:zone,timeZoneName:'short'}).formatToParts(new Date(iso)).find(p=>p.type==='timeZoneName').value;}catch(e){return'';}}
const dayKey=(iso,z)=>new Intl.DateTimeFormat('en-CA',{timeZone:z,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso));
const dayLbl=(iso,z)=>new Intl.DateTimeFormat('en-US',{timeZone:z,weekday:'long',month:'short',day:'numeric'}).format(new Date(iso));
function rel(iso){
  const m=Math.round((new Date(iso)-at())/60000); if(m<0)return'';
  if(m<60)return'in '+m+' min';
  const h=Math.round(m/60); if(h<24)return'in '+h+' hr'+(h>1?'s':'');
  const d=Math.round(h/24); return'in '+d+' day'+(d>1?'s':'');
}
const mine=it=>!HAS_PEOPLE||PERSON==='all'||it.who==='all'||!it.who||it.who.includes(PERSON);
const spans=it=>new Date(it.start)<=at()&&at()<new Date(it.end);

function whoPills(it){
  if(!HAS_PEOPLE) return '';
  if(!it.who||it.who==='all') return '<span class="pill">everyone</span>';
  return it.who.split('').map(c=>'<span class="pill">'+((TRIP.people[c]||{}).name||c)+'</span>').join('');
}

function card(it,state){
  const el=document.createElement('div');
  el.className='card'+(state==='now'?' is-now':'')+(state==='past'?' is-past':'');
  const k=KIND[it.kind]||{label:it.kind,icon:'•'};
  const pill = state==='now' ? '<span class="pill live">happening now</span>'
             : state==='next'? '<span class="pill soon">'+rel(it.start)+'</span>' : '';
  // a stay shows a date range; everything else shows one clock time
  const when = it.kind==='stay'
    ? '<span class="time">'+f(it.start,it.zone,{month:'short',day:'numeric'})+' → '+f(it.end,it.zone,{month:'short',day:'numeric'})+'</span>'
    : '<span class="time">'+f(it.start,it.zone)+'</span> <span class="zone">'+abbr(it.start,it.zone)+'</span>';
  el.innerHTML='<div class="row"><span>'+k.icon+'</span><span class="title">'+it.title+'</span>'+
    '<span class="pill">'+k.label+'</span>'+whoPills(it)+pill+'</div>'+
    '<div class="row" style="margin-top:4px">'+when+'<span class="where">· '+(it.where||'')+'</span></div>'+
    (it.detail?'<div class="detail">'+it.detail+'</div>':'')+
    (it.warn?'<div class="warn">⚠ '+it.warn+'</div>':'');
  if(it.qr){                                   // QR card ONLY when one exists
    const b=document.createElement('button');b.className='qrbtn';b.textContent='Show QR';
    const w=document.createElement('div');w.className='qrwrap';w.hidden=true;
    const img=document.createElement('img');img.src=it.qr;img.alt=it.title+' pass';w.appendChild(img);
    b.onclick=()=>{w.hidden=!w.hidden;b.textContent=w.hidden?'Show QR':'Hide QR';};
    el.appendChild(b);el.appendChild(w);
  }
  return el;
}

function render(){
  document.getElementById('t').textContent=TRIP.title||'Itinerary';
  const zone=(ITEMS[0]||{}).zone||'UTC';
  document.getElementById('s').textContent=(TRIP.subtitle?TRIP.subtitle+' · ':'')+
    new Intl.DateTimeFormat('en-US',{timeZone:zone,weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(at()))+
    (AT===null?'':' · preview');

  const list=ITEMS.filter(mine);
  const now=list.filter(spans);
  const next=list.filter(i=>new Date(i.start)>at()).slice(0,2);

  const nh=document.getElementById('now');nh.innerHTML='';
  now.length?now.forEach(i=>nh.appendChild(card(i,'now')))
            :nh.innerHTML='<div class="empty">Nothing scheduled at this moment.</div>';
  const xh=document.getElementById('next');xh.innerHTML='';
  next.length?next.forEach(i=>xh.appendChild(card(i,'next')))
             :xh.innerHTML='<div class="empty">Nothing left — trip complete.</div>';
  renderAll();
}

function renderAll(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const host=document.getElementById('all');host.innerHTML='';
  let day='';
  const list=ITEMS.filter(mine).filter(i=>!q||((i.title+' '+(i.where||'')+' '+(i.detail||'')+' '+(KIND[i.kind]||{}).label).toLowerCase().includes(q)));
  if(!list.length){host.innerHTML='<div class="empty">No matches.</div>';return;}
  list.forEach(i=>{
    const dk=dayKey(i.start,i.zone);
    if(dk!==day){day=dk;const h=document.createElement('div');h.className='daylabel';h.textContent=dayLbl(i.start,i.zone);host.appendChild(h);}
    host.appendChild(card(i,spans(i)?'now':(new Date(i.end)<=at()?'past':'')));
  });
}

// people filter
if(HAS_PEOPLE){
  const sel=document.createElement('select');
  sel.innerHTML='<option value="all">Everyone</option>'+Object.entries(TRIP.people).map(([k,v])=>'<option value="'+k+'">'+v.name+'</option>').join('');
  sel.onchange=e=>{PERSON=e.target.value;render();};
  document.getElementById('bar').appendChild(sel);
}
// links
if((TRIP.links||[]).length){
  document.getElementById('linksec').hidden=false;
  const h=document.getElementById('links');
  TRIP.links.forEach(l=>{const a=document.createElement('a');a.className='card';a.href=l.url||'#';
    a.innerHTML='<div class="title">'+l.name+'</div>'+(l.desc?'<div class="detail">'+l.desc+'</div>':'');h.appendChild(a);});
}
// map (Leaflet loaded only if there are pins)
if((TRIP.places||[]).length){
  document.getElementById('mapsec').hidden=false;
  const css=document.createElement('link');css.rel='stylesheet';
  css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(css);
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
  s.onload=()=>{
    const pts=TRIP.places.map(p=>[p[1],p[2]]);
    const m=L.map('map',{scrollWheelZoom:false});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:18,attribution:'© OpenStreetMap © CARTO'}).addTo(m);
    TRIP.places.forEach(p=>L.circleMarker([p[1],p[2]],{radius:7,color:'#0f766e',fillColor:'#0f766e',fillOpacity:.75}).addTo(m).bindTooltip(p[0],{permanent:true,direction:'right'}));
    pts.length>1?m.fitBounds(pts,{padding:[30,30]}):m.setView(pts[0],10);
  };
  document.body.appendChild(s);
}
// preview clock (?preview)
if(new URLSearchParams(location.search).has('preview')){
  document.getElementById('preview').hidden=false;
  document.getElementById('pvnote').textContent='— authoring aid; visitors never see this';
  document.getElementById('pv').addEventListener('input',e=>{AT=e.target.value?new Date(e.target.value).getTime():null;render();});
}

document.getElementById('q').addEventListener('input',renderAll);
render();
setInterval(()=>{if(AT===null)render();},60000);
</script>
</body>
</html>
