<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Streaming build — simple·host (dev)</title>
<script>(function(){try{var s=localStorage.getItem('sh-theme');document.documentElement.dataset.theme=s||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');}catch(e){document.documentElement.dataset.theme='light';}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#020617;--surface:#0b1222;--surface2:#0f1830;--border:#1e293b;--border-hi:#334155;
  --text:#f1f5f9;--dim:#94a3b8;--faint:#475569;--accent:#22d3ee;--accent2:#67e8f9;
  --user:#1e293b;--ok:#34d399;--err:#fb7185;--on-accent:#020617;
  --font:'JetBrains Mono',ui-monospace,Menlo,monospace;--radius:10px;
}
html[data-theme="light"]{
  --bg:#f7f8fb;--surface:#fff;--surface2:#eef2f8;--border:#e2e8f0;--border-hi:#cbd5e1;
  --text:#0f172a;--dim:#475569;--faint:#94a3b8;--accent:#0891b2;--accent2:#0e7490;
  --user:#eef2f8;--ok:#059669;--err:#e11d48;--on-accent:#fff;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.brand{font-size:13px;font-weight:700;letter-spacing:.3px}
.brand b{color:var(--accent)}
.brand .tag{color:var(--faint);font-weight:500;margin-left:8px}
.hbtns{display:flex;gap:8px;align-items:center}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:8px;height:30px;padding:0 10px;cursor:pointer;font-family:var(--font);font-size:12px}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.keybar{display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--surface2);align-items:center;font-size:12px}
.keybar input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-family:var(--font);font-size:12px}
.wrap{flex:1;display:grid;grid-template-columns:minmax(340px,1fr) 1.2fr;min-height:0}
@media(max-width:820px){.wrap{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane.chat{border-right:1px solid var(--border)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;border-radius:12px;padding:10px 13px}
.msg.user{align-self:flex-end;background:var(--user);border:1px solid var(--border)}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border)}
.msg.err{border-color:var(--err);color:var(--err)}
.stage{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:11px;color:var(--accent);border:1px solid var(--border-hi);border-radius:999px;padding:4px 11px}
.stage .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.inrow{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface)}
.inrow input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 13px;font-family:var(--font);font-size:13px}
.inrow input:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--accent);color:var(--on-accent);border:none;border-radius:10px;padding:0 16px;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.queued{font-size:11px;color:var(--faint);padding:0 16px 8px;background:var(--surface)}
.pane.preview{background:var(--surface2)}
.pv-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--dim)}
.pv-head .right{display:flex;gap:6px}
iframe{flex:1;width:100%;border:none;background:#fff}
.code{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.code pre{flex:1;overflow:auto;margin:0;padding:12px;font-size:11.5px;line-height:1.5;color:var(--dim);white-space:pre-wrap;word-break:break-word}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px;text-align:center;padding:24px}
</style>
</head>
<body>
<header>
  <div class="brand">simple<b>·</b>host <span class="tag">streaming build · /dev</span></div>
  <div class="hbtns">
    <button class="icon-btn" id="code-toggle" onclick="toggleCode()">&lt;/&gt; Code</button>
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">◑</button>
  </div>
</header>

<div class="keybar" id="keybar" hidden>
  <span>API key</span>
  <input id="keyin" type="password" placeholder="paste your simple-host API key to test">
  <button class="icon-btn" onclick="saveKey()">Save</button>
</div>

<div class="wrap">
  <div class="pane chat">
    <div class="msgs" id="msgs"></div>
    <div class="queued" id="queued" hidden></div>
    <form class="inrow" onsubmit="return send(event)">
      <input id="in" placeholder="Describe the site you want…" autocomplete="off">
      <button class="btn" id="sendbtn" type="submit">Send</button>
    </form>
  </div>
  <div class="pane preview">
    <div class="pv-head">
      <span id="pv-label">Preview</span>
      <div class="right">
        <button class="icon-btn" id="copy-btn" onclick="copyCode()" hidden>Copy</button>
        <button class="icon-btn" id="dl-btn" onclick="downloadCode()" hidden>Download</button>
      </div>
    </div>
    <iframe id="frame" title="preview" sandbox="allow-scripts allow-popups"></iframe>
    <div class="code" id="codepane" hidden><pre id="codepre"></pre></div>
    <div class="empty" id="empty">Your site will render here as it builds.</div>
  </div>
</div>

<script>
var apiKey = localStorage.getItem('apiKey') || '';
var messages = [];       // conversation for the model
var currentHTML = '';    // latest full HTML (for incremental edits)
var busy = false;
var queue = [];
var showCode = false;

if (!apiKey) document.getElementById('keybar').hidden = false;

function saveKey(){ var v=document.getElementById('keyin').value.trim(); if(v){ apiKey=v; localStorage.setItem('apiKey',v); document.getElementById('keybar').hidden=true; } }
function toggleTheme(){ var t=document.documentElement.dataset.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=t; try{localStorage.setItem('sh-theme',t);}catch(e){} }
function toggleCode(){ showCode=!showCode; document.getElementById('codepane').hidden=!showCode; document.getElementById('frame').hidden=showCode; document.getElementById('empty').hidden = showCode || !!currentHTML; document.getElementById('pv-label').textContent = showCode?'Code':'Preview'; }

function el(cls, text){ var d=document.createElement('div'); d.className=cls; if(text!=null) d.textContent=text; document.getElementById('msgs').appendChild(d); scroll(); return d; }
function scroll(){ var m=document.getElementById('msgs'); m.scrollTop=m.scrollHeight; }

function paint(){
  var f=document.getElementById('frame');
  document.getElementById('empty').hidden=true;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ f.srcdoc=currentHTML; }); });
  var has=!!currentHTML;
  document.getElementById('copy-btn').hidden=!has;
  document.getElementById('dl-btn').hidden=!has;
}

function copyCode(){ if(navigator.clipboard) navigator.clipboard.writeText(currentHTML); }
function downloadCode(){ var b=new Blob([currentHTML],{type:'text/html'}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='index.html'; a.click(); }

function send(e){
  if(e) e.preventDefault();
  var input=document.getElementById('in');
  var text=input.value.trim();
  if(!text) return false;
  if(!apiKey){ document.getElementById('keybar').hidden=false; return false; }
  input.value='';
  if(busy){ queue.push(text); renderQueue(); return false; }
  run(text);
  return false;
}

function renderQueue(){
  var q=document.getElementById('queued');
  if(queue.length){ q.hidden=false; q.textContent='Queued: '+queue.map(function(t){return '“'+t.slice(0,40)+'”';}).join('  '); }
  else { q.hidden=true; q.textContent=''; }
}

async function run(text){
  busy=true;
  document.getElementById('sendbtn').disabled=true;
  el('msg user', text);
  messages.push({role:'user', content:text});
  var stage=el('stage'); stage.innerHTML='<span class="dot"></span><span>connecting…</span>';
  var bubble=null;         // assistant reply bubble (created on first reply delta)
  var replyText='';
  var htmlBuf='';
  var gotDone=false;
  var codepre=document.getElementById('codepre');

  function setStage(v){ var map={connecting:'connecting…',generating:'thinking…',writing:'writing the page…'}; var s=stage.querySelector('span:last-child'); if(s) s.textContent=map[v]||v; }
  function handle(ev){
    if(ev.type==='stage'){ setStage(ev.value); }
    else if(ev.type==='reply'){ if(!bubble){ if(stage.parentNode)stage.remove(); bubble=el('msg ai',''); } replyText+=ev.delta; bubble.textContent=replyText; scroll(); }
    else if(ev.type==='html'){ htmlBuf+=ev.delta; codepre.textContent=htmlBuf; }
    else if(ev.type==='done'){ gotDone=true; if(!bubble){ if(stage.parentNode)stage.remove(); bubble=el('msg ai',''); } if(ev.reply) bubble.textContent=ev.reply; replyText=ev.reply||replyText; if(ev.html){ currentHTML=ev.html; codepre.textContent=currentHTML; paint(); } }
    else if(ev.type==='error'){ throw new Error(ev.message||'stream error'); }
  }

  try{
    var res=await fetch('/v1/generate/stream',{method:'POST',headers:{'X-API-Key':apiKey,'content-type':'application/json'},body:JSON.stringify({messages:messages, html:currentHTML})});
    if(!res.ok){ var er=await res.json().catch(function(){return{};}); throw new Error(er.error||('HTTP '+res.status)); }
    var reader=res.body.getReader(), dec=new TextDecoder(), buf='';
    while(true){
      var r=await reader.read();
      if(r.done) break;
      buf+=dec.decode(r.value,{stream:true});
      var i;
      while((i=buf.indexOf('\n'))>=0){
        var line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
        if(line.slice(0,5)!=='data:') continue;
        var data=line.slice(5).trim(); if(!data) continue;
        var ev; try{ ev=JSON.parse(data); }catch(_){ continue; }
        handle(ev);
      }
    }
    // Flush a trailing event that arrived without a final newline.
    var tail=buf.trim();
    if(tail.slice(0,5)==='data:'){ try{ handle(JSON.parse(tail.slice(5).trim())); }catch(_){} }
    if(stage.parentNode) stage.remove();
    // No terminating "done" → the stream was cut; don't record a half build as success.
    if(!gotDone) throw new Error('the response was cut short — please try again');
    messages.push({role:'assistant', content:replyText||'Done.'});
  }catch(err){
    if(stage.parentNode) stage.remove();
    el('msg ai err', 'Error: '+(err.message||err));
    messages.pop(); // drop the failed user turn from model context
  }finally{
    busy=false;
    document.getElementById('sendbtn').disabled=false;
    document.getElementById('in').focus();
    if(queue.length){ var next=queue.shift(); renderQueue(); run(next); }
  }
}
</script>
</body>
</html>
