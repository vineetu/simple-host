<header class="sh-header">
    <div class="sh-bar">
      <a class="sh-logo" href="{{.Base}}/">simple<b>·</b>host</a>
      <nav class="sh-nav" aria-label="Main">
        {{- if .HackHome}}
        <a href="https://simple-host.app/">Simple Host</a>
        {{- else}}
        <a href="{{.Base}}/"{{if eq .Current "home"}} aria-current="page"{{end}}>Home</a>
        {{- end}}
        <a href="{{.Base}}/install.html"{{if eq .Current "install"}} aria-current="page"{{end}}>Get started</a>
      </nav>
      <a class="sh-signin" id="dash-link" href="{{.Base}}/dashboard"{{if eq .Current "dashboard"}} aria-current="page"{{end}}>Sign in</a>
      <button class="sh-signout" type="button" data-sh-signout>Sign out</button>
      <div class="sh-acct">
        <button class="sh-signin sh-acct-btn" id="sh-acct-btn" type="button" aria-expanded="false" aria-controls="sh-acct-menu">Your sites<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="sh-acct-menu" id="sh-acct-menu" hidden>
          <a href="{{.Base}}/dashboard">Your sites</a>
          <button type="button" data-sh-signout>Sign out</button>
        </div>
      </div>
      <button class="sh-theme" id="theme-toggle" type="button" aria-label="Toggle theme"></button>
    </div>
  </header>
  <script>
    (function () {
      var root = document.documentElement;
      var header = document.querySelector('.sh-header');

      // ---- Signed in or out, on every page ----------------------------------
      // Signed in means this browser holds the account's API key under
      // localStorage 'apiKey' (the dashboard, the owner app, admin, analytics
      // and the connector consent page all read that one key). Signed in, the
      // header shows "Your sites" and "Sign out"; on a phone the two fold into
      // one "Your sites" menu so the bar stays on one line.
      var hasKey = function () { try { return !!localStorage.getItem('apiKey'); } catch (e) { return false; } };
      var dash = document.getElementById('dash-link');
      var acctBtn = document.getElementById('sh-acct-btn');
      var acctMenu = document.getElementById('sh-acct-menu');
      var setMenu = function (open) {
        acctMenu.hidden = !open;
        acctBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      };
      var render = function () {
        var on = hasKey();
        header.classList.toggle('sh-authed', on);
        dash.textContent = on ? 'Your sites' : 'Sign in';
        if (!on) setMenu(false);
        return on;
      };
      // Pages call this after they sign in, or after the server rejects a key.
      window.shAuthRender = render;
      var shownSignedIn = render();

      // Sign out forgets everything that signs this browser in: the key and
      // any half-finished sign-in (the nonces that bind an emailed link or a
      // Google return to this browser). There is no server session to end:
      // the apex sets no sign-in cookie. Other tabs hear the storage change.
      // Display preferences (theme, collapsed sections) stay.
      window.shSignOut = function () {
        ['apiKey', 'sh-email-nonce'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
        ['sh-google-nonce', 'sh-connect-nonce'].forEach(function (k) { try { sessionStorage.removeItem(k); } catch (e) {} });
        // replace, not assign: Back must not return to a page full of the account.
        location.replace('{{.Base}}/');
      };
      Array.prototype.forEach.call(header.querySelectorAll('[data-sh-signout]'), function (b) {
        b.addEventListener('click', function () { window.shSignOut(); });
      });

      acctBtn.addEventListener('click', function () { setMenu(acctMenu.hidden); });
      document.addEventListener('click', function (e) {
        if (!acctMenu.hidden && !acctBtn.parentNode.contains(e.target)) setMenu(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !acctMenu.hidden) { setMenu(false); acctBtn.focus(); }
      });

      // Signed out (or in) somewhere else — another tab, or this page coming
      // back from the back/forward cache. A page that was showing the account
      // reloads into its signed-out state; any other page just flips its header.
      var sync = function () {
        var was = shownSignedIn;
        shownSignedIn = render();
        if (was && !shownSignedIn &&
            (document.body.classList.contains('authed') || document.body.hasAttribute('data-sh-account'))) {
          location.reload();
        }
      };
      window.addEventListener('storage', function (e) {
        if (e.key === 'apiKey' || e.key === null) sync();
      });
      window.addEventListener('pageshow', function (e) { if (e.persisted) sync(); });
      // Theme toggle. The initial theme is set pre-paint by the head partial.
      var btn = document.getElementById('theme-toggle');
      var SUN = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5.1 5.1l1.4 1.4M17.5 17.5l1.4 1.4M18.9 5.1l-1.4 1.4M6.5 17.5l-1.4 1.4"/></svg>';
      var MOON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
      var paint = function () { btn.innerHTML = root.dataset.theme === 'dark' ? SUN : MOON; };
      var set = function (t) {
        root.dataset.theme = t;
        paint();
        try { document.dispatchEvent(new CustomEvent('sh-theme', { detail: t })); } catch (e) {}
      };
      paint();
      btn.addEventListener('click', function () {
        var t = root.dataset.theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('sh-theme', t); } catch (e) {}
        set(t);
      });
      // Another open tab changed it.
      window.addEventListener('storage', function (e) {
        if (e.key === 'sh-theme' && e.newValue) set(e.newValue);
      });
      // Follow the OS live, but only while the visitor has not picked one.
      if (window.matchMedia) {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var follow = function (e) {
          try { if (localStorage.getItem('sh-theme')) return; } catch (_) {}
          set(e.matches ? 'dark' : 'light');
        };
        if (mq.addEventListener) mq.addEventListener('change', follow);
        else if (mq.addListener) mq.addListener(follow);
      }
    })();
  </script>
