<header class="sh-header">
    <div class="sh-bar">
      <a class="sh-logo" href="{{.Base}}/">simple<b>·</b>host</a>
      <nav class="sh-nav" aria-label="Main">
        {{- if .HackHome}}
        <a href="https://simple-host.app/">Simple Host</a>
        {{- else}}
        <a href="{{.Base}}/"{{if eq .Current "home"}} aria-current="page"{{end}}>Home</a>
        {{- end}}
        <a href="{{.Base}}/install.html"{{if eq .Current "install"}} aria-current="page"{{end}}>Get started</a>
      </nav>
      <a class="sh-signin" id="dash-link" href="{{.Base}}/dashboard"{{if eq .Current "dashboard"}} aria-current="page"{{end}}>Sign in</a>
      <button class="sh-signout" type="button" data-sh-signout>Sign out</button>
      <div class="sh-acct">
        <button class="sh-signin sh-acct-btn" id="sh-acct-btn" type="button" aria-expanded="false" aria-controls="sh-acct-menu">Your sites<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="sh-acct-menu" id="sh-acct-menu" hidden>
          <a href="{{.Base}}/dashboard">Your sites</a>
          <button type="button" data-sh-signout>Sign out</button>
        </div>
      </div>
      <div class="sh-themes">
        <button class="sh-theme" id="theme-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="sh-theme-menu" aria-label="Theme"></button>
        <div class="sh-theme-menu" id="sh-theme-menu" role="menu" aria-label="Theme" hidden>
          <button type="button" role="menuitemradio" data-sh-theme="system" aria-checked="false">Match my system</button>
          <button type="button" role="menuitemradio" data-sh-theme="light" aria-checked="false">Light</button>
          <button type="button" role="menuitemradio" data-sh-theme="dark" aria-checked="false">Dark</button>
        </div>
      </div>
    </div>
  </header>
  <script>
    (function () {
      var root = document.documentElement;
      var header = document.querySelector('.sh-header');

      // ---- Signed in or out, on every page ----------------------------------
      // Signed in means this browser holds the account's API key under
      // localStorage 'apiKey' (the dashboard, the owner app, admin, analytics
      // and the connector consent page all read that one key). Signed in, the
      // header shows "Your sites" and "Sign out"; on a phone the two fold into
      // one "Your sites" menu so the bar stays on one line.
      var hasKey = function () { try { return !!localStorage.getItem('apiKey'); } catch (e) { return false; } };
      var dash = document.getElementById('dash-link');
      var acctBtn = document.getElementById('sh-acct-btn');
      var acctMenu = document.getElementById('sh-acct-menu');
      var setMenu = function (open) {
        acctMenu.hidden = !open;
        acctBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      };
      var render = function () {
        var on = hasKey();
        header.classList.toggle('sh-authed', on);
        dash.textContent = on ? 'Your sites' : 'Sign in';
        if (!on) setMenu(false);
        return on;
      };
      // Pages call this after they sign in, or after the server rejects a key.
      window.shAuthRender = render;
      var shownSignedIn = render();

      // Sign out first ends this browser's key on the server
      // (POST /v1/me/sign-out deletes the key the request came with), then
      // forgets everything that signs this browser in: the key and any
      // half-finished sign-in (the nonces that bind an emailed link or a
      // Google return to this browser). Other tabs hear the storage change.
      // Display preferences (theme, collapsed sections) stay.
      var signingOut = false;
      window.shSignOut = function () {
        if (signingOut) return;
        signingOut = true;
        var key = null;
        try { key = localStorage.getItem('apiKey'); } catch (e) {}
        var finish = function (warn) {
          ['apiKey', 'sh-email-nonce'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
          ['sh-google-nonce', 'sh-connect-nonce'].forEach(function (k) { try { sessionStorage.removeItem(k); } catch (e) {} });
          if (warn) alert('Signed out of this browser, but the server could not be reached to end its key. If this is a shared computer, sign in again and choose "Sign out everywhere".');
          // replace, not assign: Back must not return to a page full of the account.
          location.replace('{{.Base}}/');
        };
        if (!key) { finish(false); return; }
        // 204 ended it; 401 means it was already dead; 400 is a key the
        // server does not store (the admin key), which has nothing to end.
        fetch('/v1/me/sign-out', { method: 'POST', headers: { 'X-API-Key': key }, keepalive: true })
          .then(function (r) { finish(!(r.ok || r.status === 401 || r.status === 400)); })
          .catch(function () { finish(true); });
      };
      Array.prototype.forEach.call(header.querySelectorAll('[data-sh-signout]'), function (b) {
        b.addEventListener('click', function () { window.shSignOut(); });
      });

      acctBtn.addEventListener('click', function () { setMenu(acctMenu.hidden); });
      document.addEventListener('click', function (e) {
        if (!acctMenu.hidden && !acctBtn.parentNode.contains(e.target)) setMenu(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !acctMenu.hidden) { setMenu(false); acctBtn.focus(); }
      });

      // Signed out (or in) somewhere else — another tab, or this page coming
      // back from the back/forward cache. A page that was showing the account
      // reloads into its signed-out state; any other page just flips its header.
      var sync = function () {
        var was = shownSignedIn;
        shownSignedIn = render();
        if (was && !shownSignedIn &&
            (document.body.classList.contains('authed') || document.body.hasAttribute('data-sh-account'))) {
          location.reload();
        }
      };
      window.addEventListener('storage', function (e) {
        if (e.key === 'apiKey' || e.key === null) sync();
      });
      window.addEventListener('pageshow', function (e) { if (e.persisted) sync(); });
      // Theme: one choice for every page (Match my system, Light or Dark),
      // kept under localStorage 'sh-theme' and applied before first paint by
      // the shared script in partials/theme.html (window.shTheme). This is
      // only the menu that sets it.
      var btn = document.getElementById('theme-toggle');
      var tmenu = document.getElementById('sh-theme-menu');
      var ICONS = {
        light: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5.1 5.1l1.4 1.4M17.5 17.5l1.4 1.4M18.9 5.1l-1.4 1.4M6.5 17.5l-1.4 1.4"/></svg>',
        dark: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
        system: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>'
      };
      var NAMES = { system: 'Match my system', light: 'Light', dark: 'Dark' };
      var items = tmenu.querySelectorAll('[data-sh-theme]');
      var paint = function () {
        var p = window.shTheme ? window.shTheme.pick() : 'system';
        btn.innerHTML = ICONS[p];
        btn.setAttribute('aria-label', 'Theme: ' + NAMES[p]);
        btn.title = 'Theme: ' + NAMES[p];
        Array.prototype.forEach.call(items, function (it) {
          it.setAttribute('aria-checked', it.getAttribute('data-sh-theme') === p ? 'true' : 'false');
        });
      };
      var setTMenu = function (open) {
        tmenu.hidden = !open;
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      };
      paint();
      document.addEventListener('sh-theme', paint);
      btn.addEventListener('click', function () { setTMenu(tmenu.hidden); });
      Array.prototype.forEach.call(items, function (it) {
        it.addEventListener('click', function () {
          if (window.shTheme) window.shTheme.set(it.getAttribute('data-sh-theme'));
          paint();
          setTMenu(false);
          btn.focus();
        });
      });
      document.addEventListener('click', function (e) {
        if (!tmenu.hidden && !btn.parentNode.contains(e.target)) setTMenu(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !tmenu.hidden) { setTMenu(false); btn.focus(); }
      });
    })();
  </script>
