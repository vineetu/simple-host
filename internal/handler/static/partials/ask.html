{{- if .Ask}}<div class="sh-ask" data-page="{{.Ask}}"{{if eq .Ask "enterprise-brief" "enterprise-architecture"}} data-tone="navy"{{end}}>
      <button class="sh-ask-fab" type="button" aria-label="Ask about this page" aria-haspopup="dialog" aria-expanded="false" aria-controls="sh-ask-panel"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/><path d="M9.8 9.5a2.3 2.3 0 0 1 4.4.9c0 1.5-2.2 2-2.2 3.1"/><path d="M12 16.4h.01"/></svg><span>Ask</span></button>
      <div class="sh-ask-panel" id="sh-ask-panel" role="dialog" aria-modal="false" aria-labelledby="sh-ask-title" hidden>
        <div class="sh-ask-head">
          <p class="sh-ask-title" id="sh-ask-title">Ask about this page</p>
          <button class="sh-ask-close" type="button" aria-label="Close"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="sh-ask-log" aria-live="polite" aria-relevant="additions text"></div>
        <form class="sh-ask-form" novalidate>
          <label class="sh-ask-label" for="sh-ask-q">Your question</label>
          <div class="sh-ask-row">
            <input class="sh-ask-input" id="sh-ask-q" name="q" type="text" maxlength="500" autocomplete="off" enterkeyhint="send" placeholder="{{if eq .Ask "enterprise-brief" "enterprise-architecture"}}For example: which sign-in providers work?{{else if eq .Ask "features"}}For example: can a page keep RSVPs private?{{else}}For example: where is saved data kept?{{end}}">
            <button class="sh-ask-send" type="submit">Ask</button>
          </div>
        </form>
        <p class="sh-ask-note">Answers are written by AI from this page, so check anything important.</p>
      </div>
    </div>
    <script src="{{.Base}}/ask.js?v={{.AskJSVersion}}" defer></script>{{end -}}
