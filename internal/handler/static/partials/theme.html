<script>(function(){var d=document.documentElement,K='sh-theme',mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;var pick=function(){try{var s=localStorage.getItem(K);if(s==='light'||s==='dark')return s;}catch(e){}return 'system';};var apply=function(){var p=pick(),t=p==='system'?(mq&&mq.matches?'dark':'light'):p;d.dataset.theme=t;d.dataset.themePick=p;d.style.colorScheme=t;try{document.dispatchEvent(new CustomEvent('sh-theme',{detail:t}));}catch(e){}};window.shTheme={pick:pick,set:function(p){try{if(p==='light'||p==='dark')localStorage.setItem(K,p);else localStorage.removeItem(K);}catch(e){}apply();}};apply();if(mq){var f=function(){if(pick()==='system')apply();};if(mq.addEventListener)mq.addEventListener('change',f);else if(mq.addListener)mq.addListener(f);}window.addEventListener('storage',function(e){if(e.key===K||e.key===null)apply();});window.addEventListener('pageshow',function(e){if(e.persisted)apply();});})();</script>
