<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><!--sh:head--><title>Sign in to continue</title>
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text)}main{width:min(400px,calc(100% - 32px));padding:40px 0;margin:auto}#error{font:16px/1.5 var(--font,system-ui);color:var(--text)}</style>
<!--sh:signin--></head><body><!--sh:header--><main><div id="signin"></div><p id="error" role="alert"></p></main>
<script>
(async function () {
 'use strict';
 const query=new URLSearchParams(location.search), state=query.get('state'), token=query.get('token'), cn=query.get('cn');
 const back='/v1/sso/hop?state='+encodeURIComponent(state);
 history.replaceState({},'',back);
 const hash=async n=>btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(n))))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 async function post(path,body) {
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}), data=await r.json();
  if(!r.ok){const e=new Error(data.error||'Sign-in failed.');Object.assign(e,data,{status:r.status});throw e;}return data;
 }
 function finish(data){localStorage.setItem('apiKey',data.api_key);location.replace(back);}
 try {
  const d=await (await fetch('/v1/auth/oauth/providers')).json();
  const card=SHSignIn.mount(document.getElementById('signin'),{
   title:'Sign in',lead:'to continue to __HOST__',skin:'ink',providers:d.providers||[],oidcLabel:d.oidc_label,emailEnabled:d.email_enabled!==false,
   fine:'By continuing you agree to the Terms and Privacy Policy. The site owner can see the email you sign in with.',
   requestCode:email=>post('/v1/auth',{email:email}),
   verifyCode:async(email,code)=>{const data=await post('/v1/auth/verify',{email,code,name:'dashboard sign-in',sso_state:state});finish(data);return data;},
   startProvider:async name=>{
    const n=Array.from(crypto.getRandomValues(new Uint8Array(32)),x=>x.toString(16).padStart(2,'0')).join('');
    sessionStorage.setItem('sh-sso-provider-nonce',n);
    const ret=location.origin+back+'&cn='+await hash(n);
    location.assign('/v1/auth/oauth/'+encodeURIComponent(name)+'?return_to='+encodeURIComponent(ret));
   }
  });
  if(token){const n=sessionStorage.getItem('sh-sso-provider-nonce');sessionStorage.removeItem('sh-sso-provider-nonce');if(!n||await hash(n)!==cn)throw new Error('Start sign-in again in this browser.');finish(await post('/v1/auth/verify',{token,nonce:n,name:'dashboard sign-in',sso_state:state}));}
 }catch(e){document.getElementById('error').textContent=e.message;}
})();
</script><!--sh:footer--></body></html>
