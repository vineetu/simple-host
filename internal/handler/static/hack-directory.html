<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find a hackathon · Simple Hack</title>
<meta name="description" content="Find public Simple Hack events happening now, coming up and finished.">
<link rel="icon" href="/favicon.svg?v=c" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=c">
<link rel="icon" href="/favicon.ico?v=c" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=c">
<link rel="stylesheet" href="/hack/kit.css">
<link rel="stylesheet" href="/hack/public.css">
</head>
<body>
<div class="pub">

<header class="pub-top">
  <a class="wordmark" href="/">simple<b>·</b>hack</a>
  <span class="grow"></span>
  <a class="btn quiet" href="/events" id="top-account">Your events</a>
</header>

<main>

<header class="hero">
  <h1>Find a hackathon</h1>
  <p>Public events on Simple Hack, from those happening now to past entry showcases.</p>
</header>

<p class="small"><a href="/events/new">Create an event</a></p>
<p class="muted small" id="status" role="status" aria-live="polite">Loading events…</p>

<section id="now">
  <h2 class="section-title">Happening now</h2>
  <div class="list" id="now-list"></div>
</section>

<section id="upcoming">
  <h2 class="section-title">Upcoming</h2>
  <div class="list" id="upcoming-list"></div>
</section>

<section id="past">
  <h2 class="section-title">Past</h2>
  <div class="list" id="past-list"></div>
</section>

</main>

<footer class="pub-foot">
  <span>Made with Simple Hack</span>
  <a href="/privacy.html">Privacy</a>
  <a href="/terms">Terms</a>
  <a href="/report">Report a page</a>
</footer>

</div>
<script>
  (function () {
    // #15/A7: matches ui.js's ui.initials -- only count a "word" that has an
    // actual letter or number, so a separator like "Mock · Voting" doesn't
    // take the "·" as a second initial ("M·" instead of "MV").
    function initials(name) {
      var out = [];
      (name || '').split(/\s+/).forEach(function (w) {
        if (out.length >= 2) return;
        var m = w.match(/[\p{L}\p{N}]/u);
        if (m) out.push(m[0].toUpperCase());
      });
      return out.join('') || '?';
    }
    // #15: the top bar used to always say "Sign in", even for a signed-in
    // visitor. There's no server-side session check on this static page, so
    // this can only go on the one client-side signal available
    // (localStorage.apiKey, the same key api.js reads) -- knowable in a
    // normal browser, not in a private window or with storage blocked. Default
    // stays the neutral "Your events" (set in the markup) for the unknowable
    // case; "Sign in" is shown only once we can confirm there's no key.
    try {
      var hasKey = !!localStorage.getItem('apiKey');
      var top = document.getElementById('top-account');
      if (top && !hasKey) top.textContent = 'Sign in';
    } catch (e) {}
    // Readable ink on the event's own mark colour (same luminance rule as
    // the app shell's event marks): white text on a dark colour, dark text
    // on a light one, so a pale crayon never prints white-on-white.
    function lum(hex) {
      var n = parseInt((hex || 'd15d48').replace('#', ''), 16);
      var f = function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
      return 0.2126 * f((n >> 16) & 255) + 0.7152 * f((n >> 8) & 255) + 0.0722 * f(n & 255);
    }
    function dateParts(iso, zone) {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      try {
        var parts = new Intl.DateTimeFormat('en-GB', { timeZone: zone || 'UTC', day: 'numeric', month: 'short', year: 'numeric' }).formatToParts(d);
        var o = {}; parts.forEach(function (p) { o[p.type] = p.value; });
        return o;
      } catch (_) { return null; }
    }
    function dateRange(startsAt, endsAt, zone) {
      var a = startsAt ? dateParts(startsAt, zone) : null;
      var b = endsAt ? dateParts(endsAt, zone) : null;
      if (!a && !b) return '';
      if (a && !b) return a.day + ' ' + a.month + ' ' + a.year;
      if (b && !a) return b.day + ' ' + b.month + ' ' + b.year;
      if (a.year === b.year && a.month === b.month && a.day === b.day) return a.day + ' ' + a.month + ' ' + a.year;
      if (a.year === b.year && a.month === b.month) return a.day + '–' + b.day + ' ' + a.month + ' ' + a.year;
      if (a.year === b.year) return a.day + ' ' + a.month + '–' + b.day + ' ' + b.month + ' ' + a.year;
      return a.day + ' ' + a.month + ' ' + a.year + '–' + b.day + ' ' + b.month + ' ' + b.year;
    }
    function row(e) {
      var a = document.createElement('a'); a.className = 'r'; a.href = e.url;
      var mark = document.createElement('span'); mark.className = 'ev-mark'; mark.setAttribute('aria-hidden', 'true');
      // #15: this card dropped the event's own icon_url and always drew the
      // colour+initials mark, even for events that have a real icon set
      // (the old card showed it). Show the icon when the data has one, same
      // as hack-event.html's own ev-icon.
      if (e.icon_url) {
        var img = document.createElement('img'); img.src = e.icon_url; img.alt = '';
        mark.appendChild(img);
      } else {
        var color = e.color || '#d15d48';
        mark.style.setProperty('--ev', color);
        mark.style.color = lum(color) > 0.45 ? '#2b2925' : '#fff';
        mark.textContent = initials(e.title);
      }
      var main = document.createElement('span'); main.className = 'main';
      var b = document.createElement('b'); b.textContent = e.title; main.appendChild(b);
      if (e.tagline) { var sub = document.createElement('span'); sub.textContent = e.tagline; main.appendChild(sub); }
      var meta = document.createElement('span'); meta.className = 'meta';
      meta.textContent = dateRange(e.starts_at, e.ends_at, e.time_zone);
      a.appendChild(mark); a.appendChild(main); a.appendChild(meta);
      return a;
    }
    fetch('/v1/hack/directory').then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).then(function (groups) {
      ['now', 'upcoming', 'past'].forEach(function (g) {
        var box = document.getElementById(g + '-list'), rows = groups[g] || [];
        rows.forEach(function (e) { box.appendChild(row(e)); });
        if (!rows.length) { var empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = 'Nothing here yet.'; box.appendChild(empty); }
      });
      document.getElementById('status').textContent = '';
    }).catch(function () { document.getElementById('status').textContent = 'Could not load events. Try again soon.'; });
  })();
</script>
</body>
</html>
