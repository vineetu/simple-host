<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Not found · simple·host</title>
  <!--sh:head-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    /* Tokens, base type and the header/footer live in /site.css. This page's
       body stays in the mono face until it is restyled. */
    :root { --font: 'JetBrains Mono', ui-monospace, Menlo, monospace; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      display: flex;
      flex-direction: column;
    }

    .container { max-width: 720px; margin: 0 auto; padding: 0 24px; width: 100%; }

    .nf-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }
    .nf-card { max-width: 460px; }

    .nf-code {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 96px;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--accent);
      margin-bottom: 20px;
    }
    .nf-msg {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 10px;
    }
    .nf-sub {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .btn-primary {
      display: inline-block;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      padding: 10px 20px;
      cursor: pointer;
      background: var(--accent);
      color: var(--on-accent);
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    @media (max-width: 480px) { .nf-code { font-size: 72px; } }
  </style>
</head>
<body>
  <!--sh:header-->

  <div class="nf-wrap">
    <div class="nf-card">
      <div class="nf-code">404</div>
      <h1 class="nf-msg">__SH_MESSAGE__</h1>
      <p class="nf-sub">__SH_SUBTEXT__</p>
      <a class="btn-primary" href="__SH_BACKLINK_URL__">__SH_BACKLINK_LABEL__</a>
    </div>
  </div>

  <!--sh:footer-->

</body>
</html>
