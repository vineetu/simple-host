<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Not found · simple·host</title>
  <!--sh:head-->
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }

    .nf-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 20px;
      text-align: center;
    }
    .nf-card { max-width: 480px; }

    .nf-code {
      font-weight: 700;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.1;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      margin: 0 0 12px;
    }
    .nf-msg {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
      color: var(--text);
      margin: 0 0 10px;
    }
    .nf-sub {
      font-size: 17px;
      color: var(--text-secondary);
      margin: 0 0 28px;
    }

    .btn-primary {
      display: inline-block;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      background: var(--accent);
      color: var(--on-accent);
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .btn-primary:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <!--sh:header-->

  <div class="nf-wrap">
    <div class="nf-card">
      <div class="nf-code">404</div>
      <h1 class="nf-msg">__SH_MESSAGE__</h1>
      <p class="nf-sub">__SH_SUBTEXT__</p>
      <a class="btn-primary" href="__SH_BACKLINK_URL__">__SH_BACKLINK_LABEL__</a>
    </div>
  </div>

  <!--sh:footer-->

</body>
</html>
