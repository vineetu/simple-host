  /v1/admin/users/{id}:
    delete:
      operationId: deleteEventAccount
      summary: Delete an account and its files (admin only)
      description: Deletes the account, cascading database records, its by-id directory and handle symlink. Admin accounts cannot be deleted. Non-admin callers receive 404.
      tags: [Admin]
      security: [{ apiKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Account deleted }
        '400': { description: Cannot delete an admin account }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/users/{id}/key:
    post:
      operationId: reissueEventAccountKey
      summary: Give an account a new key (admin only)
      description: >-
        For a participant who lost their key. Replaces every key the account holds with one new key
        (named "event account") and returns it once. Sites, saved data and connected apps are
        untouched. Admin accounts are refused. Non-admin callers receive 404.
      tags: [Admin]
      security: [{ apiKey: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: New key, shown only here
          content:
            application/json:
              schema:
                type: object
                required: [id, username, api_key]
                properties:
                  id: { type: string, format: uuid }
                  username: { type: string }
                  handle: { type: string }
                  api_key: { type: string }
                  message: { type: string }
        '400': { description: Cannot reissue an admin account's key }
        '409': { description: "account_suspended: re-enable the account first", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/sites/{id}/suspend:
    post:
      operationId: suspendSite
      summary: Take a site down (admin only)
      description: >-
        Takes one site down without deleting anything: every address it has (site host, person
        path, claimed name, custom domain, old content-host links) answers a plain "This site has
        been taken down" page (410), and deploys, rollback, rename, delete, visibility, address
        and origin changes, saved-data and list writes, and public reads of its data are refused
        with 403 `site_suspended`. The owner's key still reads and exports it, and the owner sees
        it as taken down with the reason. POST .../restore puts it back as it was. Non-admin
        callers receive 404.
      tags: [Admin]
      security: [{ apiKey: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300, description: One line; shown to the owner. }
      responses:
        '200': { description: Taken down, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSiteState' } } } }
        '400': { description: "reason_required or reason_too_long", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/sites/{id}/restore:
    post:
      operationId: unsuspendSite
      summary: Put a taken-down site back (admin only)
      description: >-
        Clears the site's own take-down. A site whose owner's account is suspended stays down
        until the account is re-enabled (`suspended_by` says which). Non-admin callers receive 404.
      tags: [Admin]
      security: [{ apiKey: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Restored, content: { application/json: { schema: { $ref: '#/components/schemas/AdminSiteState' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/users/{id}/suspend:
    post:
      operationId: suspendAccount
      summary: Suspend a person (admin only)
      description: >-
        Suspends an account without deleting anything: its API keys, connector tokens, MCP calls
        and visitor sessions are refused with 403 `account_suspended` (the person sees the reason),
        sign-in is refused, connector refresh tokens are refused without being spent, and every
        site of theirs is taken down as with POST /v1/admin/sites/{id}/suspend. POST .../enable
        reverses all of it. Admin accounts cannot be suspended. Non-admin callers receive 404.
      tags: [Admin]
      security: [{ apiKey: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300, description: One line; shown to the person. }
      responses:
        '200': { description: Suspended, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserState' } } } }
        '400': { description: "reason_required, reason_too_long or admin_account", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/users/{id}/enable:
    post:
      operationId: enableAccount
      summary: Re-enable a suspended person (admin only)
      description: >-
        Lifts the account suspension: keys, connected apps and sign-in work again and their sites
        come back, except a site taken down on its own. Non-admin callers receive 404.
      tags: [Admin]
      security: [{ apiKey: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Re-enabled, content: { application/json: { schema: { $ref: '#/components/schemas/AdminUserState' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/admin/export.tar.gz:
    get:
      operationId: exportAllSites
      summary: Download every site as one archive (admin only)
      description: >-
        Streams every site on the instance as one .tar.gz, each under `<handle>/<site>/` in the
        same layout as GET /v1/sites/{sitename}/export.tar.gz: `state.json` (saved data),
        `collections.json` (every list, private ones included) and `files/` (the live version).
        For an organiser keeping every entry before the box is deleted. Non-admin callers receive 404.
      tags: [Admin]
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: The archive
          content:
            application/gzip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-API-Key }
    connector:
      type: oauth2
      description: >-
        Per-person OAuth 2.1 (authorization code; PKCE S256 required for every self-registered
        client). An access token sent as `Authorization: Bearer` acts exactly as that person's
        X-API-Key on every route here. Discovery at /.well-known/oauth-authorization-server.
      flows:
        authorizationCode:
          authorizationUrl: https://simple-host.app/oauth/authorize
          tokenUrl: https://simple-host.app/oauth/token
          refreshUrl: https://simple-host.app/oauth/token
          scopes:
            sites: Publish and manage your sites and their data

  parameters:
    version: { name: version, in: path, required: true, schema: { type: integer, minimum: 1 }, example: 2 }
    path: { name: path, in: path, required: true, description: Relative file path (may contain forward slashes), schema: { type: string }, example: assets/style.css }
    sitename: { name: sitename, in: path, required: true, schema: { type: string }, example: my-cool-site }
    publish: { name: publish, in: query, required: false, schema: { type: boolean, default: true }, description: "false stores the new version without making it live (updates only; a new site's first version always goes live: 400)" }
    coll: { name: coll, in: path, required: true, schema: { type: string }, example: signups }
    csrf: { name: X-SH-CSRF, in: header, required: false, schema: { type: string, enum: ['1'] }, description: Required on cookie-authenticated writes }

  schemas:
    TrafficCounts:
      type: object
      properties:
        views: { type: integer, example: 61 }
        visitors: { type: integer, description: Unique visitors — distinct hashed IPs over this bucket's window, example: 24 }

    TrafficSplit:
      type: object
      description: >-
        One bucket of traffic, split by who was asking. `person` is the audience
        figure; `infra` is the site's own monitoring and is normally far larger
        than either of the other two. `unknown` is non-zero only for days before
        `classified_from`, which were recorded before traffic was classified and
        cannot be broken down after the fact — do not fold it into any of the
        other three.
      properties:
        person: { $ref: '#/components/schemas/TrafficCounts' }
        bot: { $ref: '#/components/schemas/TrafficCounts' }
        infra: { $ref: '#/components/schemas/TrafficCounts' }
        unknown: { $ref: '#/components/schemas/TrafficCounts' }

    APIKey:
      type: object
      required: [id, created_at, last_used_at, current]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: "Where it came from (dashboard sign-in, agent sign-in, event account, replacement key) or the name typed when it was created. Absent on keys issued before names existed." }
        last4: { type: string, description: Last 4 characters of the key, to recognise it. Absent on older keys. }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        current: { type: boolean, description: This is the key the request was made with }

    AuthResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        api_key: { type: string, description: "A new key for this sign-in, starting shk_ (keys issued before 2026-09-27 are bare hex and keep working). Earlier keys keep working until revoked (DELETE /v1/me/keys/{id}) or rotated. Stored only as a hash, so it is shown only here." }
        is_admin: { type: boolean }
        created: { type: boolean, description: true if this verify created the account }

    FilesBody:
      type: object
      required: [files]
      properties:
        files:
          type: object
          additionalProperties: { type: string }
          description: relative path -> file contents (text). `index.html` required.
        files_base64:
          type: object
          additionalProperties: { type: string, format: byte }
          description: relative path -> base64-encoded binary contents. A path cannot also appear in `files`.
      example:
        files:
          index.html: '<!DOCTYPE html><h1>Hello</h1>'
          css/style.css: 'body{font-family:sans-serif}'
        files_base64:
          assets/logo.png: 'iVBORw0KGgoAAAANSUhEUg...'

    Site:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        active_version: { type: integer }
        site_url: { type: string, nullable: true, description: "The link to share: https://<site>.<handle>.simple-host.app/ (briefly https://<handle>.simple-host.app/<site>/ for a brand-new account), or the site's domain when it has one", example: https://my-cool-site.jane.simple-host.app/ }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        visibility: { type: string, enum: [public, unlisted] }
        custom_domain: { type: string, description: "The site's free <name>.simple-host.app address or its own domain, when it has one" }
        domain_status: { type: string, enum: [pending, active, error] }
        deployed_at: { type: string, format: date-time, description: "When the newest version went live (site list only)" }
        domain_last_error: { type: string, description: "Site list only, for a domain that is not active: what the last check found" }
        domain_expires_at: { type: string, format: date-time, description: "Site list only: when an unproven domain binding is released (24 h after binding; absent once DNS points here)" }
        domain_certificate_status: { type: string, enum: [pending, issuing, live, failed], description: "Site list only, for a domain not live yet: its certificate" }
        previous_domain: { type: string, description: "Site list only, for a domain not live yet: the earlier address the site keeps answering at until it is" }
        domain_dns:
          description: "Site list only, for an own domain that is not active: the DNS record that points it here, to add at the registrar"
          type: object
          properties:
            type: { type: string, example: CNAME }
            host: { type: string }
            value: { type: string }
        domain_dns_txt:
          description: "Site list only, for an own domain that is not active: the TXT ownership record to add next to domain_dns (_simple-host.<domain> holding the site's token)"
          type: object
          properties:
            type: { type: string, example: TXT }
            host: { type: string, example: _simple-host.www.example.com }
            value: { type: string, example: sh-0123456789abcdef0123456789abcdef }
        suspended: { type: boolean, description: "Present and true when the operator has taken the site down (on its own or with its owner's account): every address shows a \"taken down\" page and changes are refused until it is restored. Nothing is deleted." }
        suspended_reason: { type: string, description: The operator's one-line reason, when suspended. }
        offline: { type: boolean, description: "Present and true when the owner has taken the site offline (PATCH /v1/sites/{sitename} {\"offline\": true}): every address shows \"This site is offline\" and visitor saves are refused. Nothing is deleted." }
        unpublished_version: { type: integer, description: "Only on a deploy with publish=false: the version stored without going live." }
        preview_url: { type: string, format: uri, description: "Only on a deploy with publish=false: an owner-only link (one hour) showing the stored version." }
        preview_expires_at: { type: string, format: date-time, description: "When preview_url stops working." }
        domain_partner: { type: string, description: "The custom domain's www / bare partner, which forwards to it (see GET .../domain partner_domain)" }
        domain_partner_dns:
          description: "The record that points the partner here too"
          type: object
          properties:
            type: { type: string, example: CNAME }
            host: { type: string }
            value: { type: string }
        domain_partner_status: { type: string, enum: [pending, live, not_set_up] }
        domain_partner_note: { type: string, description: "Why the partner is not set up, when it is not" }
        address_state: { $ref: '#/components/schemas/AddressState' }
        keep: { type: boolean, description: "Site list only: the owner marked the site Keep; it is never flagged as idle (PUT .../keep)" }
        idle_removal_at: { type: string, format: date-time, description: "Site list only: the site had no visits by people and no new version for 90 days and its owner was emailed; it moves to Recently deleted at this time unless it is kept, visited or updated" }

    AddressState:
      type: object
      description: >-
        The account's own site address (https://<site>.<handle>.simple-host.app/) and its
        certificate. On GET /v1/me always (on simple-host.app, once the account has a handle);
        on a site (address_state) only while that site is still at its interim address
        https://<handle>.simple-host.app/<site>/. When the address switches, old links
        redirect, but visitors' sign-ins and what their browser kept for the site start fresh.
      properties:
        state: { type: string, enum: [ready, waiting, failing], description: "ready; waiting (the certificate is queued behind the weekly and daily limits); failing (it could not be issued yet and is retried automatically)" }
        address: { type: string, description: "The own address: on /v1/me the pattern https://<site>.<handle>.simple-host.app/, on a site that site's address" }
        interim_address: { type: string, description: "Where sites are until then (waiting or failing)" }
        ready_by: { type: string, format: date-time, description: "Rough estimate (waiting or failing)" }
        ready_in_hours: { type: integer, description: "The same, in whole hours, at least 1" }
        note: { type: string, description: "A plain sentence to show the person (waiting or failing)" }

    IdleSite:
      type: object
      properties:
        site: { type: string }
        owner: { type: string, description: The owner's email }
        last_activity: { type: string, format: date-time, description: "Latest of: created, last deploy, last visit by a person, last Keep" }
        warned_at: { type: string, format: date-time }

    AdminSiteState:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner: { type: string }
        handle: { type: string }
        site_url: { type: string }
        suspended: { type: boolean }
        suspended_reason: { type: string }
        suspended_by: { type: string, enum: [site, account, ''], description: "Which switch holds it down: its own, or its owner's account" }

    AdminUserState:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        suspended: { type: boolean }
        suspended_reason: { type: string }
        site_count: { type: integer }

    SiteWithNote:
      allOf:
        - { $ref: '#/components/schemas/Site' }
        - type: object
          properties: { note: { type: string } }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: What went wrong, in plain words. The wording may change; branch on `code`. }
        code:
          type: string
          description: >-
            A stable snake_case name for the refusal, present where one status
            has more than one meaning. site_exists (409: this account already
            has a site of that name), domain_taken (409: the address belongs to
            another site or person), invalid_name (400: not 1-63 lowercase
            letters, digits and hyphens), name_reserved (400: reserved by the
            platform), invalid_domain (400: not a domain that can be connected),
            site_quota_reached (403), append_only (409: public list items cannot
            be edited; the owner may still delete them), custom_domain_required (409: the site needs
            its own address first), not_an_object (409: the saved value is not a
            JSON object), private_visitor_only and private_needs_own_domain
            (403), use_custom_domain and visitor_auth_required (401),
            missing_api_key, wrong_auth_header (sent Authorization instead
            of X-API-Key) and invalid_api_key (unknown, revoked or signed-out
            key) (401), csrf_required (403), recently_deleted (409: the name
            belongs to a site in Recently deleted), site_not_deleted (409:
            restore of a live site), confirm_required (400),
            not_found (404, private collections), export_link_invalid (404:
            the download link expired or is not valid), site_suspended (403:
            the operator has taken the site down; changes and public reads of
            its data are refused until it is restored, `reason` says why),
            account_suspended (403: the operator has suspended this account;
            its keys, connected apps and sign-in are refused, `reason` says
            why), site_offline (403: the owner has taken the site offline;
            visitor saves are refused until it is back online, the owner's
            key still writes), preview_read_only (403: a save made from a
            page opened as a version preview), preview_unavailable (409: the
            site has no address of its own to preview on), invalid_request
            (400). New codes may be added.
          example: domain_taken

  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: "Missing or invalid API key — send the X-API-Key header, not Authorization Bearer. The body's code is missing_api_key, wrong_auth_header or invalid_api_key.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Admin access required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: "Conflict: the code says which (site_exists, domain_taken, append_only, custom_domain_required, not_an_object)", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooLarge: { description: Payload too large, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooManyRequests: { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    OriginMismatch: { description: Origin/Referer does not match the site, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    VisitorAuthRequired:
      description: Visitor sign-in required to write (WRITE_AUTH_MODE=on)
      content:
        application/json:
          schema:
            type: object
            required: [error, code, sign_in, retry]
            properties:
              error: { type: string, example: sign-in required to write }
              code: { type: string, example: visitor_auth_required }
              sign_in: { type: string, example: /v1/auth/oauth/providers }
              retry: { type: boolean, example: true }
          example:
            error: sign-in required to write
            code: visitor_auth_required
            sign_in: /v1/auth/oauth/providers
            retry: true
