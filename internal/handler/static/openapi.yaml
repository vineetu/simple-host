    post:
      operationId: requestSiteVisitorEmail
      summary: Request a site-scoped email sign-in code
      description: Origin-gated; sign-in is available only on the site's bound custom domain, unavailable on the apex and shared content host. Uses the shared account
        email-code limiter and site IP limiter. Normalizes and validates email, then
        sends a 6-digit Resend code valid for 15 minutes. Does not create the account
        yet.
      tags:
      - Auth
      security: []
      parameters:
      - &id002
        $ref: '#/components/parameters/sitename'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  example: person@example.com
      responses:
        '202':
          description: Code sent; no dashboard magic link.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                - email
                - expires_in_seconds
                properties:
                  message:
                    type: string
                    enum:
                    - Check your email for a sign-in code.
                  email:
                    type: string
                    format: email
                  expires_in_seconds:
                    type: integer
                    enum:
                    - 900
        '400':
          description: Invalid request, missing fields, apex host, or shared content host (custom_domain_required)
          content:
            application/json:
              schema: &id001
                type: object
                required:
                - error
                properties:
                  error:
                    type: string
                  code:
                    type: string
              example:
                error: sign-in needs a custom domain
                code: custom_domain_required
        '401':
          description: Invalid or expired code; attempt cap reports too many attempts,
            request a new code. Verification only.
          content:
            application/json:
              schema: *id001
              example:
                error: invalid or expired code
                code: invalid_code
        '403':
          description: Origin forbidden or missing CSRF (verification)
          content:
            application/json:
              schema: *id001
              example:
                error: forbidden
        '404':
          description: Site not found
          content:
            application/json:
              schema: *id001
              example:
                error: site not found
        '429':
          description: IP or shared per-email rate limit exceeded
          content:
            application/json:
              schema: *id001
              example:
                error: rate limit exceeded, slow down
        '500':
          description: Internal error or email delivery failed
          content:
            application/json:
              schema: *id001
              example:
                error: internal server error
