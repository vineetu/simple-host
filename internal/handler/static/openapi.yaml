  /v1/admin/users/{id}:
    delete:
      operationId: deleteEventAccount
      summary: Delete an account and its files (admin only)
      description: Deletes the account, cascading database records, its by-id directory and handle symlink. Admin accounts cannot be deleted. Non-admin callers receive 404.
      tags: [Admin]
      security: [{ apiKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Account deleted }
        '400': { description: Cannot delete an admin account }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-API-Key }

  parameters:
    sitename: { name: sitename, in: path, required: true, schema: { type: string }, example: my-cool-site }
    coll: { name: coll, in: path, required: true, schema: { type: string }, example: signups }
    csrf: { name: X-SH-CSRF, in: header, required: false, schema: { type: string, enum: ['1'] }, description: Required on cookie-authenticated writes }

  schemas:
    TrafficCounts:
      type: object
      properties:
        views: { type: integer, example: 61 }
        visitors: { type: integer, description: Unique visitors — distinct hashed IPs over this bucket's window, example: 24 }

    TrafficSplit:
      type: object
      description: >-
        One bucket of traffic, split by who was asking. `person` is the audience
        figure; `infra` is the site's own monitoring and is normally far larger
        than either of the other two. `unknown` is non-zero only for days before
        `classified_from`, which were recorded before traffic was classified and
        cannot be broken down after the fact — do not fold it into any of the
        other three.
      properties:
        person: { $ref: '#/components/schemas/TrafficCounts' }
        bot: { $ref: '#/components/schemas/TrafficCounts' }
        infra: { $ref: '#/components/schemas/TrafficCounts' }
        unknown: { $ref: '#/components/schemas/TrafficCounts' }

    AuthResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        api_key: { type: string }
        is_admin: { type: boolean }
        created: { type: boolean, description: true if this verify created the account }

    FilesBody:
      type: object
      required: [files]
      properties:
        files:
          type: object
          additionalProperties: { type: string }
          description: relative path -> file contents (text). `index.html` required.
        files_base64:
          type: object
          additionalProperties: { type: string, format: byte }
          description: relative path -> base64-encoded binary contents. A path cannot also appear in `files`.
      example:
        files:
          index.html: '<!DOCTYPE html><h1>Hello</h1>'
          css/style.css: 'body{font-family:sans-serif}'
        files_base64:
          assets/logo.png: 'iVBORw0KGgoAAAANSUhEUg...'

    Site:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        active_version: { type: integer }
        site_url: { type: string, nullable: true, example: https://my-cool-site.simple-host.app }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SiteWithNote:
      allOf:
        - { $ref: '#/components/schemas/Site' }
        - type: object
          properties: { note: { type: string } }

    Error:
      type: object
      properties: { error: { type: string } }

  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: "Missing or invalid API key — send the X-API-Key header, not Authorization Bearer", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Admin access required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Site name already exists, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooLarge: { description: Payload too large, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooManyRequests: { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    OriginMismatch: { description: Origin/Referer does not match the site, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    VisitorAuthRequired:
      description: Visitor sign-in required to write (WRITE_AUTH_MODE=on)
      content:
        application/json:
          schema:
            type: object
            required: [error, code, sign_in, retry]
            properties:
              error: { type: string, example: sign-in required to write }
              code: { type: string, example: visitor_auth_required }
              sign_in: { type: string, example: /v1/auth/oauth/providers }
              retry: { type: boolean, example: true }
          example:
            error: sign-in required to write
            code: visitor_auth_required
            sign_in: /v1/auth/oauth/providers
            retry: true
