      summary: Atomically update per-site state (v3, by handle)
      description: >-
        Apply one or more atomic operations so concurrent writers never clobber.
        Origin-gated. On the shared content host (sites.simple-host.app) writes are open: any page can save without sign-in or key, and the data can be changed by anyone. On a site's bound custom domain writes need a visitor session (`X-SH-CSRF: 1`) or any account's `X-API-Key`; a key is accepted anywhere except on the shared host of a site that has a domain bound, which takes no writes at all (401 use_custom_domain). WRITE_AUTH_MODE=log/off and allow_anonymous_writes retain their compatibility exceptions. Invalid keys return 401 with {error: "invalid API key", code: "invalid_api_key"}. Ops — `set` (path,value), `inc` (path,by),
        `append` (path,value), `remove` (path), `removeWhere` (path,match).
        v3 user-scoped, path-model-canonical variant: resolves the site by
        (handle -> user_id) + (user_id, name).
      tags: [State]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string }, description: "the site owner's URL-safe handle" }
        - { $ref: '#/components/parameters/sitename' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  items:
                    type: object
                    properties:
                      op: { type: string, enum: [set, inc, append, remove, removeWhere] }
                      path: { type: string, example: 'counters.visits' }
                      value: {}
                      by: { type: number }
                      match: { type: object }
              example: { ops: [ { op: inc, path: count, by: 1 }, { op: append, path: items, value: { id: 'x' } } ] }
      responses:
        '200': { description: New state, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: {} } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Sign-in required on a custom domain (visitor_auth_required), invalid account API key (invalid_api_key), or a shared-host write to a site that has a custom domain bound (use_custom_domain, with the domain in `domain`) — such a site lives only on its own domain, and its shared-host API takes no writes for it, key or not; use the apex (`https://simple-host.app/v1/...`, key) or the domain's own `/v1/` (key or session). Reads on the shared host stay public. Never returned for a site that has no domain.
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string }, code: { type: string }, sign_in: { type: string }, retry: { type: boolean }, domain: { type: string, description: The site's bound custom domain (with code use_custom_domain) } } }
              examples:
                invalidKey: { value: { error: "invalid API key", code: invalid_api_key } }
                signIn: { value: { error: "sign-in required to write", code: visitor_auth_required, sign_in: /v1/auth/oauth/providers, retry: true } }
                useCustomDomain: { value: { error: "this site saves on its own domain", code: use_custom_domain, domain: recipes.brand.com } }
        '403': { $ref: '#/components/responses/OriginMismatch' }

  /v1/u/{handle}/sites/{sitename}/collections/{coll}:
    post:
      operationId: postCollectionByHandle
      summary: Append an item to a collection (v3, by handle)
      description: >-
        Append-only list (O(1) insert). For signups, RSVPs, submissions.
        Origin-gated. On the shared content host (sites.simple-host.app) writes are open: any page can save without sign-in or key, and the data can be changed by anyone. On a site's bound custom domain writes need a visitor session (`X-SH-CSRF: 1`) or any account's `X-API-Key`; a key is accepted anywhere except on the shared host of a site that has a domain bound, which takes no writes at all (401 use_custom_domain). WRITE_AUTH_MODE=log/off and allow_anonymous_writes retain their compatibility exceptions. Invalid keys return 401 with {error: "invalid API key", code: "invalid_api_key"}. Each item ≤ 64 KB.
        v3 user-scoped, path-model-canonical variant: resolves the site by
        (handle -> user_id) + (user_id, name).
      tags: [Collections]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string }, description: "the site owner's URL-safe handle" }
        - { $ref: '#/components/parameters/sitename' }
        - { $ref: '#/components/parameters/coll' }
        - { $ref: '#/components/parameters/csrf' }
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: Item appended }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Sign-in required on a custom domain (visitor_auth_required), invalid account API key (invalid_api_key), or a shared-host write to a site that has a custom domain bound (use_custom_domain, with the domain in `domain`) — such a site lives only on its own domain, and its shared-host API takes no writes for it, key or not; use the apex (`https://simple-host.app/v1/...`, key) or the domain's own `/v1/` (key or session). Reads on the shared host stay public. Never returned for a site that has no domain.
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string }, code: { type: string }, sign_in: { type: string }, retry: { type: boolean }, domain: { type: string, description: The site's bound custom domain (with code use_custom_domain) } } }
              examples:
                invalidKey: { value: { error: "invalid API key", code: invalid_api_key } }
                signIn: { value: { error: "sign-in required to write", code: visitor_auth_required, sign_in: /v1/auth/oauth/providers, retry: true } }
                useCustomDomain: { value: { error: "this site saves on its own domain", code: use_custom_domain, domain: recipes.brand.com } }
        '403': { $ref: '#/components/responses/OriginMismatch' }
    get:
      operationId: getCollectionByHandle
      summary: List items in a collection (v3, by handle)
      description: >-
        Newest-first, paginated. Origin-gated (no API key) for the site's own
        page, or owner/admin API key for the dashboard. Writes (POST) are open on the shared host; on a custom domain they need a visitor session with X-SH-CSRF or any valid account X-API-Key (a key is accepted anywhere except on the shared host of a site that has a domain bound, which takes no writes at all — 401 use_custom_domain). Origin gating still applies.
        v3 user-scoped, path-model-canonical variant: resolves the site by
        (handle -> user_id) + (user_id, name).
      tags: [Collections]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string }, description: "the site owner's URL-safe handle" }
        - { $ref: '#/components/parameters/sitename' }
        - { $ref: '#/components/parameters/coll' }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: before, in: query, required: false, schema: { type: string }, description: cursor for the next page }
      responses:
        '200':
          description: Items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
        '403': { $ref: '#/components/responses/OriginMismatch' }

  /v1/sites/{sitename}/allow-anonymous-writes:
    put:
      operationId: putAllowAnonymousWrites
      summary: Admin override — allow anonymous writes on one site
      description: >-
        Sets `sites.allow_anonymous_writes`. Admin (`ADMIN_API_KEY`) only. Default
        is false. When `WRITE_AUTH_MODE=on` and this flag is true, anonymous
        writes to this site succeed and are logged with `outcome=overridden`.
        No `/v1/u/{handle}/…` twin.
      tags: [Sites]
      security: [{ apiKey: [] }]
      parameters: [ { $ref: '#/components/parameters/sitename' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow]
              properties: { allow: { type: boolean } }
            example: { allow: true }
      responses:
        '200':
          description: Flag updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  site: { type: string }
                  allow_anonymous_writes: { type: boolean }
              example: { site: wedding, allow_anonymous_writes: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sites/{sitename}/allowed-origins:
    put:
      operationId: putSitesBySitenameAllowedOrigins
      summary: Allow external origins to use this site's backend
      description: >-
        Whitelist extra origins (scheme://host, no path) that may call this
        site's state/collections API cross-origin — so a page hosted anywhere
        (external hosting, Netlify, …) can use the site as its backend for comments,
        feedback, counters, and forms. Replaces the whole list (max 20). Owner
        only. Same Origin-gated trust model as same-site calls: data stays
        public to the page's audience; never store secrets.
      tags: [State]
      security: [{ apiKey: [] }]
      parameters: [ { $ref: '#/components/parameters/sitename' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origins]
              properties:
                origins:
                  type: array
                  maxItems: 20
                  items: { type: string, example: "https://username.github.io" }
      responses:
        '200':
          description: Allowlist replaced
          content:
            application/json:
              schema:
                type: object
                properties:
                  site: { type: string }
                  allowed_origins: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/sites/{sitename}/domain:
    post:
      operationId: postSitesBySitenameDomain
      summary: Bind a custom domain to this site
      description: >-
        Bind ONE custom domain to the site (status starts as `pending`). Returns
        the DNS CNAME record the owner must create (host → platform CNAME
        target). Once DNS points at us, the operator issues the certificate and the
        domain is served at its root. Until first verified, a binding is provisional:
        another site can take it over, and it expires after 24 hours from binding.
        A domain verified at least once stays exclusive even if later checks fail.
        Hijacking the platform zone is rejected. Owner only (API key).
      tags: [Custom domains]
      security: [{ apiKey: [] }]
      parameters: [ { $ref: '#/components/parameters/sitename' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, example: www.example.com }
      responses:
        '200':
          description: Domain bound (pending DNS)
          content:
            application/json:
              schema:
                type: object
                properties:
                  took_over_from: { type: string, description: Previous holder as handle/site; included only on takeover of an unproven binding, example: alice/blog }
                  domain: { type: string, example: www.example.com }
                  status: { type: string, enum: [pending, active, error], example: pending }
                  dns:
                    type: object
                    properties:
                      type: { type: string, example: CNAME }
                      host: { type: string, example: www.example.com }
                      value: { type: string, example: cname.simple-host.app }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Domain has been verified by another site at least once
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                additionalProperties: false
                properties:
                  error: { type: string, enum: [domain is connected to another site] }
                  code: { type: string, enum: [domain_taken] }
              example: { error: domain is connected to another site, code: domain_taken }
    get:
      operationId: getSitesBySitenameDomain
      summary: Get the custom domain binding for this site
      description: >-
        Returns the bound domain and status, or `{domain:null,status:null}` when
        none is set. Includes the CNAME DNS record to add when a domain is bound.
        Owner only (API key).
      tags: [Custom domains]
      security: [{ apiKey: [] }]
      parameters: [ { $ref: '#/components/parameters/sitename' } ]
      responses:
        '200':
          description: Current domain binding
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string, nullable: true, example: www.example.com }
                  status: { type: string, nullable: true, enum: [pending, active, error] }
                  bound_at: { type: string, format: date-time, description: Binding timestamp stored as domain_bound_at; reset on bind }
                  expires_at: { type: string, format: date-time, description: bound_at plus 24 hours; included only while pending and never verified }
                  verified_at: { type: string, format: date-time, nullable: true }
                  last_error: { type: string }
                  dns:
                    type: object
                    properties:
                      type: { type: string, example: CNAME }
                      host: { type: string }
                      value: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSitesBySitenameDomain
      summary: Unbind the custom domain from this site
      description: Clears the domain binding and removes the serving symlink. Owner only (API key).
      tags: [Custom domains]
      security: [{ apiKey: [] }]
      parameters: [ { $ref: '#/components/parameters/sitename' } ]
      responses:
        '204': { description: Domain unbound }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }


  /v1/admin/api-analytics:
    get:
      operationId: getAdminApiAnalytics
      summary: Per-endpoint API call analytics with caller geo (admin)
      description: >-
        Admin-only. Aggregated API traffic for the retention window: call counts for
        today and the trailing week, today's error count, distinct caller IPs, AI
        build counts, a per-route breakdown and a per-IP breakdown with geo. Served
        from small day-granular aggregate tables, so it is cheap to poll. A signed-in
        non-admin gets 404, not 403 — same rule as /v1/admin/users, so the endpoint
        does not confirm it exists to anyone who may not use it.
      tags: [Admin]
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: Aggregated API analytics for the retention window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  calls_today: { type: integer }
                  calls_week: { type: integer }
                  errors_today: { type: integer }
                  ips_today: { type: integer }
                  ai_builds_today: { type: integer }
                  ai_builds_week: { type: integer }
                  retention_days: { type: integer }
                  routes:
                    type: array
                    items: { type: object }
                  ips:
                    type: array
                    items: { type: object }
        '401': { description: Not signed in }
        '404': { description: Signed in but not an admin }
  /v1/events:
    get:
      operationId: listEventDomains
      summary: List the event hostnames you have claimed
      description: Returns every event hostname claimed by the calling account, with the server address it points at and when the claim expires.
      tags: [Events]
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: Claimed event hostnames
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    description: The event domains this instance can create names under. Ask for these rather than assuming; an instance may offer none.
                    items: { type: string }
                    example: [simple-hack.app]
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        host: { type: string, example: stanford-cs-2026.simple-host.app }
                        content_host: { type: string, example: sites.stanford-cs-2026.simple-host.app }
                        ip: { type: string, example: 85.9.193.170 }
                        expires_at: { type: string, format: date-time }
    post:
      operationId: claimEventDomain
      summary: Claim two hostnames for an event, pointing at your own server
      description: >-
        Creates <name>.<domain> and sites.<name>.<domain> as A records at the
        given public IPv4 address, so a hackathon organiser never touches a
        registrar. The two hostnames are separate on purpose: participant
        content must not share a browser origin with the admin interface.
        Re-claiming a name you already own replaces its records and extends the
        expiry. A name owned by another account answers 409. Claims expire and
        are swept, because a record left pointing at a released cloud address is
        a subdomain takeover.
      tags: [Events]
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ip]
              properties:
                name: { type: string, example: stanford-cs-2026, description: '1 to 40 letters, digits or hyphens. Lowercased. Reserved names are refused.' }
                ip: { type: string, example: 85.9.193.170, description: 'Public IPv4 of the organiser''s server. Private and loopback addresses are refused.' }
                domain: { type: string, example: simple-hack.app, description: 'One of the instance''s configured event domains. Defaults to the first.' }
                move: { type: boolean, description: 'Required to re-point an existing claim at a different address. Without it a re-claim that changes the address is refused, because it would silently move a running event.' }
      responses:
        '201':
          description: Hostnames created
          content:
            application/json:
              schema:
                type: object
                properties:
                  host: { type: string }
                  content_host: { type: string }
                  ip: { type: string }
                  expires_at: { type: string, format: date-time }
        '400': { description: Invalid name, address or domain }
        '409': { description: That event name belongs to another account }
        '502': { description: The DNS provider refused the record }
  /v1/events/{name}:
    delete:
      operationId: releaseEventDomain
      summary: Release an event's hostnames
      description: Removes both DNS records and the claim. Safe to retry. Records are deleted before the row, so a partial failure leaves something that still knows what to clean up.
      tags: [Events]
      security: [{ apiKey: [] }]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: domain, in: query, required: false, schema: { type: string } }
      responses:
        '204': { description: Released }
        '404': { description: Not found, or not yours }
        '502': { description: The DNS provider refused the deletion }

  /v1/admin/capacity:
    get:
      operationId: getCapacityPlan
      summary: How many people this server holds (admin only)
      description: >-
        Sizes the instance against its own filesystem. Given a headcount it returns the largest
        round per-site cap that still holds everyone; given none it sizes for a hundred people.
        The figures are a budget, not a guarantee: only the per-site cap is enforced, while the
        site count and the deploy history are assumptions, and nothing prunes old versions. The
        recommendation and the cap actually in force are reported separately, because this endpoint
        changes neither. Non-admin callers receive 404.
      tags: [Admin]
      security: [{ apiKey: [] }]
      parameters:
        - name: people
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
          description: Expected number of participants. Omit or pass 0 to size for a typical event.
      responses:
        '200':
          description: A sizing plan for this server
          content:
            application/json:
              schema:
                type: object
                required: [recommended, in_force_mb, people_at_current_cap, accounts_in_use, accounts_available, fits_now, fits_recommended]
                properties:
                  in_force_mb: { type: integer, description: Per-site cap this instance is enforcing right now }
                  people_at_current_cap: { type: integer, description: People the server budgets at the cap in force }
                  fits_now: { type: boolean, description: Whether the headcount still fits in the room left on this server. This endpoint changes nothing, so this is the answer that describes the running server }
                  fits_recommended: { type: boolean, description: Whether the headcount would fit at the recommended cap }
                  accounts_in_use: { type: integer, description: Participant accounts this instance already holds }
                  accounts_available: { type: integer, description: How many more it can take. This is the figure POST /v1/admin/users enforces }
                  recommended:
                    type: object
                    description: What the cap would be if it were sized for this headcount. Applying it needs a restart with MAX_ARCHIVE_MB set, or a fresh instance sized at setup.
                    properties:
                      disk_bytes: { type: integer }
                      available_bytes: { type: integer }
                      usable_bytes: { type: integer, description: Available space less the headroom the instance keeps for itself }
                      requested: { type: integer, description: Headcount asked for, 0 when none was given }
                      people: { type: integer, description: Headcount the sizing actually used }
                      site_mb: { type: integer, description: Recommended per-site cap, in megabytes }
                      max_people: { type: integer, description: People this server budgets at that cap }
                      sites_per_person: { type: integer, description: Sites assumed per participant. Assumed, not enforced }
                      kept_versions: { type: integer, description: Deploy history assumed per site. Nothing prunes old versions, so this is an assumption too }
                      total_sites: { type: integer }
                      explanation: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Caller is not an admin
        '500':
          description: This server's free space could not be read
  /v1/admin/users:
    post:
      operationId: createEventAccounts
      summary: Create participant accounts (admin only)
      description: >-
        Creates accounts from emails or a count and optional prefix (default guest), numbered
        team-01 through team-30 for count 30 and prefix team. There is no fixed ceiling: ask for
        ten thousand and you get ten thousand, if the server has room for them. How many that is
        comes from its disk and its per-site limit, and GET /v1/admin/capacity reports it. A
        request beyond that room is refused with 409 and the real number rather than part-filled.
        Existing usernames are skipped with a reason and their keys are never disclosed. Non-admin
        callers receive 404.
      tags: [Admin]
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [emails]
                  additionalProperties: false
                  properties:
                    emails:
                      type: array
                      minItems: 1
                      items: { type: string, format: email }
                - type: object
                  required: [count]
                  additionalProperties: false
                  properties:
                    count: { type: integer, minimum: 1 }
                    prefix: { type: string, default: guest, pattern: '^[a-z0-9-]{1,39}$' }
      responses:
        '201':
          description: Accounts created and existing usernames skipped
          content:
            application/json:
              schema:
                type: object
                required: [created, skipped]
                properties:
                  created:
                    type: array
                    items:
                      type: object
                      properties:
                        username: { type: string }
                        handle: { type: string }
                        api_key: { type: string }
                        display_name: { type: string, nullable: true }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        username: { type: string }
                        reason: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      operationId: getAdminUsers
      summary: List all users + their sites (admin)
      description: >-
        Admin-only. Returns every registered user with their sites nested (API keys
        are never included). Powers the /admin dashboard. A signed-in non-admin gets
        404, not 403 — the endpoint does not confirm it exists to anyone who may not
        use it, and /admin renders that as an ordinary not-found page.
      tags: [Admin]
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: All users with nested sites and totals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_count: { type: integer }
                  site_count: { type: integer }
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        username: { type: string }
                        handle: { type: string }
                        is_admin: { type: boolean }
                        created_at: { type: string, format: date-time }
                        site_count: { type: integer }
                        sites: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: not an admin (deliberately indistinguishable from a route that does not exist) }

  /v1/transcribe:
    post:
      operationId: postTranscribe
      summary: Transcribe a voice recording to text
      description: >-
        Powers the mic button in the builder chat. POST the raw audio bytes as
        the body with the recording's Content-Type — WebM/Opus (Chrome) and
        MP4/AAC (iOS Safari) are both accepted, since browsers disagree and the
        server sniffs the container itself. Speech-to-text runs on this box
        (Moonshine, CPU-only), so audio is never sent to a third party. Returns
        the text for the user to edit and send; it does not start a build.
        Sign-in-gated and rate limited. Absent when the server has no
        TRANSCRIBE_URL configured.
      tags: [AI]
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Transcript. Empty text means no speech was detected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  seconds: { type: number, description: duration of the decoded audio }
                  took_ms: { type: integer }
        '400': { description: no audio, or the container could not be decoded }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: recording too large (25 MB cap) }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/transcribe/ticket:
    post:
      operationId: postTranscribeTicket
      summary: Mint a short-lived ticket for live transcription
      description: >-
        Returns a 60-second signed ticket for the live speech WebSocket at
        `/v1/transcribe/stream`. A browser cannot set headers on a WebSocket
        handshake, so the API key cannot travel the usual way; putting it in the
        URL would land it in access logs and history. The ticket is HMAC-signed,
        carries only the user id and an expiry, and the speech service verifies
        it without ever seeing a key. Absent when the server has no
        TRANSCRIBE_TICKET_SECRET configured.
      tags: [AI]
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: A ticket to use as the `t` query parameter on the WebSocket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
                  expires_in: { type: integer, description: seconds until it expires }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: live transcription is not configured }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/generate:
    post:
      operationId: postGenerate
      summary: Generate a site from a prompt (AI create)
      description: >-
        Powers the home-page "create with AI" chat. Sign-in-gated and rate-limited.
        Runs on a single model backend (the operator's Grok subscription, via a
        local sidecar) with no fallback providers. Send the conversation and
        (optionally) the current HTML and attachments; returns a short reply and,
        when ready, the HTML. Disabled if no model backend is configured.
      tags: [AI]
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties: { role: { type: string, enum: [user, assistant] }, content: { type: string } }
                html: { type: string, description: "current site HTML, for incremental edits" }
                attachments:
                  type: array
                  description: images / text on the latest user turn
                  items:
                    type: object
                    properties:
                      kind: { type: string, enum: [image, document, text] }
                      mediaType: { type: string }
                      name: { type: string }
                      data: { type: string, description: base64 (image/document) }
                      text: { type: string }
      responses:
        '200':
          description: >-
            Returns a jobId; poll /v1/generate/status until it reports done.
            Every backend answers this way. A full build takes a minute or more,
            which is far too long to hold one HTTP response open — browsers drop
            an idle connection long before it finishes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string, description: poll /v1/generate/status with this }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: too many builds already running; retry shortly

  /v1/generate/status:
    get:
      operationId: getGenerateStatus
      summary: Poll an async AI-create job
      description: >-
        Poll the status of a job started by POST /v1/generate. Returns running
        until the build finishes, then done with the reply and HTML (or error
        with a message). Poll every couple of seconds. Sign-in-gated, and a job
        is visible only to the user who started it — anyone else gets 404, as
        does an id that has expired. Jobs are kept 10 minutes after finishing.
      tags: [AI]
      security: [{ apiKey: [] }]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string }, description: jobId from POST /v1/generate }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [running, done, error] }
                  reply: { type: string }
                  html: { type: string }
                  error: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown or expired job }

  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags: [Health]
      responses:
        '200': { description: Alive, content: { application/json: { schema: { type: object, properties: { status: { type: string, example: ok } } } } } }

  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe (DB connected)
      tags: [Health]
      responses:
        '200': { description: Ready, content: { application/json: { schema: { type: object, properties: { status: { type: string, example: ok } } } } } }
        '503': { description: Not ready }

