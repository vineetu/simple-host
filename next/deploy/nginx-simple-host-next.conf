# /etc/nginx/sites-available/simple-host-next — nginx in front of the new Simple Host.
# Replaces these enabled files (moved to /etc/nginx/sites-old/ at the switch, see SWITCH.md):
#   simple-host, simple-host-site, sites-content-host, simple-host-domain-* (11),
#   simple-host-family-*.chhotabreak.com (4), and the hand-made vhosts that proxy to the old
#   service on :8090 once their host is confirmed in the new `hostnames` table:
#   customdomain-agent-deploy.dev, customdomain-call-assist.agent-deploy.dev,
#   paragliding-beginners-map.simple-host.app, ielts.vineetsriram.com, vineetsriram.com,
#   sub-lab.simple-host.app (see SWITCH.md step 5 for each).
#
# How nginx picks a server block, and why unrelated sites are not affected:
#   nginx matches the Host (on 443, the TLS SNI name first) against server_name in this order:
#   exact name, leading wildcard, trailing wildcard, first matching regex, then default_server.
#   Every unrelated site on this box (gods-eye.simple-host.app, sf-fog.*, chhota-staging,
#   console.quotes.chhotabreak.com, trip.chhotabreak.com, orijournal.app, jot-transcribe.com,
#   simple-hack, …) has an EXACT server_name, so it keeps winning over every regex here.
#   sf-fog.lab.simple-host.app (exact) still wins over the site-host regex below.
#   The old `simple-host` file is today's default_server on :80 and :443 (server_name `_`);
#   this file takes that role over, so a host nobody names — a person's own domain or a
#   shared domain — still lands on Simple Host exactly as today. Only one default_server per
#   port may exist: the old `simple-host` file must be disabled in the same reload.
#
# Certificates. A certificate path with a variable is read per handshake by the WORKER
# (user www-data), not by the root master, so a variable path must point at a folder
# www-data can read; /etc/letsencrypt/live is root-only. Hence:
#   - fixed certificates (the simple-host.app and simple-host.site wildcards) are named
#     literally in their own server blocks, loaded once by the master, renewed by certbot.timer;
#   - per-handle *.<handle>.simple-host.app: the existing www-data copies in
#     /etc/nginx/simple-host-site-certs/<handle>/ (refreshed by the certbot deploy hook);
#   - own and shared domains: /srv/simple-host-next/certs/<name>/ (sh-copy copies the carried
#     ones there, the service issues and renews them itself), readable by group www-data.
#   This differs from RUNBOOK's "one catch-all with a map onto /etc/letsencrypt/live", which
#   cannot work with root-only letsencrypt folders.

# ---------- shared ----------

upstream simple_host_next {
    server 127.0.0.1:8095;
    keepalive 32;
}

# Per-handle site hosts: <site>.<handle>.simple-host.app -> <handle>.
map $ssl_server_name $shn_handle {
    "~^[a-z0-9-]+\.(?<p>[a-z0-9-]+)\.simple-host\.app$" $p;
    default "none";
}

# Own and shared domains: the folder under /srv/simple-host-next/certs/.
# An own domain is its own name; a shared domain's sites use the wildcard folder "*.<suffix>".
# One line per shared domain (the 4 carried ones; ADD A LINE AND RELOAD when a new shared
# domain is connected — the only case that needs a reload).
map $ssl_server_name $shn_cert {
    default $ssl_server_name;
    "~^[^.]+\.(?<s>quotes\.chhotabreak\.com)$"  "*.$s";
    "~^[^.]+\.(?<s>trips\.chhotabreak\.com)$"   "*.$s";
    "~^[^.]+\.(?<s>guide\.chhotabreak\.com)$"   "*.$s";
    "~^[^.]+\.(?<s>voucher\.chhotabreak\.com)$" "*.$s";
}


# ---------- port 80: ACME for everyone, HTTPS for the rest ----------
server {
    listen 80 default_server;
    server_name simple-host.app www.simple-host.app "~^[^.]+\.simple-host\.app$"
                "~^[a-z0-9-]+\.(?!lab\.)[a-z0-9-]+\.simple-host\.app$"
                simple-host.site "~^[^.]+\.simple-host\.site$" _;
    include /etc/nginx/snippets/old-ip-access.conf;
    # certbot's webroot first (old lineages still renewed by certbot), then the service's
    # own HTTP-01 answers for the certificates it issues.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri @shn_acme;
    }
    location @shn_acme {
        proxy_pass http://simple_host_next;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
    location / { return 301 https://$host$request_uri; }
}

# ---------- 443: the platform, simple-host.app (fixed certificate) ----------
server {
    listen 443 ssl;
    server_name simple-host.app www.simple-host.app mcp.simple-host.app;
    include /etc/nginx/snippets/old-ip-access.conf;
    access_log /var/log/nginx/access.log shsafe;
    ssl_certificate     /etc/letsencrypt/live/simple-host.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simple-host.app/privkey.pem;
    client_max_body_size 150m;

    location = /mcp {
        proxy_pass http://simple_host_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host simple-host.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        gzip off;
    }
    location / {
        proxy_pass http://simple_host_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host simple-host.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# ---------- 443: <handle>.simple-host.app (public pages) and short names (fixed wildcard) ----------
server {
    listen 443 ssl;
    server_name "~^[^.]+\.simple-host\.app$";
    include /etc/nginx/snippets/old-ip-access.conf;
    access_log /var/log/nginx/access.log shsafe;
    ssl_certificate     /etc/letsencrypt/live/simple-host.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simple-host.app/privkey.pem;
    client_max_body_size 150m;
    location / {
        proxy_pass http://simple_host_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# ---------- 443: <site>.<handle>.simple-host.app (existing accounts, per-handle certificate) ----------
# x.lab.simple-host.app stays excluded, as today.
server {
    listen 443 ssl;
    server_name "~^[a-z0-9-]+\.(?!lab\.)[a-z0-9-]+\.simple-host\.app$";
    include /etc/nginx/snippets/old-ip-access.conf;
    access_log /var/log/nginx/access.log shsafe;
    ssl_certificate     /etc/nginx/simple-host-site-certs/$shn_handle/fullchain.pem;
    ssl_certificate_key /etc/nginx/simple-host-site-certs/$shn_handle/privkey.pem;
    client_max_body_size 150m;
    location / {
        proxy_pass http://simple_host_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# ---------- 443: simple-host.site apex and www -> the app (as today) ----------
server {
    listen 443 ssl;
    server_name simple-host.site www.simple-host.site;
    include /etc/nginx/snippets/old-ip-access.conf;
    ssl_certificate     /etc/letsencrypt/live/simple-host.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simple-host.site/privkey.pem;
    return 301 https://simple-host.app/;
}

# ---------- 443: <site>--<handle>.simple-host.site and <handle>.simple-host.site ----------
# The only hosts behind Cloudflare (proxied *.simple-host.site). The visitor's address comes
# from CF-Connecting-IP, believed only from Cloudflare's ranges (refresh by hand from
# https://www.cloudflare.com/ips-v4 and /ips-v6; list as of the draft date). A direct
# connection is served and counted under its own address. Compression is left to Cloudflare.
server {
    listen 443 ssl;
    server_name "~^[^.]+\.simple-host\.site$";
    include /etc/nginx/snippets/old-ip-access.conf;
    access_log /var/log/nginx/access.log shsafe;
    ssl_certificate     /etc/letsencrypt/live/simple-host.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simple-host.site/privkey.pem;
    client_max_body_size 150m;
    gzip off;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://simple_host_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;   # the Cloudflare-resolved address
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# ---------- 443 default: own domains and shared domains (certificate per name) ----------
# Takes every SNI name no other enabled server names: the 14 own domains, the 4 shared
# domains' <label>.<suffix>, and any domain connected later (no reload: the service writes
# certs/<name>/ and nginx reads it on the next handshake). A name with no certificate
# fails the handshake, as today for unknown names.
server {
    listen 443 ssl default_server;
    server_name _;
    include /etc/nginx/snippets/old-ip-access.conf;
    access_log /var/log/nginx/access.log shsafe;
    ssl_certificate     /srv/simple-host-next/certs/$shn_cert/fullchain.pem;
    ssl_certificate_key /srv/simple-host-next/certs/$shn_cert/privkey.pem;
    client_max_body_size 150m;
    location / {
        proxy_pass http://simple_host_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
