<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Upload</title>
<style>
body{font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1a2233;background:#fff;max-width:560px;margin:0 auto;padding:10vh 20px}
h1{font-size:26px;margin:0 0 8px}p{color:#5b6576}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid #1a2233;background:#1a2233;color:#fff;cursor:pointer}
button:disabled{opacity:.5}input{font:inherit;margin:12px 0}
</style></head><body data-kind="{{kind}}">
<h1 id="title">Add photos and files</h1>
<p id="help">Photos are made smaller on this device before they are sent.</p>
<input id="pick" type="file" multiple>
<p><button id="send" disabled>Send</button></p>
<p id="status" role="status"></p>
<script>
const kind = document.body.dataset.kind, put = location.pathname.replace("/upload/", "/v1/uploads/");
const pick = document.getElementById("pick"), send = document.getElementById("send"), status = document.getElementById("status");
if (kind === "archive") {
  document.getElementById("title").textContent = "Send your site";
  document.getElementById("help").textContent = "Choose one .zip or .tar.gz archive of the whole site.";
  pick.multiple = false; pick.accept = ".zip,.tar.gz,.tgz";
} else {
  pick.accept = "image/*,*/*";
}
pick.onchange = () => { send.disabled = !pick.files.length; };
// shrink makes a photo at most 2400 px on its long side, as JPEG. Other files go as they are.
async function shrink(file) {
  if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(file.type)) return file;
  try {
    const img = await createImageBitmap(file), scale = Math.min(1, 2400 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(done => c.toBlob(done, "image/jpeg", 0.85));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, ".jpg"), {type: "image/jpeg"}) : file;
  } catch (e) { return file; }
}
send.onclick = async () => {
  send.disabled = true; status.textContent = "Sending…";
  let body;
  if (kind === "archive") {
    body = pick.files[0];
  } else {
    body = new FormData();
    for (const f of pick.files) body.append("file", await shrink(f));
  }
  const res = await fetch(put, {method: "PUT", body});
  const out = await res.json().catch(() => ({}));
  status.textContent = res.ok ? (out.url ? "Done. Your site is live at " + out.url : "Done. " + out.files.length + " sent. You can close this page.") : (out.fix || "That did not work. Try again.");
  if (!res.ok) send.disabled = false;
};
</script>
</body></html>
