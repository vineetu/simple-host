# Install to /etc/nginx/conf.d/analytics-logformat.conf
#
# Every server block that should feed analytics writes this format to
# /var/log/simple-host/analytics.log, and the app's ingester (ANALYTICS_LOG)
# reads that file. Without this file nginx will not start any vhost that names
# `shanalytics`; without the vhosts, analytics silently report zero for every
# site. It is required, not optional.
#
# Field order is the ingester's parse contract (internal/analytics/ingest.go):
# ts, host, status, method, request_uri, remote_addr, user_agent — tab separated.

log_format shanalytics '$time_iso8601\t$host\t$status\t$request_method\t$request_uri\t$remote_addr\t$http_user_agent';
