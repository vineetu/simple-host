# Install to /etc/nginx/conf.d/analytics-logformat.conf
#
# Every server block that should feed analytics writes this format to
# /var/log/simple-host/analytics.log, and the app's ingester (ANALYTICS_LOG)
# reads that file. Without this file nginx will not start any vhost that names
# `shanalytics`; without the vhosts, analytics silently report zero for every
# site. It is required, not optional.
#
# Field order is the ingester's parse contract (internal/analytics/ingest.go):
# ts, host, status, method, path, remote_addr, user_agent — tab separated.
#
# The path is $request_uri minus its query string: the ingester strips `?...`
# before every use, and query strings can carry emails or tokens. Not $uri,
# which is decoded and rewritten by index/try_files (a request for /a/b/ would
# log as /a/b/index.html).

map $request_uri $shanalytics_path {
    default            $request_uri;
    "~^(?<shanalytics_nq>[^?]*)\?"  $shanalytics_nq;
}

log_format shanalytics '$time_iso8601\t$host\t$status\t$request_method\t$shanalytics_path\t$remote_addr\t$http_user_agent';
