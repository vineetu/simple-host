# SIM-103: tag requests landing on the retiring ephemeral address so they can
# be tallied separately. 10.0.1.153 = old (ephemeral, being retired),
# 10.0.1.128 = new reserved IP (163.192.62.226). See jobs/oldip.report.md.
map $server_addr $old_ip {
    10.0.1.153  1;
    default     0;
}

# Coarse user-agent bucket only: never the raw string, and no visitor IP at all.
map $http_user_agent $old_ip_ua_class {
    default                                                           other;
    ""                                                                empty;
    "~*bot|crawl|spider|slurp|facebookexternalhit|bingpreview|ahrefs|semrush|mj12|petalbot|yandex" bot;
    "~*curl|wget|python-requests|libwww-perl|go-http-client|java/|scrapy|okhttp|axios|node-fetch|masscan|zgrab|nmap" script;
    "~*mozilla"                                                       browser;
}

log_format old_ip_access '$time_iso8601\t$host\t$ssl_server_name\t$status\t$old_ip_ua_class\t$server_addr';
