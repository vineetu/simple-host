# Install to /etc/nginx/conf.d/sidecar-rate-limits.conf
#
# Zones for the /eb2-api/* sidecar proxies in nginx-sites-content-host.conf.
# limit_req_zone is only valid in the http{} context, so it cannot live in the
# server block that uses it. Install both files or neither — nginx refuses to
# start on a `limit_req zone=` naming a zone that was never declared.

limit_req_zone $binary_remote_addr zone=eb2chat:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=eb2stt:1m rate=12r/m;
