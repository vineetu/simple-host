# Custom domain -> the one site it is bound to. Content served from the domains
# farm: domains/<domain> -> by-id/<user_id>/<site>. /v1 + /internal proxy to the app
# (^~ so they win over any path regex). Same-origin state API.
server {
    listen 443 ssl;
    server_name agent-deploy.dev;

    # Required for the site's analytics to count anything. Format defined in
    # nginx-analytics-logformat.conf; omit this and the site reports zero views.
    access_log /var/log/simple-host/analytics.log shanalytics;

    ssl_certificate     /etc/letsencrypt/live/agent-deploy.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent-deploy.dev/privkey.pem;

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # internal: reached only through this file's rewrites and error pages;
    # a request from outside gets 404 (nginx-internal-lock.sh).
    location ^~ /internal/ {
        internal;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /srv/simple-host/sites/domains/agent-deploy.dev/current;
    index index.html;
    # Taken down (operator), offline (owner) or passcode-locked (owner; the
    # app's gate gets the path and query): inside location / so /v1/ still
    # reaches the app. Take-down > offline > passcode, in that order.
    location / {
        if (-f /srv/simple-host/sites/domains/agent-deploy.dev/suspended) { rewrite ^ /internal/suspended last; }
        if (-f /srv/simple-host/sites/domains/agent-deploy.dev/offline) { rewrite ^ /internal/offline last; }
        if (-f /srv/simple-host/sites/domains/agent-deploy.dev/passcode) { rewrite ^ /internal/passcode$uri last; }
        try_files $uri $uri/ =404;
    }
}
# Redirect http -> https for the custom domain (keep the acme-challenge path working).
server {
    listen 80;
    server_name agent-deploy.dev;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
