# Install to /etc/systemd/journald.conf.d/30-retention.conf, then
# `sudo systemctl restart systemd-journald` (already installed on simple-host.app).
#
# The journal is otherwise bounded only by size (4 GB by default), which at this
# box's volume keeps entries for months. simple-host can log a visitor IP to it
# (internal/handler/reviewer.go, a refused reviewer sign-in), so this bounds the
# journal to 30 days, the same as the privacy page's "Log files are deleted after
# 30 days". It is box-wide: every service's journal gets the same limit.
[Journal]
MaxRetentionSec=30day
