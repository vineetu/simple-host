# Install to /etc/logrotate.d/simple-host-analytics
#
# The analytics log had no rotation at all: it grew unbounded from the day the
# ingester was switched on (20 MB / 200k lines in the first three weeks).
#
# IMPORTANT: use `create`, not `copytruncate`. The ingester tracks its position
# by (inode, byte offset). A `create` rotation changes the inode, which is the
# signal it uses to finish draining the old file (as `.log.1`) before starting
# the new one from zero. `copytruncate` keeps the inode and resets the length,
# which the ingester can only detect as a truncation -- it recovers, but any
# lines written between the copy and the truncate are lost.
#
# `delaycompress` is also load-bearing, not just polite: the ingester drains the
# previous file as plain text at `.log.1` and cannot read gzip. Delaying the
# compression by one cycle gives it a full day to finish before `.1` becomes
# `.2.gz`.
#
# Rotating also bounds how far `analytics-rebuild` can replay: it reads only the
# live file, so a rebuild after rotation covers this window, not all history.

/var/log/simple-host/analytics.log {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    create 0644 www-data root
    su root root
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid) || true
    endscript
}
