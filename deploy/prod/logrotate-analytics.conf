# Install to /etc/logrotate.d/simple-host-analytics
#
# The analytics log had no rotation at all: it grew unbounded from the day the
# ingester was switched on (20 MB / 200k lines in the first three weeks).
#
# IMPORTANT: use `create`, not `copytruncate`. The ingester tracks its position
# by (inode, byte offset). A `create` rotation changes the inode, which is the
# signal it uses to finish draining the old file (as `.log.1`) before starting
# the new one from zero. `copytruncate` keeps the inode and resets the length,
# which the ingester can only detect as a truncation -- it recovers, but any
# lines written between the copy and the truncate are lost.
#
# `delaycompress` is also load-bearing, not just polite: the ingester drains the
# previous file at `.log.1`, where it can match the inode it was reading and
# resume at its offset. Delaying the compression by one cycle gives it a full
# day to finish before `.1` becomes `.2.gz`.
#
# `create 0640 www-data simplehost`: nginx writes (its master opens the file as
# root), the ingester reads as the simplehost group, and nobody else can read
# visitor IPs and user agents.
#
# `rotate 29`: the live file holds today and each archive one more day, so the
# oldest raw IP on disk is about 30 days old -- what the privacy page promises
# ("Log files are deleted after 30 days"). `rotate 30` kept 31.
#
# `analytics-rebuild` replays the archives (.N.gz oldest first, then .1, then
# the live file), so a rebuild covers these ~30 days; aggregates older than
# the oldest archive cannot be rebuilt.

/var/log/simple-host/analytics.log {
    daily
    rotate 29
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data simplehost
    su root root
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid) || true
    endscript
}
