# Template for /etc/nginx/sites-available/simple-host-site: the base domain
# people's sites live under (simple-host.site; the app stays on
# simple-host.app). Rendered and installed by deploy/prod/nginx-site-base-domain.sh
# (dry run by default), which fills in:
#   __BASE__          the base domain            (simple-host.site)
#   __BASE_RE__       the same, dots escaped     (simple-host\.site)
#   __APP__           where the bare domain goes (simple-host.app)
#   __UPSTREAM__      the Go service             (127.0.0.1:8090)
#   __LE_LIVE__       certbot's live directory   (/etc/letsencrypt/live)
#   __CERTS__         per-person certificates    (/etc/nginx/simple-host-site-certs-site)
#   __ANALYTICS_LOG__ analytics access_log path  (/var/log/simple-host/analytics.log)
#   __BODY_MAX__      client_max_body_size, APEX_MODE=app only (64m)
#
# APEX_MODE=redirect (default): the bare domain and www 301 to __APP__.
# APEX_MODE=app: the bare domain is the app (proxied to __UPSTREAM__); www
# 301s to https://__BASE__. The script keeps one of the two marked blocks.
#
# The Go service does all routing and redirects; nginx only terminates TLS.
# No add_header anywhere here: nginx drops every inherited add_header in a
# block that declares its own, and HSTS plus the security headers come from
# conf.d/tls-hardening.conf at http level.

# --- HTTP: everything to HTTPS ---
server {
    listen 80;
    server_name __BASE__ *.__BASE__ "~^(?<site>[a-z0-9-]+)\.(?<person>[a-z0-9-]+)\.__BASE_RE__$";
    return 301 https://$host$request_uri;
}

# @apex-redirect
# --- HTTPS: the bare domain and www go to the app ---
server {
    listen 443 ssl;
    server_name __BASE__ www.__BASE__;
    ssl_certificate     __LE_LIVE__/__BASE__/fullchain.pem;
    ssl_certificate_key __LE_LIVE__/__BASE__/privkey.pem;
    return 301 https://__APP__/;
}
# @apex-redirect
# @apex-app
# --- HTTPS: the bare domain is the app ---
server {
    listen 443 ssl;
    server_name __BASE__;
    access_log /var/log/nginx/access.log;
    access_log __ANALYTICS_LOG__ shanalytics;
    ssl_certificate     __LE_LIVE__/__BASE__/fullchain.pem;
    ssl_certificate_key __LE_LIVE__/__BASE__/privkey.pem;
    client_max_body_size __BODY_MAX__;
    location ^~ /internal/ { internal; return 404; }
    location / {
        proxy_pass http://__UPSTREAM__;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- HTTPS: www goes to the apex ---
server {
    listen 443 ssl;
    server_name www.__BASE__;
    ssl_certificate     __LE_LIVE__/__BASE__/fullchain.pem;
    ssl_certificate_key __LE_LIVE__/__BASE__/privkey.pem;
    location ^~ /internal/ { internal; return 404; }
    location / {
        return 301 https://__BASE__$request_uri;
    }
}
# @apex-app

# --- HTTPS: a person's host (<handle>.__BASE__) ---
# One label, on the platform wildcard certificate. The apex and www are
# matched exactly above, and exact names win over regexes.
server {
    listen 443 ssl;
    server_name "~^[^.]+\.__BASE_RE__$";
    access_log /var/log/nginx/access.log;
    access_log __ANALYTICS_LOG__ shanalytics;
    ssl_certificate     __LE_LIVE__/__BASE__/fullchain.pem;
    ssl_certificate_key __LE_LIVE__/__BASE__/privkey.pem;
    location ^~ /internal/ { internal; return 404; }
    location / {
        proxy_pass http://__UPSTREAM__;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- HTTPS: a site's own host (<site>.<handle>.__BASE__) ---
# Each person has a *.<handle>.__BASE__ certificate, issued by
# simple-host-site-certs-site (root) and copied to __CERTS__/<handle>/ where
# the workers can read it; it is loaded per handshake by variable. A person
# without one fails the handshake, and the app never hands out or redirects to
# such a host.
map $ssl_server_name $sh_site_base_cert_person {
    "~^[a-z0-9-]+\.(?<p>[a-z0-9-]+)\.__BASE_RE__$" $p;
    default "none";
}
server {
    listen 443 ssl;
    server_name "~^(?<site>[a-z0-9-]+)\.(?<person>[a-z0-9-]+)\.__BASE_RE__$";
    access_log /var/log/nginx/access.log;
    access_log __ANALYTICS_LOG__ shanalytics;
    ssl_certificate     __CERTS__/$sh_site_base_cert_person/fullchain.pem;
    ssl_certificate_key __CERTS__/$sh_site_base_cert_person/privkey.pem;
    location ^~ /internal/ { internal; return 404; }
    location / {
        proxy_pass http://__UPSTREAM__;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
