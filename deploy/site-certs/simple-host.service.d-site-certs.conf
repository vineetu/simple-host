# /etc/systemd/system/simple-host.service.d/site-certs.conf
# The Go service writes certificate requests here (SITE_CERT_DIR/requests,
# and SITE_BASE_CERT_DIR/requests for simple-host.site);
# everything else under SITE_CERT_DIR stays read-only to it.
[Service]
ReadWritePaths=/var/lib/simple-host-site-certs/requests
ReadWritePaths=-/var/lib/simple-host-site-certs-site/requests
