# The Secret manifests/simple-hack.yaml expects. Fill in and apply BEFORE the
# bundle, in the same namespace; never commit the filled-in copy.
#
#   ADMIN_API_KEY     openssl rand -base64 36 | tr -d '/+=' | cut -c1-48
#   PASSCODE_ENC_KEY  openssl rand -base64 32   (exactly 32 bytes, base64; never change it later)
#   ANALYTICS_SALT    openssl rand -hex 16
#
# With `helm install` none of this is needed: the chart makes the Secret and
# keeps the generated values across upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: simple-hack-secrets
  namespace: simple-hack
type: Opaque
stringData:
  DB_DSN: postgres://hack:PASSWORD@postgres.example.internal:5432/hack?sslmode=require
  ADMIN_API_KEY: CHANGE-ME-48-RANDOM-CHARACTERS
  PASSCODE_ENC_KEY: CHANGE-ME-32-RANDOM-BYTES-BASE64=
  ANALYTICS_SALT: CHANGE-ME-RANDOM
  OIDC_CLIENT_SECRET: CLIENT-SECRET
  # RESEND_API_KEY: re_...        only with signIn.email
