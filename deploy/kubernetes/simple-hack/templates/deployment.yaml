apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hack.name" . }}
  labels:
    {{- include "hack.labels" . | nindent 4 }}
spec:
  # Exactly one pod, and the old one stops before the new one starts: the
  # server's upload locks, import tracker and rate limits are in-process, and
  # the volume is ReadWriteOnce. A rolling update would run two against one
  # disk.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hack.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # A changed setting restarts the pod; the server reads them at start.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "hack.podSecurity" . | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # SIGTERM: the server stops taking connections and finishes in-flight
      # requests within 10 s; the grace period leaves room for that and for
      # the ingress to notice the endpoint is gone.
      terminationGracePeriodSeconds: 30
      containers:
        - name: simple-hack
          image: {{ include "hack.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "hack.containerSecurity" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "hack.configName" . }}
            - secretRef:
                name: {{ include "hack.secretName" . }}
          {{- if .Values.database.existingSecret }}
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "hack.dataClaim" . }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSize }}
