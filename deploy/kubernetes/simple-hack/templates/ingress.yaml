{{- if .Values.ingress.enabled }}
{{- $hosts := list .Values.host (printf "*.%s" .Values.host) }}
{{- range .Values.ingress.events }}{{ $hosts = append $hosts (printf "*.%s.%s" . $.Values.host) }}{{ end }}
{{- range .Values.ingress.extraHosts }}{{ $hosts = append $hosts . }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hack.name" . }}
  labels:
    {{- include "hack.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      {{- with .Values.ingress.tlsSecretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hack.name" $ }}
                port:
                  name: http
    {{- end }}
    {{- if .Values.ingress.catchAll }}
    # No host: every <team>.<event>.<host>, which no Ingress wildcard can name.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hack.name" . }}
                port:
                  name: http
    {{- end }}
{{- end }}
