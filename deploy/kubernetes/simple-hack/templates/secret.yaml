{{- if not .Values.secrets.existingSecret }}
{{- /*
Generated values (the admin key, the passcode sealing key, the analytics
salt) are made once and kept: a re-render reads the live Secret back, so an
upgrade never rotates them (a new PASSCODE_ENC_KEY would make every stored
passcode and notification secret unreadable). `helm template` cannot look
up, so for rendered YAML use secrets.existingSecret (docs/kubernetes.md).
*/ -}}
{{- $name := include "hack.secretName" . -}}
{{- $live := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $admin := .Values.adminApiKey | default (index $live "ADMIN_API_KEY" | default "" | b64dec) | default (randAlphaNum 48) -}}
{{- $passcode := index $live "PASSCODE_ENC_KEY" | default "" | b64dec | default (randBytes 32) -}}
{{- $salt := index $live "ANALYTICS_SALT" | default "" | b64dec | default (randAlphaNum 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "hack.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall`: the passcode key is the only copy.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ADMIN_API_KEY: {{ $admin | quote }}
  PASSCODE_ENC_KEY: {{ $passcode | quote }}
  ANALYTICS_SALT: {{ $salt | quote }}
  {{- with .Values.database.dsn }}
  DB_DSN: {{ . | quote }}
  {{- end }}
  {{- with .Values.signIn.oidc.clientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.signIn.email.resendApiKey }}
  RESEND_API_KEY: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := .Values.extraSecrets }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
