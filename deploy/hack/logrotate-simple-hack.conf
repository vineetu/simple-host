# Install to /etc/logrotate.d/simple-hack
#
# Same rotation as deploy/prod/logrotate-analytics.conf, for the
# simple-hack.app instance's analytics log. `create` (not copytruncate)
# and `delaycompress` are load-bearing: the ingester tracks (inode, offset)
# and drains `.log.1` before the next cycle compresses it.
#
# `create 0640 www-data simplehack`: nginx writes, the simple-hack service
# reads as the simplehack group, nobody else can read visitor IPs.
#
# `rotate 29`: live file plus 29 daily archives, about 30 days, matching
# the privacy page.

/var/log/simple-hack/analytics.log {
    daily
    rotate 29
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data simplehack
    su root root
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid) || true
    endscript
}
