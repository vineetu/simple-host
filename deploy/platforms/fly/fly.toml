# Simple Host small box on Fly.io. docs/platforms/fly.md walks through it.
# Set `app` and the three hostnames, then run `fly deploy` from this directory.
app = "my-simple-host"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"
  [build.args]
    SIMPLE_HOST_VERSION = "0.7.15"

[deploy]
  # Loads the schema into a new database, then `simple-host migrate`, on a
  # throwaway machine before every deploy. A failure stops the deploy and
  # leaves the running version alone.
  release_command = "release"

[env]
  SITE_DOMAIN = "hack.example.com"
  CONTENT_HOST = "sites.hack.example.com"
  PUBLIC_BASE_URL = "https://hack.example.com"
  # How big one website may be (MB), and how many deploys of each to keep.
  # The VPS small box keeps 1 (no rollback); 3 allows going back two versions.
  MAX_ARCHIVE_MB = "100"
  KEEP_VERSIONS = "3"

# Published sites and the access log. The database is the Postgres app.
[mounts]
  source = "simple_host_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: sign-in codes, saved data and background cleanup need the
  # process running, and a volume pins the app to one machine anyway.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
