# Preserve CA-specific renewal and Google pacing; share the issuance lock.
[Unit]
StartLimitIntervalSec=15min
StartLimitBurst=4

[Service]
ExecStart=
ExecStart=/usr/local/lib/simple-host-cert-issuers/certbot-locked /usr/local/lib/simple-host-cert-issuers/google-certbot -q renew --no-random-sleep-on-renew
Restart=on-failure
RestartPreventExitStatus=1
RestartSec=2min
TimeoutStartSec=45min
